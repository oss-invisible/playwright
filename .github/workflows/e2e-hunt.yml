# ─────────────────────────────────────────────────────────────────────────────
# e2e-hunt.yml - runs the e2e suite in a LOOP until it catches a hang.
#
# Why it exists. The e2e job hangs in 12% of runs (4 out of 33 between
# 2026-08-01 and 08-13), and the 40-minute ceiling kills the job. At 12% a
# green run proves nothing, and it takes ~18 runs to have a 90% probability
# of seeing one: waiting for it to happen on its own on a PR means waiting
# days and burning someone else's time every time.
#
# And why HERE and not locally, for TWO different reasons depending on the
# `os` input.
#
#   ubuntu-24.04 - the job hang lived there. CLOSED on 2026-08-13 with 36
#   runs (two hunts of 18): zero hangs, zero retries. Stays as a
#   non-regression check.
#
#   windows-latest - a different question, still open: on the dev machine
#   interaction tests produce retries (41 out of 17 runs) and on Linux not
#   even one in 36. But that machine was not idle - whoever was measuring
#   was running on it, and later the owner came back to it - so the
#   comparison is CONFUSED between platform and contention. A dedicated
#   Windows runner separates the two without asking anyone to stay off it
#   for six hours.
#
# A second use, chosen by the input `ab_network_webrtc_seed` (empty = the loop
# above, as always): the network oracle's WebRTC walk of that seed, alone,
# `runs` times for each engine of its A/A (the published engine twice). It
# exists to tell two readings apart when the A/A of that walk differs from
# itself in the number of TURN Allocate datagrams (scripts/ci_ab_network.py:
# AB_NETWORK_HUNT): each repetition keeps every datagram with its time and its
# STUN transaction id and the page's own ICE times (network/hunt/<engine>-<i>.json,
# summary in network/hunt/summary.json). It decides nothing: the step exits 0.
#
# Doesn't start on its own: `workflow_dispatch` only. It's not a gate, it's
# an investigation tool, and it must not be added to the required contexts.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e hunt

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs at most (at 12% it takes ~18 for a 90% chance)"
        required: false
        default: "18"
      ab_network_webrtc_seed:
        description: "A seed (e.g. 4) to repeat ONLY the network oracle's WebRTC walk of, `runs` times for each engine of its A/A, instead of the e2e loop. Empty: the e2e loop."
        required: false
        default: ""
      os:
        description: "Where to hunt. windows-latest answers a DIFFERENT question: are the interaction retries seen on the dev machine the product or contention?"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token.
# Anonymous requests share a 60-an-hour limit per runner address and are the
# ones GitHub drops first when it is degraded (2026-11-08: timeouts for
# unauthenticated users failed the gates three times). user-install.yml stays
# anonymous on purpose: it is the user's path.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The Ubuntu packages of the Linux hunt, from Ubuntu's archive once per runner image and list (linux-deps.yml), never by the hunt. On Windows this job is
  # skipped and the hunt runs on (the condition below accepts `skipped` and `success`, nothing else).
  linux-deps-hunt:
    name: linux-deps-hunt
    if: startsWith(inputs.os, 'ubuntu')
    uses: ./.github/workflows/linux-deps.yml
    with:
      name: hunt
      packages: xvfb
      playwright_wrapper_ref: ${{ github.sha }}

  hunt:
    name: hunt (${{ inputs.os }})
    needs: linux-deps-hunt
    if: ${{ !cancelled() && (needs.linux-deps-hunt.result == 'success' || needs.linux-deps-hunt.result == 'skipped') }}
    runs-on: ${{ inputs.os }}
    # 18 runs of ~6 minutes plus install time. Deliberately generous: the
    # ceiling here must NEVER be the thing that stops the hunt, or we're back
    # to a killed job that explains nothing, which is the original defect.
    timeout-minutes: 300
    # On Windows GitHub runs `run:` blocks with POWERSHELL, not bash, and the
    # first launch on windows-latest died in 5 minutes with a ParserError on
    # the line `if [ "$RUNNER_OS" = "Linux" ]`. The block had been run before
    # shipping it, as the rule requires - but in bash, on the writer's own
    # machine, i.e. with an interpreter different from the target's.
    # Running the block is not enough: it has to run with the runner's SHELL.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ pinned Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      # Linux only: on Windows the browser launches on the runner's desktop,
      # and `firefox-launch-matrix.yml` has shown for months that it really
      # starts there.
      - name: The Linux packages (the run's linux-deps-hunt job, no mirror)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-hunt.outputs.artifact }}
          path: /tmp/linux-deps
      - name: System deps (xvfb + Firefox runtime libs; the repository of the linux-deps-hunt job)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
      - name: The security state (a fixed directory of the repository)
        if: inputs.ab_network_webrtc_seed != ''
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        if: inputs.ab_network_webrtc_seed != ''
        run: python scripts/ci_lab_geoip.py build

      # The hunt of the network oracle's WebRTC walk: instead of the loop below, never with it. `runs` is the number of repetitions per engine.
      - name: The network oracle's WebRTC walk of one seed, repeated (decides nothing)
        if: inputs.ab_network_webrtc_seed != ''
        env:
          PYTHONUNBUFFERED: "1"
          AB_NETWORK_HUNT: webrtc:${{ inputs.ab_network_webrtc_seed }}:${{ inputs.runs }}
        run: |
          set -u
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          mkdir -p network
          $PRE python -u scripts/ci_ab_network.py ab --a-a --out network --published-binary "$FF"

      - name: Loop until it catches one
        if: inputs.ab_network_webrtc_seed == ''
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: evidence/e2e-watchdog.log
        run: |
          set -u
          runs="${{ inputs.runs }}"
          mkdir -p evidence/runs
          # `evidence/` inside the workspace, not RUNNER_TEMP: on Windows that
          # variable contains backslashes and does not cross bash reliably.
          # xvfb only where it exists; on Windows the browser goes to the
          # runner's desktop.
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          captured=0
          for n in $(seq 1 "$runs"); do
            log="evidence/runs/run_$(printf '%02d' "$n").log"
            t0=$(date +%s)
            set +e
            $PRE python -u scripts/run_e2e.py "$FF" > "$log" 2>&1
            code=$?
            set -e
            dur=$(( $(date +%s) - t0 ))
            # A hang is no longer a killed job now: the per-test deadline
            # turns it into a failure, and the banner names it.
            if grep -aq "Timeout" "$log" && grep -aq "Stack of" "$log"; then
              echo "::error::run $n: HANG CAUGHT after ${dur}s"
              echo "--- the last test that spoke ---"
              grep -aE "::.*(PASSED|SKIPPED|FAILED)" "$log" | tail -3
              echo "--- the stack ---"
              sed -n '/Timeout/,$p' "$log" | head -60
              captured=1
              break
            fi
            echo "run $n/$runs: exit=$code, ${dur}s"
          done
          if [ "$captured" = "0" ]; then
            echo "::warning::$runs runs, no hang caught."
            echo "If the rate here is the same 12%, the probability of this"
            echo "outcome is $(python -c "print(round(100*0.88**$runs))")%, so this is not proof"
            echo "the defect is not there: it is a measurement of the rate with this sample."
          fi
          # The step fails ONLY if it caught one: that way red means "found",
          # not "broken", and red is what you go read.
          exit "$captured"

      - name: Upload all the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hunt-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs
            evidence/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the hunt of the network oracle's WebRTC walk
        if: always() && inputs.ab_network_webrtc_seed != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hunt-network-webrtc-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: network/hunt
          if-no-files-found: warn
          retention-days: 14
