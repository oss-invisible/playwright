# ─────────────────────────────────────────────────────────────────────────────
# e2e-hunt.yml - runs the e2e suite in a LOOP until it catches a hang.
#
# Why it exists. The e2e job hangs in 12% of runs (4 out of 33 between
# 2026-08-01 and 08-13), and the 40-minute ceiling kills the job. At 12% a
# green run proves nothing, and it takes ~18 runs to have a 90% probability
# of seeing one: waiting for it to happen on its own on a PR means waiting
# days and burning someone else's time every time.
#
# And why HERE and not locally, for TWO different reasons depending on the
# `os` input.
#
#   ubuntu-24.04 - the job hang lived there. CLOSED on 2026-08-13 with 36
#   runs (two hunts of 18): zero hangs, zero retries. Stays as a
#   non-regression check.
#
#   windows-latest - a different question, still open: on the dev machine
#   interaction tests produce retries (41 out of 17 runs) and on Linux not
#   even one in 36. But that machine was not idle - whoever was measuring
#   was running on it, and later the owner came back to it - so the
#   comparison is CONFUSED between platform and contention. A dedicated
#   Windows runner separates the two without asking anyone to stay off it
#   for six hours.
#
# Doesn't start on its own: `workflow_dispatch` only. It's not a gate, it's
# an investigation tool, and it must not be added to the required contexts.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e hunt

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs at most (at 12% it takes ~18 for a 90% chance)"
        required: false
        default: "18"
      os:
        description: "Where to hunt. windows-latest answers a DIFFERENT question: are the interaction retries seen on the dev machine the product or contention?"
        required: false
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - windows-latest
      pattern:
        description: "suite-loop: the e2e suite in a loop (the job above). goto-after-launch: the first goto of a page of a served browser just launched, on Windows (scripts/hunt_goto_after_launch.py)"
        required: false
        default: "suite-loop"
        type: choice
        options:
          - suite-loop
          - goto-after-launch
      engine_run_id:
        description: "goto-after-launch: the run of the engine's repository whose asset-win-x86_64 to drive (empty: the published engine)"
        required: false
        default: ""
      seal_tag:
        description: "goto-after-launch: the tag that engine is sealed under (a candidate: firefox-NN-candidate)"
        required: false
        default: "firefox-68-candidate"
      core_ref:
        description: "goto-after-launch: the core to install from git over the pinned one (empty: the pin)"
        required: false
        default: ""
      shards:
        description: "goto-after-launch: the shards, a JSON list, eight at most (the account's queue is shared)"
        required: false
        default: "[1,2,3,4,5,6,7,8]"
      procs:
        description: "goto-after-launch: hunters at once in each shard (the gate runs its e2e on four workers)"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token.
# Anonymous requests share a 60-an-hour limit per runner address and are the
# ones GitHub drops first when it is degraded (2026-11-08: timeouts for
# unauthenticated users failed the gates three times). user-install.yml stays
# anonymous on purpose: it is the user's path.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    if: inputs.pattern != 'goto-after-launch'
    name: hunt (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    # 18 runs of ~6 minutes plus install time. Deliberately generous: the
    # ceiling here must NEVER be the thing that stops the hunt, or we're back
    # to a killed job that explains nothing, which is the original defect.
    timeout-minutes: 300
    # On Windows GitHub runs `run:` blocks with POWERSHELL, not bash, and the
    # first launch on windows-latest died in 5 minutes with a ParserError on
    # the line `if [ "$RUNNER_OS" = "Linux" ]`. The block had been run before
    # shipping it, as the rule requires - but in bash, on the writer's own
    # machine, i.e. with an interpreter different from the target's.
    # Running the block is not enough: it has to run with the runner's SHELL.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ pinned Playwright)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      # Linux only: on Windows the browser launches on the runner's desktop,
      # and `firefox-launch-matrix.yml` has shown for months that it really
      # starts there.
      - name: System deps (xvfb + Firefox runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"

      - name: Loop until it catches one
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: evidence/e2e-watchdog.log
        run: |
          set -u
          runs="${{ inputs.runs }}"
          mkdir -p evidence/runs
          # `evidence/` inside the workspace, not RUNNER_TEMP: on Windows that
          # variable contains backslashes and does not cross bash reliably.
          # xvfb only where it exists; on Windows the browser goes to the
          # runner's desktop.
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          captured=0
          for n in $(seq 1 "$runs"); do
            log="evidence/runs/run_$(printf '%02d' "$n").log"
            t0=$(date +%s)
            set +e
            $PRE python -u scripts/run_e2e.py "$FF" > "$log" 2>&1
            code=$?
            set -e
            dur=$(( $(date +%s) - t0 ))
            # A hang is no longer a killed job now: the per-test deadline
            # turns it into a failure, and the banner names it.
            if grep -aq "Timeout" "$log" && grep -aq "Stack of" "$log"; then
              echo "::error::run $n: HANG CAUGHT after ${dur}s"
              echo "--- the last test that spoke ---"
              grep -aE "::.*(PASSED|SKIPPED|FAILED)" "$log" | tail -3
              echo "--- the stack ---"
              sed -n '/Timeout/,$p' "$log" | head -60
              captured=1
              break
            fi
            echo "run $n/$runs: exit=$code, ${dur}s"
          done
          if [ "$captured" = "0" ]; then
            echo "::warning::$runs runs, no hang caught."
            echo "If the rate here is the same 12%, the probability of this"
            echo "outcome is $(python -c "print(round(100*0.88**$runs))")%, so this is not proof"
            echo "the defect is not there: it is a measurement of the rate with this sample."
          fi
          # The step fails ONLY if it caught one: that way red means "found",
          # not "broken", and red is what you go read.
          exit "$captured"

      - name: Upload all the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-hunt-${{ inputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/runs
            evidence/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # The first goto of a page of a served browser just launched, told started and then neither committed nor aborted
  # (gate-only 44746170375 on firefox-68, gate 43889076032 on firefox-66: Windows, the stock client, nav-21 both times).
  # Each shard repeats the shape `runs` times (scripts/hunt_goto_after_launch.py) with the engine's diagnostics on, and
  # keeps only the folder of the session that caught it: the Juggler's trace (an engine that has INVISIBLE_JUGGLER_TRACE_DIR)
  # and the MOZ_LOG of the docshell, the document channel and the process isolation. Red means caught.
  # ───────────────────────────────────────────────────────────────────────────
  goto-after-launch:
    if: inputs.pattern == 'goto-after-launch'
    name: goto after launch (windows, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 150
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The engine under test (an asset of the engine's repository)
        if: inputs.engine_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: asset-win-x86_64
          path: art
          run-id: ${{ inputs.engine_run_id }}
          repository: oss-invisible/firefox_antidetect_patch
          github-token: ${{ github.token }}
      - name: Install the wrapper, the stock client and the core under test
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          if [ -n "$CORE_REF" ]; then python -m pip install --force-reinstall "git+https://github.com/oss-invisible/core@$CORE_REF"; fi
      - name: The GeoIP database and the intermediates (set by the repository, as the gate does)
        run: |
          python scripts/ci_lab_geoip.py build --pin ci/geoip.json
          python scripts/ci_lab_intermediates.py set --pin ci/intermediates.pin.json
      - name: Locate the engine (and seal it when it is a candidate)
        env:
          SEAL_TAG: ${{ inputs.seal_tag }}
        run: |
          set -e
          if [ -d art ]; then
            set -- art/firefox-*-stealth-win-x86_64.*
            [ "$#" -eq 1 ] && [ -e "$1" ] || { echo "ERROR: expected one firefox-*-stealth-win-x86_64 archive in art/, found: $*"; exit 1; }
            mkdir -p ff
            python -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall('ff')" "$1"
            FF="$PWD/ff/firefox.exe"
            export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
            python -m invisible_core seal --binary "$FF" --tag "$SEAL_TAG" -o hunt.seal.json
            echo "INVISIBLE_SEAL_FILE=$PWD/hunt.seal.json" >> "$GITHUB_ENV"
          else
            FF="$(python -m invisible_playwright fetch | tail -1)"
          fi
          echo "FF=$FF" >> "$GITHUB_ENV"
      - name: Repeat the shape until it catches one
        env:
          PYTHONUNBUFFERED: "1"
          INVISIBLE_CORE_AUTOFIX: "off"
          INVISIBLE_CORE_PIN: "allow"
        run: |
          # `procs` hunters at once, each with its own folder: the load of the gate's four workers. Red when any caught one.
          mkdir -p evidence/goto-hunt
          pids=()
          for i in $(seq 1 "${{ inputs.procs }}"); do
            python -u scripts/hunt_goto_after_launch.py "$FF" --rounds "${{ inputs.runs }}" --evidence "evidence/goto-hunt/p$i" > "evidence/hunter-$i.log" 2>&1 &
            pids+=($!)
          done
          status=0
          for i in "${!pids[@]}"; do wait "${pids[$i]}" || status=1; done
          for f in evidence/hunter-*.log; do echo "== $f"; grep -E "CAUGHT|\"rounds\"|Traceback" "$f" || tail -3 "$f"; done
          exit $status
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goto-hunt-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/goto-hunt
            evidence/hunter-*.log
          if-no-files-found: warn
          retention-days: 14
