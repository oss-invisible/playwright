# HUNT ONLY, never merged. Is the WebGL read-time projection readable as an artefact? WebGL readPixels of the gradient (exact answer
# known) and noise contents, 1024x1024: ours (published firefox-64, projection on), ours_noproj (projection off from the hunt), and
# retail Firefox 159.0 launched by hand, on windows-2022. Statistics of the low bits (scripts/hunt_readback_probe.js lowStats).
name: projection low bits hunt
on:
  push:
    branches: [hunt/projection-low-bits]
    paths: [scripts/hunt_readback_probe.js, .github/workflows/projection-low-bits-hunt.yml]
permissions:
  contents: read
concurrency:
  group: projection-low-bits-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  hunt:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
      - name: The published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database
        run: python scripts/ci_lab_geoip.py build
      - name: Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS)
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/rb/retail"
      - name: One run per arm
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set +e
          for arm in ours ours_noproj; do taskkill //F //IM firefox.exe //T > /dev/null 2>&1; python -u scripts/hunt_readback.py run --arm $arm --binary "$FF" --out "$RUNNER_TEMP/rb/r1"; done
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1
          python -u scripts/hunt_readback.py run --arm retail --retail-from "$RUNNER_TEMP/rb/retail" --out "$RUNNER_TEMP/rb/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1; true
      - name: The statistics
        if: always()
        run: |
          python - "$RUNNER_TEMP/rb/r1" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          for c in ("gradient", "noise", "triangle", "flat"):
              for surface in ("webgl", "canvas2d"):
                  for arm in ("ours", "ours_noproj", "retail"):
                      f = root / ("%s.json" % arm)
                      if not f.is_file():
                          print("HUNTBITS %s %s %s: no result" % (c, surface, arm)); continue
                      st = ((((json.loads(f.read_text(encoding="utf-8")).get("probe") or {}).get("contents") or {}).get(c) or {}).get(surface) or {}).get("stats")
                      print("HUNTBITS %-8s %-8s %-11s %s" % (c, surface, arm, json.dumps(st, sort_keys=True)))
          PY
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "projection-low-bits-${{ github.run_id }}", path: "${{ runner.temp }}/rb/r1" }
