# ─────────────────────────────────────────────────────────────────────────────
# fontconfig-host-rules-hunt.yml - TEMPORARY MEASUREMENT, not a gate.
#
# What it asks. On the published engine (the one `fetch` downloads for the core
# on the index), on Linux: do the HOST's fontconfig rules (rgba, lcdfilter,
# autohint, embeddedbitmap, and an alias of system-ui) change the pixels of the
# text a page reads with getImageData, on an opaque canvas and on a default one,
# with faces of the bundle that carry embedded bitmaps? Nine launches of one seed,
# each with its own FONTCONFIG_FILE; the test asserts the same bytes in all of
# them and records every hash to result.json (artifact fcrules-<run id>).
#
# It runs only on a push to the branch hunt/fontconfig-host-rules, and is
# deleted with that branch once the question is answered. It is in no list of
# required suites (tests/test_the_e2e_suite_is_accounted_for.py names the test
# as an exclusion, with the reason).
# ─────────────────────────────────────────────────────────────────────────────
name: fontconfig host rules hunt

on:
  push:
    branches: [hunt/fontconfig-host-rules]

permissions:
  contents: read

concurrency:
  group: hunt-fontconfig-host-rules-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token
# (anonymous requests share a 60-an-hour limit per runner address).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: fontconfig rules (linux, xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          # Only for `playwright install-deps firefox` below (the system libraries Firefox needs on a bare runner).
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs + fontconfig tools and a host face)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fontconfig fonts-dejavu-core
          sudo "$(which python)" -m playwright install-deps firefox
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build

      - name: The measurement (nine launches, one seed)
        env:
          PYTHONUNBUFFERED: "1"
          FCRULES_RESULT_DIR: ${{ runner.temp }}/fcrules
          TEST_FILE: tests/test_the_host_fontconfig_rules_do_not_reach_the_text_pixels_linux_e2e.py
        run: |
          unset INVISIBLE_CORE_PIN
          mkdir -p "$FCRULES_RESULT_DIR"
          CMD="xvfb-run -a python -u -m pytest $TEST_FILE -m e2e -n 0 -o addopts='' -p no:cacheprovider -p no:rerunfailures -s -o junit_family=xunit2 --junitxml=$FCRULES_RESULT_DIR/junit.xml"
          ENGINE_TAG="$(python -c 'from invisible_core.seal import active_seal; print(active_seal().tag)' || echo unknown)"
          CORE_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("invisible-core"))' || echo unknown)"
          WRAPPER_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("invisible-playwright"))' || echo unknown)"
          python - <<PY
          import json, os
          meta = {
              "runner_image": os.environ.get("ImageOS", "") + " " + os.environ.get("ImageVersion", ""),
              "engine_tag": "$ENGINE_TAG",
              "engine_binary": os.environ.get("FF", ""),
              "core_version": "$CORE_VERSION",
              "wrapper_version": "$WRAPPER_VERSION",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "command": """$CMD""",
          }
          with open(os.path.join(os.environ["FCRULES_RESULT_DIR"], "meta.json"), "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=1, sort_keys=True)
          print(json.dumps(meta, indent=1, sort_keys=True))
          PY
          eval "$CMD"

      - name: Upload the record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fcrules-${{ github.run_id }}
          path: ${{ runner.temp }}/fcrules
          if-no-files-found: warn
          retention-days: 14
