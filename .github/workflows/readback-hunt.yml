# ─────────────────────────────────────────────────────────────────────────────
# readback-hunt.yml - HUNT ONLY, never merged. Nothing of the product is changed: the pref of the arm ours_noproj goes through extra_prefs, from the hunt.
# Starts on its own paths only (the hunts running on this branch are not restarted by it, and it is not restarted by them).
#
# Measured (43656857973): WebGL readPixels 1024x1024 repeat p50 is ~250-290 ms in ours, with or without MSAA, against 5-9 ms in stock and retail 159; toDataURL 1024 ~140-170 ms
# against 12-18. MSAA is not the cause. Suspect: the read-time canvas projection of the engine (the engine source tree): gfx/2d/StealthCanvasProjection.cpp StealthProjectPixels, applied to WebGL and
# WebGPU reads only (never to a 2D canvas), on when zoom.stealth.fpp.hw_seed > 0 and zoom.stealth.canvas.substitute_pixels is true (gfx/thebes/StealthDeclarationGate.h:54-62). Its cost is
# data-dependent: a pixel with a differing 4-neighbour builds a 3x3 neighbourhood and runs OnOneSegment (StealthCanvasProjection.cpp:89-129); the probes so far drew a ramp in which EVERY pixel is such an edge.
# Arms: ours, ours_noproj (zoom.stealth.canvas.substitute_pixels=false from the hunt), stockheaded, retail 159.0 launched by hand (Mozilla's installer, checked against SHA256SUMS).
#   - timing, per content (flat, halves, triangle, gradient, noise), 1024x1024, antialias:false: WebGL readPixels and toDataURL, canvas 2D getImageData and toDataURL (the 2D canvas is never
#     projected: if it is slow too, the cause is elsewhere); ms per MB; a hash of the bytes; two rounds in reversed order;
#   - the 256x256 diagonal-edge scene with antialias:false, pixel by pixel: is the 1-level difference of ours against retail the projection (ours_noproj against retail)?
#   - a Gecko profile with symbols of EVERY process and thread (MOZ_PROFILER_STARTUP_FILTERS=*) during 20 readPixels and 20 toDataURL of the gradient canvas, for ours and for ours_noproj:
#     which process reads (content or GPU) and the top functions by self time (hunt_profile_summary.py, symbols as in hunt_fetch_symbols.py).
# Every step is continue-on-error: a hunt must give whatever it got.
# ─────────────────────────────────────────────────────────────────────────────
name: readback hunt

on:
  push:
    branches: [hunt/cpu-render-path]
    paths:
      - scripts/hunt_readback.py
      - scripts/hunt_readback_probe.js
      - .github/workflows/readback-hunt.yml
  workflow_dispatch:
    inputs:
      symbols_run:
        description: "Run id of the engine's release.yml whose symbols-win-x86_64 artifact matches the binary (empty: look through the recent runs)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: readback-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, readPixels and toDataURL cost: ours, ours_noproj, stockheaded, retail; profile with symbols)"
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: "Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS, unpacked with 7-Zip)"
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/rb/retail"

      # ------------------------------------------------------------------------------------------ the prefs, read back
      - name: "Facts, arm ours (effective zoom.stealth.canvas.* and fpp.hw_seed)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py facts --arm ours --binary "$FF" --out "$RUNNER_TEMP/rb/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm ours_noproj (effective zoom.stealth.canvas.* and fpp.hw_seed)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py facts --arm ours_noproj --binary "$FF" --out "$RUNNER_TEMP/rb/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true

      # ------------------------------------------------------------------------------------------ timing per content, two rounds
      - name: "Round 1, arm ours"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/rb/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm retail"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm retail --retail-from "$RUNNER_TEMP/rb/retail" --out "$RUNNER_TEMP/rb/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm ours_noproj"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm ours_noproj --binary "$FF" --out "$RUNNER_TEMP/rb/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm stockheaded"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm stockheaded --out "$RUNNER_TEMP/rb/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm stockheaded"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm stockheaded --out "$RUNNER_TEMP/rb/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours_noproj"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm ours_noproj --binary "$FF" --out "$RUNNER_TEMP/rb/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm retail"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm retail --retail-from "$RUNNER_TEMP/rb/retail" --out "$RUNNER_TEMP/rb/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/rb/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Table: cost per content and per MB, the 2D control, the bytes, the edge scene"
        if: always()
        continue-on-error: true
        run: |
          cp -r "$RUNNER_TEMP/rb/r0/"*-facts "$RUNNER_TEMP/rb/r1/" 2>/dev/null || true
          python -u scripts/hunt_readback.py table "$RUNNER_TEMP/rb/r1" "$RUNNER_TEMP/rb/r2" | tee "$RUNNER_TEMP/rb/table.txt"

      # ------------------------------------------------------------------------------------------ the Gecko profile, with symbols
      - name: "Profile, arm ours (20 readPixels + 20 toDataURL of the gradient canvas, every process and thread)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py profile --arm ours --binary "$FF" --out "$RUNNER_TEMP/rb/profiles"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Profile, arm ours_noproj (the same, projection off)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_readback.py profile --arm ours_noproj --binary "$FF" --out "$RUNNER_TEMP/rb/profiles"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Symbols of our engine (artifact symbols-win-x86_64 of the engine's release.yml)"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="$RUNNER_TEMP/rb/profiles"
          ID="$(python scripts/hunt_profile_summary.py "$P/ours" --ids | awk '$3=="xul.dll"{print $2}' | head -1)"
          echo "breakpad id of our xul.dll in the profile: '$ID'"
          if [ -z "$ID" ]; then echo "SYMBOLS: none (no id: no parent profile of ours)"; exit 0; fi
          python scripts/hunt_fetch_symbols.py --id "$ID" --run "${{ inputs.symbols_run }}" --out "$RUNNER_TEMP/rb/symbols" | tee "$RUNNER_TEMP/rb/symbols.log"
      - name: "Profile summary, ours: which process reads, top 20 functions by self time (content and GPU processes, every thread)"
        if: always()
        continue-on-error: true
        run: |
          P="$RUNNER_TEMP/rb/profiles/ours"
          SYM=$(ls "$RUNNER_TEMP"/rb/symbols/symbols-*.zip 2>/dev/null | head -1 || true)
          python -u scripts/hunt_profile_summary.py "$P" ${SYM:+--symbols "$SYM"} --only tab,gpu --detail 3 --thread-table --threads 3 --top 20 | tee "$P/summary.txt"
      - name: "Profile summary, ours_noproj (what is left when the projection is off)"
        if: always()
        continue-on-error: true
        run: |
          P="$RUNNER_TEMP/rb/profiles/ours_noproj"
          SYM=$(ls "$RUNNER_TEMP"/rb/symbols/symbols-*.zip 2>/dev/null | head -1 || true)
          python -u scripts/hunt_profile_summary.py "$P" ${SYM:+--symbols "$SYM"} --only tab,gpu --detail 3 --threads 3 --top 20 | tee "$P/summary.txt"

      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readback-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rb/r0
            ${{ runner.temp }}/rb/r1
            ${{ runner.temp }}/rb/r2
            ${{ runner.temp }}/rb/table.txt
            ${{ runner.temp }}/rb/profiles
            ${{ runner.temp }}/rb/symbols.log
          if-no-files-found: warn
          retention-days: 14
