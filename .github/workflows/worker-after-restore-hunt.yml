name: worker after restore hunt
# Hunt: after a restore from the back-forward cache, how often does Page.workerDestroyed come for the restored
# worker, and is the worker alive (it answers a postMessage within 3 s) or dead when it does? Four processes in
# parallel on each OS (the load of xdist). Nothing is asserted; the records are the artifact.
on:
  push:
    branches: [hunt/worker-after-restore]
    paths: [scripts/hunt_worker_after_restore.py, .github/workflows/worker-after-restore-hunt.yml]
permissions:
  contents: read
env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: worker-after-restore-hunt
  cancel-in-progress: true
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The same scenario, 15 repetitions in each of 4 processes (60 per scenario and OS)
        env:
          PYTHONUNBUFFERED: "1"
          MOZ_CRASHREPORTER_DISABLE: "1"
        run: |
          set +e +o pipefail
          mkdir -p hunt-out
          export SCEN="top-other-site-location:plain,top-other-site-location:pinger,top-same-site-location:plain,top-other-site-goto:plain,oop-frame-other-site-location:plain"
          cat > hunt-out/run4.sh <<'EOF'
          for p in 1 2 3 4; do
            python -u scripts/hunt_worker_after_restore.py "$FF" --out "hunt-out/part-$p.json" --reps 15 --proc $p \
              --deadline-minutes 45 --scenarios "$SCEN" > "hunt-out/part-$p.log" 2>&1 &
          done
          wait
          EOF
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bash hunt-out/run4.sh; else bash hunt-out/run4.sh; fi
          cat hunt-out/part-*.log | grep -E "^HUNTROW" | cut -c1-260
          python scripts/hunt_worker_after_restore.py --summarize hunt-out/part-*.json --summary-out "hunt-out/summary-$RUNNER_OS.json"
          python -c "import json,platform;print('SEAL', [m.get('seal_tag') for m in json.load(open('hunt-out/summary-$RUNNER_OS.json'))['metas']], platform.platform())"
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo pkill -9 -f firefox || true; else taskkill //F //IM firefox.exe //T 2>/dev/null || true; fi
          echo done
      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-after-restore-${{ runner.os }}-${{ github.run_id }}
          path: hunt-out/
