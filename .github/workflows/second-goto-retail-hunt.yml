# ─────────────────────────────────────────────────────────────────────────────
# second-goto-retail-hunt.yml - a MEASUREMENT, not a gate: who wins in the REAL
# Firefox when a second navigation starts while the first changes process.
# Firefox 159.0 retail from archive.mozilla.org (sha256 checked against Mozilla's
# SHA256SUMS), Fission on, driven from the parent process by Marionette in the
# chrome context: the scenario of scripts/hunt_second_goto_vs_stock.py (load 1 to
# b.test/partial, whose rest the server holds; load 2 to c.test/second as soon as
# the server has sent the start of /partial). Stock Playwright's Firefox turns
# Fission off and is no reference. 20 repetitions per system, a new browser and
# profile each; the JSON has, per repetition, the page that stays loaded, whether
# /second reached the server and when, and how long the final page took. It runs
# on a push to its own branch only. No page of the internet is asked: the only
# network use is the download of the build.
# ─────────────────────────────────────────────────────────────────────────────
name: second-goto-retail-hunt

on:
  push:
    branches: [hunt/second-goto-retail]

permissions:
  contents: read

# A hunt has a group of its own, unique to the run: a newer push never cancels
# a measurement that is half done (tests/test_ci_runs_once_per_commit.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  second-goto-retail-linux:
    name: second-goto-retail (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install psutil (the Marionette client of the repo names what a refused connection leaves)
        run: python -m pip install psutil
      - name: Runtime libraries of Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 libxt6t64 libx11-xcb1 libxtst6
      - name: Second goto, Firefox 159.0 retail with Fission, 20 repetitions
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/hunt_second_goto_retail.py --fetch-dir "$RUNNER_TEMP/retail" --repetitions 20 --out-dir "$RUNNER_TEMP/second-goto-retail"
      - name: Close every Firefox left
        if: always()
        run: |
          pkill -9 -f firefox || true
          echo "left: $(pgrep -fc firefox || true)"
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-goto-retail-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-goto-retail/*.json
          if-no-files-found: warn
          retention-days: 14

  second-goto-retail-windows:
    name: second-goto-retail (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install psutil (the Marionette client of the repo names what a refused connection leaves)
        run: python -m pip install psutil
      - name: Second goto, Firefox 159.0 retail with Fission, 20 repetitions
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/hunt_second_goto_retail.py --fetch-dir "$RUNNER_TEMP/retail" --repetitions 20 --out-dir "$RUNNER_TEMP/second-goto-retail"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-goto-retail-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-goto-retail/*.json
          if-no-files-found: warn
          retention-days: 14
