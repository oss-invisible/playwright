# ─────────────────────────────────────────────────────────────────────────────
# candidate-second-goto-hunt.yml - a MEASUREMENT, not a gate: the second goto that
# replaces the first (scripts/hunt_second_goto_vs_stock.py), on OUR browser only, with
# the protocol trace (--trace), on the binary of an ENGINE CANDIDATE and not on the
# published one, on Linux and on Windows. The scenario: a first goto to a page whose
# response is half there, a second goto to a third site as soon as the client has heard
# that response. The expected result is 0 hangs (a goto 2 that ends by its own timeout).
#
# The candidate is named by two files of this branch, written when the hunt is launched:
#   ci/candidate-run.txt        the id of the candidate's run of `release` in oss-invisible/firefox_antidetect_patch
#   ci/candidate-core-ref.txt   the core_ref that run was gated with
# Both say TODO until then, and the first step of every job refuses TODO. The binary is the
# artifact asset-<leg> of that run, extracted as the gate of the candidate does and sealed
# as firefox-N-candidate (scripts/hunt_candidate_binary.py says how).
#
# 200 repetitions per system: two shards of 100 on each, one runner each (a shard is a
# fresh runner, a repetition a fresh browser). For every hang the summary says whether the
# request of goto 2 was in the parent (a Network.requestWillBeSent with the navigation id of
# goto 2), how it ended, and whether the server saw it; the line HUNTTOTAL counts them.
#
# It runs on a push to its own branch only.
# ─────────────────────────────────────────────────────────────────────────────
name: candidate-second-goto-hunt

on:
  push:
    branches: [hunt/candidate-second-goto]

permissions:
  contents: read
  actions: read

# A hunt has a group of its own, unique to the run: a newer push never cancels
# a measurement that is half done (tests/test_ci_runs_once_per_commit.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  # reads the artifacts and the log of the candidate's run (the engine repository is public)
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}
  # the core of the candidate, not the one the wrapper pins: the pair is mismatched on purpose, as the gate of the candidate runs it
  INVISIBLE_CORE_PIN: allow
  INVISIBLE_CORE_AUTOFIX: "off"

jobs:
  second-goto:
    name: candidate-second-goto (${{ matrix.system }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { system: linux,   runner: ubuntu-24.04, leg: linux-x86_64, shard: 1 }
          - { system: linux,   runner: ubuntu-24.04, leg: linux-x86_64, shard: 2 }
          - { system: windows, runner: windows-2022, leg: win-x86_64,   shard: 1 }
          - { system: windows, runner: windows-2022, leg: win-x86_64,   shard: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # TODO in either file ends the job here, in seconds, with the reason.
      - name: The candidate is named (ci/candidate-run.txt, ci/candidate-core-ref.txt)
        run: python scripts/hunt_candidate_binary.py check
      - name: Install the core of the candidate, the wrapper and the test deps
        run: |
          set -e
          CORE_GIT="git+https://github.com/oss-invisible/core@$(python scripts/hunt_candidate_binary.py core-ref)"
          python -m pip install --upgrade pip
          python -m pip install --quiet "$CORE_GIT"
          python -m pip install --quiet ".[dev]"
          python -m pip install --quiet --force-reinstall "$CORE_GIT"
          python -m pip install --quiet "playwright==$(cat scripts/playwright_pin.txt)"
          python scripts/hunt_candidate_binary.py verify-core
      - name: System deps (xvfb + Firefox runtime libs)
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: The binary of the candidate (asset-${{ matrix.leg }}), sealed
        run: python scripts/hunt_candidate_binary.py fetch --leg ${{ matrix.leg }} --dest "$RUNNER_TEMP/candidate"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build --pin ci/geoip.json
      - name: Trace the second goto, ours, 100 repetitions (no new one after 40 minutes)
        timeout-minutes: 50
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/second-goto-trace"
          cp "$RUNNER_TEMP/candidate/candidate.json" "$RUNNER_TEMP/second-goto-trace/"
          ARGS=(--trace --browser invisible --binary "$FF" --repetitions 100 --budget-min 40 --out-dir "$RUNNER_TEMP/second-goto-trace")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -u scripts/hunt_second_goto_vs_stock.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/second-goto-trace/summary.txt"
          else
            python -u scripts/hunt_second_goto_vs_stock.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/second-goto-trace/summary.txt"
          fi
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pkill -f firefox || true
            echo "left: $(pgrep -fc firefox || true)"
          else
            taskkill //F //IM firefox.exe //T 2>/dev/null || true
            echo "left: $(tasklist //FI 'IMAGENAME eq firefox.exe' 2>/dev/null | grep -ci firefox || true)"
          fi
      - name: The hangs of this shard
        if: always()
        run: |
          grep -E "^(== HANGS|   repetition [0-9]+: request|HUNTTOTAL|budget of)" "$RUNNER_TEMP/second-goto-trace/summary.txt" || echo "no summary"
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-second-goto-${{ matrix.system }}-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-goto-trace
          if-no-files-found: warn
          retention-days: 14
      # The verdict is only that the measurement is there: a hang is what the hunt is for.
      - name: Verdict (the trace of 100 repetitions is there)
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os, sys
          files = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "second-goto-trace", "second-goto-trace-invisible-*.json"))
          if not files:
              sys.exit("no trace JSON was written")
          data = json.load(open(files[0], encoding="utf-8"))
          done = len(data["rows"])
          print("repetitions done: %d, hangs: %d" % (done, len(data.get("hangs", []))))
          if done < 100:
              sys.exit("only %d repetitions were measured (100 were wanted)" % done)
          PY
