# HUNT ONLY, never merged. IndexedDB at the quit, on Windows, the same 4-together scenario as the close hunt, on the candidate 43843317541
# (latitude/firefox-65, series 05522a48bdd8), core 0e35e35, wrapper 274fdc28.
# MOZ_LOG=IndexedDB:5,sync,timestamp with a file per process (MOZ_LOG_FILE=<dir>/ff-%PID.log), for ours (cand4idb: 4 browsers in one process, closed
# when the session is 75 s old) and for the real Firefox 159 (retail4idb: 4 together, closed by their window 70 s after the first load), and the
# Remote Settings client's own log (services.settings.loglevel=debug) in both, as in the earlier hunts. Goal: which Remote Settings readwrite
# transactions are open at the quit and how long each lasts (ours spends about 2 s longer in profile-before-change, held by the blocker
# "RemoteSettingsClient - finish IDB access."), and the census of the processes of each browser at its close, to see which process types differ
# between ours and retail (ours shows 7 content/tab processes against retail's 5): command line type, birth, parent.
# Nothing is raised or changed in the product (HUNT_CLOSE_TIMEOUT is refused), the stamps of the close hunt are in (scripts/hunt_candidate.py).
# The logs are gzipped after each arm and uploaded: the IndexedDB log's shape is read by scripts/hunt_candidate_idb.py without assuming it, with a
# sample of the raw lines printed, so a second reading can be made from the artifact without another run.
name: candidate idb hunt
on:
  push:
    branches: [hunt/published-latency]
    paths: [.github/workflows/candidate-idb-hunt.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-idb-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: windows-2022, part: ours, arms: "cand4idb" }
          - { os: windows-2022, part: retail, arms: "retail4idb" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      PART: ${{ matrix.part }}
      ONLY_ARMS: ${{ matrix.arms }}
      ROUNDS: "4"
      HUNT_CAND_CLOSE: "1"
      HUNT_CAND_IDB: "1"
      HUNT_RS: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: A venv (psutil; for ours also the core 0e35e35, the wrapper 274fdc28 and stock Playwright's driver)
        run: |
          P="$RUNNER_TEMP/after/Scripts/python"
          python -m venv "$RUNNER_TEMP/after"
          "$P" -m pip install -q --upgrade pip
          "$P" -m pip install -q psutil
          if [ "$PART" = ours ]; then
            "$P" -m pip install -q "invisible-playwright==0.52.1" websockets "playwright==$(cat scripts/playwright_pin.txt)"
            "$P" -m pip install -q --force-reinstall "git+https://github.com/oss-invisible/core@0e35e35f4a1017234c8cc51858c829de6f23ffc8"
            "$P" -m pip install -q --no-deps --force-reinstall "git+https://github.com/oss-invisible/playwright@274fdc2812e471f14039b2bef7e034efeae68a47"
            "$P" -c "
          import importlib.metadata as m, json
          for n in ('invisible-core', 'invisible-playwright'):
              d = m.distribution(n); u = json.loads(d.read_text('direct_url.json') or '{}')
              print(n, d.version, u.get('vcs_info', {}).get('commit_id'))
          import invisible_core.process as p
          print('BROWSER_EXIT_LIMIT', p.BROWSER_EXIT_LIMIT, 'SENDER_GRACE', __import__('invisible_core.juggler._profile', fromlist=['x']).SENDER_GRACE)
          "
            "$P" -m playwright install firefox
          fi
          echo "PY_AFTER=$P" >> "$GITHUB_ENV"
      - name: The engine of the candidate 43843317541, sealed for this run
        if: matrix.part == 'ours'
        run: |
          RUN=43843317541
          # The run's own state is printed, and the series is checked: a push before the build is green fails here, with the artifacts it lacks.
          gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json status,conclusion,headSha,headBranch || true
          SHA=$(gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json headSha --jq .headSha)
          case "$SHA" in 05522a48bdd8*) ;; *) echo "the run $RUN is not the series 05522a48bdd8 ($SHA)"; exit 1 ;; esac
          gh api "repos/oss-invisible/firefox_antidetect_patch/actions/runs/$RUN/artifacts" --jq '.artifacts[] | "artifact \(.name) \(.size_in_bytes) expired=\(.expired)"' | head -20
          mkdir -p "$RUNNER_TEMP/eng" && cd "$RUNNER_TEMP/eng"
          gh run download "$RUN" -R oss-invisible/firefox_antidetect_patch -n asset-win-x86_64 -D .
          unzip -q ./*.zip -d ff
          FF="$(cd ff && pwd -W)/firefox.exe"
          ls -l "$FF"; sha256sum "$FF"
          echo "FF_AFTER=$FF" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          "$PY_AFTER" -m invisible_core seal --binary "$FF" --tag firefox-65-candidate -o "$RUNNER_TEMP/seal.json"
          echo "INVISIBLE_SEAL_FILE=$RUNNER_TEMP/seal.json" >> "$GITHUB_ENV"
      - name: The retail Firefox 159.0 en-US (official)
        if: matrix.part == 'retail'
        run: |
          B=https://archive.mozilla.org/pub/firefox/releases/159.0/win64/en-US/
          R="$RUNNER_TEMP/retail"
          mkdir -p "$R"
          curl -fsSL --retry 3 -o "$R/package.exe" "${B}Firefox%20Setup%20159.0.exe"
          sha256sum "$R/package.exe"
          if command -v 7z > /dev/null 2>&1; then SZ=7z; else SZ="/c/Program Files/7-Zip/7z.exe"; fi
          "$SZ" x "$R/package.exe" -o"$R/win" -y > /dev/null
          FF="$R/win/core/firefox.exe"
          ls -l "$FF"; sha256sum "$FF"
          echo "FF_RETAIL=$FF" >> "$GITHUB_ENV"
      - name: Four rounds
        continue-on-error: true
        timeout-minutes: 70
        run: |
          set +e
          S=scripts/hunt_candidate.py
          if [ -n "$HUNT_CLOSE_TIMEOUT" ]; then echo "HUNT_CLOSE_TIMEOUT is set: this hunt raises no deadline"; exit 1; fi
          # What an arm prints: its HUNT lines, each tagged with the arm.
          keep() { grep --line-buffered -E '^HUNT(ROW|SLOW|PROBE|EVAL|SHUT|SURVIVOR|BGTASK|ALIVE|PARENTS|CLOSEARGS)' | sed -u -E "s/^(HUNT[A-Z]+) /\1 [$1] /"; }
          # A limit per arm: the arm's python writes its pid (HUNT_PIDFILE) and a watchdog kills that tree when the limit comes, printing the crash row.
          limit_of() {
            case "$1" in
              cand4idb) echo 720 ;; retail4idb) echo 400 ;; *) echo 400 ;;
            esac
          }
          kill_arm() {
            local pid
            for pid in $(cat "$HUNT_PIDFILE" 2>/dev/null); do taskkill //T //F //PID "$pid" > /dev/null 2>&1; done
          }
          run_arm() {
            local lim wd
            lim=$(limit_of "$1")
            export HUNT_PIDFILE="$RUNNER_TEMP/arm.pid" HUNT_ARM="$1" HUNT_LIMIT_S="$lim" HUNT_MOZLOG_DIR="$RUNNER_TEMP/mozlog/$2-$1"
            : > "$HUNT_PIDFILE"
            rm -f "$RUNNER_TEMP/arm.done" "$HUNT_PIDFILE.fault"
            (
              exec > /dev/null
              sleep "$lim" > /dev/null 2>&1
              [ -e "$RUNNER_TEMP/arm.done" ] && exit 0
              echo "HUNTROW [$1] {\"arm\": \"$1\", \"round\": \"$2\", \"crash\": \"arm timed out after $lim s\"}" | tee -a "$RUNNER_TEMP/rows.log" >&2
              kill_arm
            ) &
            wd=$!
            case "$1" in
              # 4 browsers in one process, idle until the session is 75 s old, then closed together. The shutdown log of the engine on (the
              # same preferences retail gets in its profile), nothing else, no timeout of the hunt.
              cand4idb) HUNT_NCLOSE=1 HUNT_NCSHUT=1 HUNT_SESSION_S=75 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep cand4idb ;;
              retail4idb) "$PY_AFTER" $S retail 4 "$2" "$FF_RETAIL" 70 2>&1 | keep retail4idb ;;
            esac
            : > "$RUNNER_TEMP/arm.done"
            kill "$wd" > /dev/null 2>&1
            if [ -s "$HUNT_PIDFILE.fault" ]; then sed "s/^/HUNTALIVE [$1] fault: /" "$HUNT_PIDFILE.fault" | head -120; fi
            taskkill //F //IM firefox.exe //T > /dev/null 2>&1
            # The logs of this arm, compressed (they are text; the artifact keeps them for a second reading).
            find "$HUNT_MOZLOG_DIR" -type f -name 'ff-*' ! -name '*.gz' -exec gzip -f {} + > /dev/null 2>&1
            echo "mozlog $2-$1: $(find "$HUNT_MOZLOG_DIR" -type f 2>/dev/null | wc -l) files, $(du -sk "$HUNT_MOZLOG_DIR" 2>/dev/null | cut -f1) KB"
          }
          read -ra ARMS <<< "$ONLY_ARMS"
          N=${#ARMS[@]}
          for r in $(seq 0 $((${ROUNDS:-6}-1))); do
            for k in $(seq 0 $((N-1))); do
              if [ "$SECONDS" -gt 3780 ]; then echo "time guard: no new arm after $SECONDS s"; break 2; fi
              a=${ARMS[$(( (k + r) % N ))]}; run_arm "$a" "r$r" | tee -a "$RUNNER_TEMP/rows.log"
            done
          done
          true
      - name: The table
        if: always()
        run: |
          python - "$RUNNER_TEMP/rows.log" <<'PY'
          import collections, json, re, sys
          rows = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTROW \[(\w+)\] (.*)", line.strip())
              if m:
                  rows.setdefault(m.group(1), []).append(json.loads(m.group(2)))
          def q(v, p):
              v = sorted(x for x in v if x is not None)
              return v[min(len(v) - 1, int(p * len(v)))] if v else None
          def trio(v):
              v = [x for x in v if x is not None]
              return "p50 %s p95 %s max %s (n %d)" % (q(v, .5), q(v, .95), max(v, default=None), len(v))
          # Where the 2 s is: the close -> the quit (the first "Starting phase" line), the quit -> the main process gone (profile-before-change and
          # what follows), and the blocker of the Remote Settings client, per arm.
          for arm, a in sorted(rows.items()):
              r = [x for x in a if "crash" not in x]
              print("HUNTIDBTIME %-11s browsers %d (crash rows %d) | close -> quit ms %s | quit -> main process gone ms %s | close -> main gone ms %s | RS finish-IDB blocker done at quit+ms %s | RS writes at the close %s"
                    % (arm, len(r), len(a) - len(r), trio([x.get("a_close_to_quit_ms") for x in r]), trio([x.get("b_quit_to_main_gone_ms") for x in r]),
                       trio([x.get("close_to_main_gone_ms") for x in r]), trio([x.get("rs_idb_done_q_ms") for x in r]), dict(collections.Counter(str(x.get("rs_write_kinds_at_close")) for x in r))))
              for x in r:
                  ph = x.get("phases") or {}
                  print("HUNTIDBPHASE %-11s %s | profile-before-change starts at quit+ms %s finishes %s | pending blockers at the parent's exit %s"
                        % (arm, x.get("tag"), (ph.get("profile-before-change") or [None, None])[0], (ph.get("profile-before-change") or [None, None])[1], x.get("pending_blockers")))
          PY
          python scripts/hunt_candidate_idb.py "$RUNNER_TEMP/rows.log" "$RUNNER_TEMP/mozlog" | cut -c1-1500
          grep -h "HUNTSLOWCLOSE" "$RUNNER_TEMP/rows.log" | cut -c1-1200 || true
      - name: Close every Firefox left
        if: always()
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "candidate-idb-rows-${{ matrix.part }}-${{ github.run_id }}", path: "${{ runner.temp }}/rows.log" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "candidate-idb-mozlog-${{ matrix.part }}-${{ github.run_id }}", path: "${{ runner.temp }}/mozlog", retention-days: 7 }
