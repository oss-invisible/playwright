# ─────────────────────────────────────────────────────────────────────────────
# intermittent-68-hunt.yml - a HUNT for the intermittent e2e of firefox-68. NOT a gate, never to be merged to main:
# it exists on the branch `hunt/intermittent-68` and is deleted with it when the hunt is over.
#
# What it does. Eight jobs at once (matrix, max-parallel 8, none stops the others): each repeats ONE test for `rounds` rounds and does not stop at the first
# red. A round is the test run FOUR times at once on the machine (`-n 4 --dist each`: every one of four xdist workers runs the node, one browser each), the
# load the e2e suite puts on a runner (four browsers at once, `invisible_core.testing.e2e`). No rerun plugin: a rerun would hide the very red the hunt is for.
# The reds leave what the tests save on failure (RUNNER_TEMP/invpw-evidence: the engine's own log of the launch, the lab server's record, the page's timeline),
# the junit of every round and the log of every round in the artifact of the job; the job summary counts rounds, passed and failed.
#
#   A moving page's read right after `goto`, all 7 cases of the test (one round = 7 cases x 4 copies = 28): Linux x1, Windows x1, 15 rounds each.
#   Linux x1:      the journey on the fake web (networkidle where stock goes idle), the 25 s popup of a served browser.
#   Linux x2:      HTTP/3 with no proxy (h2, h3, h3).
#   Windows x2:    two connections on one page connect in the time of retail (the mDNS responder).
#
# Triggered ONLY by a push to `hunt/intermittent-68`: no schedule, no dispatch, no pull request.
# ─────────────────────────────────────────────────────────────────────────────
name: intermittent 68 hunt

on:
  push:
    branches: [hunt/intermittent-68]

permissions:
  contents: read

# A newer push to the hunt branch replaces the run it supersedes.
concurrency:
  group: intermittent-68-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as every workflow that runs tests).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: hunt ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 25 rounds of a few minutes at most, plus the install. The ceiling must never be what stops the hunt before its own time budget does (the step below
    # starts no new round after 85 minutes and still uploads what it has).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: read-after-goto-linux
            os: ubuntu-24.04
            temp: /tmp
            rounds: 15
            items: 7
            node: "tests/test_a_page_that_moves_on_e2e.py::test_a_read_right_after_goto_answers"
          - label: read-after-goto-windows
            os: windows-2022
            temp: 'D:\a\_temp'
            rounds: 15
            items: 7
            node: "tests/test_a_page_that_moves_on_e2e.py::test_a_read_right_after_goto_answers"
          - label: popup-25s-linux-1
            os: ubuntu-24.04
            temp: /tmp
            rounds: 25
            items: 1
            node: "tests/test_a_popup_is_reported_when_the_engine_says_it_is_ready_as_playwright_does_e2e.py::test_a_popup_whose_destination_answers_after_25_seconds_is_reported_then[served]"
          - label: h3-no-proxy-linux-1
            os: ubuntu-24.04
            temp: /tmp
            rounds: 25
            items: 1
            node: "tests/test_http3_through_the_proxy_e2e.py::test_a_page_with_no_proxy_reads_h2_then_h3_then_h3"
          - label: h3-no-proxy-linux-2
            os: ubuntu-24.04
            temp: /tmp
            rounds: 25
            items: 1
            node: "tests/test_http3_through_the_proxy_e2e.py::test_a_page_with_no_proxy_reads_h2_then_h3_then_h3"
          - label: mdns-loopback-windows-1
            os: windows-2022
            temp: 'D:\a\_temp'
            rounds: 25
            items: 1
            node: "tests/test_declared_host_network_e2e.py::test_two_connections_on_one_page_connect_in_the_time_of_retail"
          - label: mdns-loopback-windows-2
            os: windows-2022
            temp: 'D:\a\_temp'
            rounds: 25
            items: 1
            node: "tests/test_declared_host_network_e2e.py::test_two_connections_on_one_page_connect_in_the_time_of_retail"
          - label: fakeweb-journey-linux-1
            os: ubuntu-24.04
            temp: /tmp
            rounds: 25
            items: 1
            node: "tests/test_fakeweb_p4_e2e.py::test_the_journey_succeeds_on_every_step_and_idles_where_stock_does"
    # The temporary folder of the Windows job is the one of the series gate (D:\a\_temp, where the runner's own temp is).
    env:
      TEMP: ${{ matrix.temp }}
      TMP: ${{ matrix.temp }}
    # `run:` blocks are PowerShell on Windows unless said otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      # The security state is a ready directory of the repository (ci/security-state/, a result with no data, the sha256 in ci/security-state.pin.json): with
      # STEALTHFOX_SECURITY_STATE set the core neither downloads nor generates one. BEFORE `fetch`, which makes the state present (it would download and generate it).
      - name: The security state (a fixed directory of the repository)
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      # The GeoIP database made by the repository, as in e2e.yml (no download, the same bytes every run).
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build

      - name: The hunt, round after round
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
          HUNT_NODE: ${{ matrix.node }}
          HUNT_ROUNDS: ${{ matrix.rounds }}
          # How many tests (cases of a parametrized node count one each) the node selects: a round runs each of them on each of the four workers.
          HUNT_ITEMS: ${{ matrix.items }}
          HUNT_LABEL: ${{ matrix.label }}
          # No new round starts after this many seconds of the step: the artifact is uploaded with what the rounds so far found.
          HUNT_BUDGET_S: "5100"
        run: |
          # A step of a hunt that breaks must never end green: any error stops it, and the trap below turns a stop before the verdict into a red step.
          set -euo pipefail
          finished=0
          trap 'if [ "$finished" != 1 ]; then echo "::error::the hunt step stopped before its verdict"; exit 1; fi' EXIT
          # What scripts/run_e2e.py gives the pytest it starts (invisible_core/testing/e2e.py main): INVPW_BINARY_PATH and STEALTHFOX_E2E_BINARY, both the binary,
          # and INVISIBLE_CORE_PIN taken out of the environment (one e2e asserts the pin repair that it disables). It sets nothing else; cwd is the repository.
          if [ -z "${FF:-}" ] || [ ! -e "$FF" ]; then echo "::error::no engine binary (FF='${FF:-}')"; exit 1; fi
          export INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF"
          unset INVISIBLE_CORE_PIN
          out="$RUNNER_TEMP"
          mkdir -p "$out/hunt-junit" "$out/hunt-logs" "$out/invpw-evidence"
          # The result of one junit: "tests failures errors skipped names uneven" on the first line (names: the tests collected, each by its own name; uneven: how many of
          # them did not run exactly four times), then one line per red test (-1 for a file that is not there).
          cat > "$out/junit_read.py" <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              seen = {}
              for case in suite.iter("testcase"):
                  key = (case.get("classname"), case.get("name"))
                  seen[key] = seen.get(key, 0) + 1
              print(*(int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")), len(seen), sum(1 for n in seen.values() if n != 4))
              for case in suite.iter("testcase"):
                  for kind in ("failure", "error"):
                      bad = case.find(kind)
                      if bad is not None:
                          print("RED %s | %s" % (case.get("name"), " ".join((bad.get("message") or "").split())[:400]))
          except Exception as exc:
              print("-1 -1 -1 -1 -1 -1")
              print("RED junit not readable: %r" % (exc,))
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then PRE="xvfb-run -a"; else PRE=""; fi
          # Every browser left by a round is closed before the next one starts.
          reap() {
            if [ "$RUNNER_OS" = "Windows" ]; then
              powershell -NoProfile -Command "Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue" > /dev/null 2>&1 || true
            else
              pkill -9 -f "$(dirname "$FF")" > /dev/null 2>&1 || true
            fi
          }
          rounds_run=0; rounds_red=0; copies=0; copies_passed=0; copies_red=0; copies_skipped=0; anomalies=0
          summary() {
            {
              echo "## $HUNT_LABEL"
              echo ""
              echo "test: \`$HUNT_NODE\`"
              echo ""
              echo "| rounds planned | rounds run | rounds with a red | copies run (4 per test a round) | passed | failed | skipped | rounds that did not run every test 4 times |"
              echo "|---|---|---|---|---|---|---|---|"
              echo "| $HUNT_ROUNDS | $rounds_run | $rounds_red | $copies | $copies_passed | $copies_red | $copies_skipped | $anomalies |"
              echo ""
              if [ -s "$out/hunt-reds.txt" ]; then echo "Reds:"; echo ""; echo '```'; cat "$out/hunt-reds.txt"; echo '```'; fi
            } > "$out/hunt-summary.md"
          }
          : > "$out/hunt-reds.txt"
          for n in $(seq 1 "$HUNT_ROUNDS"); do
            if [ "$SECONDS" -gt "$HUNT_BUDGET_S" ]; then
              echo "::warning::time budget reached after $rounds_run rounds of $HUNT_ROUNDS: no new round"
              break
            fi
            tag="$(printf '%02d' "$n")"
            junit="$out/hunt-junit/round-$tag.xml"
            log="$out/hunt-logs/round-$tag.log"
            t0=$SECONDS
            # Four workers, the node on each: four browsers at once, as the suite runs them. No rerun plugin, a per-test deadline that ends a hang with its name.
            set +e
            $PRE python -u -m pytest "$HUNT_NODE" -m e2e -o addopts= -o junit_family=xunit2 -p no:cacheprovider -p no:rerunfailures \
              -n 4 --dist each --max-worker-restart 0 --timeout 420 --timeout-method thread -o faulthandler_timeout=399 \
              -v --tb=short --junitxml="$junit" > "$log" 2>&1
            code=$?
            set -e
            reap
            # Python writes CRLF on Windows: every line read back loses its backslash-r before it is used in an arithmetic expression.
            python "$out/junit_read.py" "$junit" | tr -d '\r' > "$out/round-read.txt"
            read -r t f e s names uneven < <(head -1 "$out/round-read.txt")
            rounds_run=$((rounds_run + 1))
            for number in "$t" "$f" "$e" "$s" "$names" "$uneven"; do
              case "$number" in -1|[0-9]|[0-9][0-9]|[0-9][0-9][0-9]) ;; *) echo "::error::round $n: the junit read gave '$t $f $e $s $names $uneven', not six numbers"; exit 1;; esac
            done
            if [ "$t" -lt 0 ]; then
              # no junit: the pytest run did not get to write one (collection error, a worker that died, a kill)
              rounds_red=$((rounds_red + 1)); copies_red=$((copies_red + 4 * HUNT_ITEMS)); anomalies=$((anomalies + 1))
              echo "round $n: exit=$code, NO JUNIT" | tee -a "$out/hunt-reds.txt"
              tail -n 30 "$log" | tee -a "$out/hunt-reds.txt"
            else
              copies=$((copies + t)); copies_red=$((copies_red + f + e)); copies_skipped=$((copies_skipped + s))
              copies_passed=$((copies_passed + t - f - e - s))
              # A round is every test of the node (HUNT_ITEMS, and the junit names that many) run four times, all run: fewer tests collected, a test that did not
              # run four times, or a skipped copy measured less than it says and is red.
              bad_shape=0
              if [ "$names" -ne "$HUNT_ITEMS" ] || [ "$uneven" -ne 0 ] || [ "$t" -ne $((4 * names)) ] || [ "$s" -ne 0 ]; then bad_shape=1; fi
              anomalies=$((anomalies + bad_shape))
              if [ "$code" -ne 0 ] || [ $((f + e)) -gt 0 ] || [ "$bad_shape" -ne 0 ]; then
                rounds_red=$((rounds_red + 1))
                echo "round $n: exit=$code, $t copies of $names tests (expected $((4 * HUNT_ITEMS)) of $HUNT_ITEMS), $f failed, $e errors, $s skipped, $uneven tests not run 4 times" >> "$out/hunt-reds.txt"
                tail -n +2 "$out/round-read.txt" | sed "s/^/  /" >> "$out/hunt-reds.txt"
                if [ "$s" -ne 0 ]; then grep -a -m 3 "SKIPPED" "$log" | sed "s/^/  /" >> "$out/hunt-reds.txt" || true; fi
              fi
            fi
            echo "round $n/$HUNT_ROUNDS: exit=$code tests=$t failures=$f errors=$e skipped=$s, $((SECONDS - t0)) s"
            summary
          done
          summary
          cat "$out/hunt-summary.md"
          # Red means FOUND, and also NOT MEASURED: the step fails when any copy failed or was skipped, when a round did not run every test four times, or when no round ran.
          finished=1
          if [ "$rounds_run" -eq 0 ]; then echo "::error::no round ran"; exit 1; fi
          if [ "$copies_skipped" -ne 0 ]; then echo "::error::$copies_skipped copies were skipped: the hunt measured nothing with them"; fi
          if [ "$copies_red" -ne 0 ] || [ "$copies_skipped" -ne 0 ] || [ "$anomalies" -ne 0 ]; then exit 1; fi

      - name: The leg ran with the pinned GeoIP database
        if: always()
        run: |
          python scripts/ci_lab_geoip.py evidence --out "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" > /dev/null
          python scripts/ci_lab_geoip.py verify --evidence "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" --used "$GEOIP_USED_OUT"
      - name: Close every Firefox left
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: The counts in the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hunt-summary.md" ]; then cat "$RUNNER_TEMP/hunt-summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload what the hunt found (evidence of the tests, junit and log of every round)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hunt-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/invpw-evidence
            ${{ runner.temp }}/hunt-junit
            ${{ runner.temp }}/hunt-logs
            ${{ runner.temp }}/hunt-summary.md
            ${{ runner.temp }}/hunt-reds.txt
            ${{ runner.temp }}/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14
