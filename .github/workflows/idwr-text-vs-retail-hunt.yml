# HUNT ONLY, never merged. The canvas text of the idwr engine (feder-cr/firefox_antidetect_patch run 43728338511) against Firefox 159.0
# RETAIL launched by hand, on windows-2025 (DWrite 10.0.26100): 80 single-font draws and the text keys. Retail draws with the runner's
# installed fonts, ours with the bundle: compare prints both files' sha256.
name: idwr text vs retail hunt
on:
  push:
    branches: [hunt/idwr-text-vs-retail]
    paths: [scripts/hunt_text_vs_retail.py, scripts/hunt_tv_text_probe.js, scripts/hunt_tv_fallback_probe.js, .github/workflows/idwr-text-vs-retail-hunt.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: idwr-text-vs-retail-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  hunt:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      INVISIBLE_CORE_AUTOFIX: "off"
      INVISIBLE_CORE_PIN: allow
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "invisible-core==64.73.0"
      - name: The idwr engine (artifact asset-win-x86_64 of run 43728338511), sealed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/eng" && cd "$RUNNER_TEMP/eng"
          gh run download 43728338511 -R feder-cr/firefox_antidetect_patch -n asset-win-x86_64 -D .
          unzip -q ./*.zip -d ff
          FF="$(cd ff && pwd -W)/firefox.exe"
          echo "FF=$FF" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          python -m invisible_core seal --binary "$FF" --tag firefox-65-candidate -o "$RUNNER_TEMP/seal.json"
          echo "INVISIBLE_SEAL_FILE=$RUNNER_TEMP/seal.json" >> "$GITHUB_ENV"
      - name: The GeoIP database
        run: python scripts/ci_lab_geoip.py build
      - name: Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS)
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/retail"
      - name: Both arms, then the comparison
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          PREFS=$(python -c "import json; from invisible_core._fpforge import generate_profile; f = generate_profile(seed=42).font; print(json.dumps({'gfx.font_rendering.cleartype_params.gamma': f.cleartype_gamma, 'gfx.font_rendering.cleartype_params.enhanced_contrast': f.cleartype_contrast, 'gfx.font_rendering.cleartype_params.cleartype_level': f.cleartype_level, 'gfx.font_rendering.cleartype_params.pixel_structure': f.cleartype_pixel_structure, 'gfx.font_rendering.cleartype_params.rendering_mode': f.cleartype_rendering_mode}))")
          echo "the seed 42 rasterisation prefs given to retail: $PREFS"
          python -u scripts/hunt_text_vs_retail.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/tv"
          cp "$RUNNER_TEMP/tv/ours.json" "$RUNNER_TEMP/tv-plain/ours.json" 2>/dev/null || { mkdir -p "$RUNNER_TEMP/tv-plain"; cp "$RUNNER_TEMP/tv/ours.json" "$RUNNER_TEMP/tv-plain/ours.json"; }
          python -u scripts/hunt_text_vs_retail.py run --arm retail --retail-from "$RUNNER_TEMP/retail" --retail-prefs "$PREFS" --out "$RUNNER_TEMP/tv"
          python -u scripts/hunt_text_vs_retail.py run --arm retail --retail-from "$RUNNER_TEMP/retail" --out "$RUNNER_TEMP/tv-plain"
          echo "=== retail WITH the seed's rasterisation prefs"
          python -u scripts/hunt_text_vs_retail.py compare "$RUNNER_TEMP/tv" --binary "$FF"
          echo "=== retail with the runner's own settings"
          python -u scripts/hunt_text_vs_retail.py compare "$RUNNER_TEMP/tv-plain" --binary "$FF" | grep -E "draws equal|fallback"
          true
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "idwr-text-vs-retail-${{ github.run_id }}", path: "${{ runner.temp }}/tv*" }
