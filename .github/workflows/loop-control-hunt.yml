name: loop control hunt
on:
  push:
    branches: [hunt/loop-control-on-old-watcher]
env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: loop-control-hunt
  cancel-in-progress: true
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi
      - name: Fetch our published firefox binary
        run: echo "INVPW_BINARY_PATH=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The loop test with the OLD watcher, three times
        run: |
          set +e
          for i in 1 2 3; do
            python -m pytest tests/test_closing_one_of_four_browsers_does_not_hold_the_loop_e2e.py -m e2e -o addopts='' -q -p no:cacheprovider -rA 2>&1 | grep -E "PASSED|FAILED|charged|held" | cut -c1-240
          done
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then pkill -9 -f firefox || true; else taskkill //F //IM firefox.exe //T 2>/dev/null || true; fi
