# HUNT ONLY, never merged. WHY Browser.close() returns 0.5 to 2.6 s AFTER the core's Connection.close has, when 4 browsers of one Python process
# close together on Windows. Probes only: no fix and no deadline raised (the script refuses to start with HUNT_CLOSE_TIMEOUT set).
# The measured facts (run 43853094169, candidate-close-hunt.yml, cand4close, 24 closes): Connection.close returns at the browser's exit in 24 of 24;
# in 9 of 24 Browser.close() returns 0.56 to 2.6 s later; the late returns look serialized across the 4 browsers (in a round all four were ~2.3 s late,
# returning almost together; in three cases the delay equals another browser's EngineTree.end, waiting for its pingsender). The hypothesis to prove or
# refute: the OTHER browsers' reapers (process scans, polling waits, psutil calls) hold the GIL or a shared lock and starve the thread that must deliver
# the close's reply. Whatever the stacks show is reported.
# Pins: engine = candidate run 43843317541 (series 05522a48bdd8), wrapper = oss-invisible/playwright at ef3ba1c8, core = oss-invisible/core at 0e35e35.
# Scenario of cand4close: 4 browsers in one process, idle until the session is 75 s old, closed together; the shutdown log of the engine on.
# Arms (a job each, max-parallel 2): together = the 4 closes at once (as cand4close), sequential = the same 4 browsers, each close awaited before the next.
# scripts/hunt_candidate_closewhy.py (imports scripts/hunt_candidate.py and scripts/hunt_published_latency.py, edits neither) puts around the close path of the
# wrapper and of the core: wall-clock stamps with the thread's name; the stacks of ALL threads every 20 ms between the first Connection.close return and the
# last Browser.close() return; the duration and thread of every reaper step; every psutil call counted per thread and call site. The table is printed in
# each job's log; the third job (compare) prints together against sequential. The raw stamps and samples, and the readable files made from them
# (report.txt, stamps.tsv, samples.txt), are the artifact of each job.
name: candidate closewhy hunt
on:
  push:
    branches: [hunt/published-latency]
    paths: [.github/workflows/candidate-closewhy-hunt.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-closewhy-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: windows-2022, part: together }
          - { os: windows-2022, part: sequential }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      PART: ${{ matrix.part }}
      ROUNDS: "6"
      HUNT_NCLOSE: "1"
      HUNT_NCSHUT: "1"
      HUNT_SESSION_S: "75"
      HUNT_CW_MODE: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: A venv (psutil, the core 0e35e35, the wrapper ef3ba1c8 and stock Playwright's driver)
        run: |
          P="$RUNNER_TEMP/after/Scripts/python"
          python -m venv "$RUNNER_TEMP/after"
          "$P" -m pip install -q --upgrade pip
          "$P" -m pip install -q psutil
          "$P" -m pip install -q "invisible-playwright==0.52.1" websockets "playwright==$(cat scripts/playwright_pin.txt)"
          "$P" -m pip install -q --force-reinstall "git+https://github.com/oss-invisible/core@0e35e35f4a1017234c8cc51858c829de6f23ffc8"
          "$P" -m pip install -q --no-deps --force-reinstall "git+https://github.com/oss-invisible/playwright@ef3ba1c8623fda7177476e6c9247dcaa4e27bd86"
          "$P" -c "
          import importlib.metadata as m, json
          for n in ('invisible-core', 'invisible-playwright'):
              d = m.distribution(n); u = json.loads(d.read_text('direct_url.json') or '{}')
              print(n, d.version, u.get('vcs_info', {}).get('commit_id'))
          import invisible_core.process as p
          print('BROWSER_EXIT_LIMIT', p.BROWSER_EXIT_LIMIT, 'SENDER_GRACE', __import__('invisible_core.juggler._profile', fromlist=['x']).SENDER_GRACE)
          "
          "$P" -m playwright install firefox
          echo "PY_AFTER=$P" >> "$GITHUB_ENV"
          echo "HUNT_CW_DIR=$RUNNER_TEMP/closewhy-$PART" >> "$GITHUB_ENV"
      - name: The engine of the candidate 43843317541, sealed for this run
        run: |
          RUN=43843317541
          # The run's own state is printed, and the series is checked: a push before the build is green fails here, with the artifacts it lacks.
          gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json status,conclusion,headSha,headBranch || true
          SHA=$(gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json headSha --jq .headSha)
          case "$SHA" in 05522a48bdd8*) ;; *) echo "the run $RUN is not the series 05522a48bdd8 ($SHA)"; exit 1 ;; esac
          # `head` closing the pipe early kills `gh` with SIGPIPE (exit 141 under pipefail): the listing is only printed, it never fails the step.
          gh api "repos/oss-invisible/firefox_antidetect_patch/actions/runs/$RUN/artifacts" --jq '.artifacts[] | "artifact \(.name) \(.size_in_bytes) expired=\(.expired)"' | head -20 || true
          mkdir -p "$RUNNER_TEMP/eng" && cd "$RUNNER_TEMP/eng"
          gh run download "$RUN" -R oss-invisible/firefox_antidetect_patch -n asset-win-x86_64 -D .
          unzip -q ./*.zip -d ff
          FF="$(cd ff && pwd -W)/firefox.exe"
          ls -l "$FF"; sha256sum "$FF"
          echo "FF_AFTER=$FF" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          "$PY_AFTER" -m invisible_core seal --binary "$FF" --tag firefox-65-candidate -o "$RUNNER_TEMP/seal.json"
          echo "INVISIBLE_SEAL_FILE=$RUNNER_TEMP/seal.json" >> "$GITHUB_ENV"
      - name: Six rounds
        continue-on-error: true
        timeout-minutes: 70
        run: |
          set +e
          S=scripts/hunt_candidate_closewhy.py
          if [ -n "$HUNT_CLOSE_TIMEOUT" ]; then echo "HUNT_CLOSE_TIMEOUT is set: this hunt raises no deadline"; exit 1; fi
          mkdir -p "$HUNT_CW_DIR"
          # What a round prints: its HUNT lines, each tagged with the arm. The probes' own files (the raw stamps and samples) go to $HUNT_CW_DIR.
          keep() { grep --line-buffered -E '^HUNT(ROW|SLOW|PROBE|EVAL|SHUT|SURVIVOR|BGTASK|ALIVE|PARENTS|CLOSEARGS|CW[A-Z]+)' | sed -u -E "s/^(HUNT[A-Z]+) /\1 [$1] /"; }
          # A limit per round: the round's python writes its pid (HUNT_PIDFILE) and a watchdog kills that tree when the limit comes, printing the crash row.
          LIMIT=720
          kill_arm() {
            local pid
            for pid in $(cat "$HUNT_PIDFILE" 2>/dev/null); do taskkill //T //F //PID "$pid" > /dev/null 2>&1; done
          }
          run_arm() {
            local wd
            export HUNT_PIDFILE="$RUNNER_TEMP/arm.pid" HUNT_ARM="$1" HUNT_LIMIT_S="$LIMIT"
            : > "$HUNT_PIDFILE"
            rm -f "$RUNNER_TEMP/arm.done" "$HUNT_PIDFILE.fault"
            (
              exec > /dev/null
              sleep "$LIMIT" > /dev/null 2>&1
              [ -e "$RUNNER_TEMP/arm.done" ] && exit 0
              echo "HUNTROW [$1] {\"arm\": \"$1\", \"round\": \"$2\", \"crash\": \"round timed out after $LIMIT s\"}" | tee -a "$RUNNER_TEMP/rows.log" >&2
              kill_arm
            ) &
            wd=$!
            # 4 browsers in one process, idle until the session is 75 s old, then closed (HUNT_CW_MODE: together, or one after another).
            # The shutdown log of the engine on (the same preferences as the close hunt), nothing raised, no timeout of the hunt.
            "$PY_AFTER" $S run inproc 4 "$2" "$FF_AFTER" 2>&1 | keep "$1"
            : > "$RUNNER_TEMP/arm.done"
            kill "$wd" > /dev/null 2>&1
            if [ -s "$HUNT_PIDFILE.fault" ]; then sed "s/^/HUNTALIVE [$1] fault: /" "$HUNT_PIDFILE.fault" | head -120; fi
            taskkill //F //IM firefox.exe //T > /dev/null 2>&1
          }
          for r in $(seq 0 $((${ROUNDS:-6}-1))); do
            if [ "$SECONDS" -gt 3780 ]; then echo "time guard: no new round after $SECONDS s"; break; fi
            run_arm "cw-$PART" "r$r" | tee -a "$RUNNER_TEMP/rows.log"
          done
          true
      - name: The table
        if: always()
        run: |
          python scripts/hunt_candidate_closewhy.py report "$HUNT_CW_DIR" "$RUNNER_TEMP/rows.log" || true
          ls -l "$HUNT_CW_DIR" "$HUNT_CW_DIR/readable" 2>/dev/null || true
      - name: Close every Firefox left
        if: always()
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: "candidate-closewhy-${{ matrix.part }}-${{ github.run_id }}"
          path: |
            ${{ runner.temp }}/closewhy-${{ matrix.part }}
            ${{ runner.temp }}/rows.log
  compare:
    needs: hunt
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Together against sequential
        run: |
          mkdir -p art
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -D art -p 'candidate-closewhy-*' || true
          find art -name 'closewhy-*.jsonl' | head -20 || true
          python scripts/hunt_candidate_closewhy.py compare art
