# ─────────────────────────────────────────────────────────────────────────────
# cpu-render-path-hunt.yml - HUNT ONLY, never merged: why does our Firefox use ~6x the CPU of stock Firefox 159 with a window, on Windows?
# (measured per browser: parent 8.8 s against 1.7, GPU process 4.9 against 0.03, tab 0.84 against 0.58.) Nothing of the product is changed.
#
# Two arms, as in cpu-per-browser-hunt: `ours` = invisible_playwright, headless=True (on Windows: headed Firefox on a hidden desktop) and
# `stockheaded` = stock Playwright, firefox.launch(headless=False). One job, windows-2022, in this order:
#   1. scripts/hunt_cpu_render_path.py support, then diff: the full about:support text of each browser (page.goto("about:support") through
#      the wire; if that is refused, Troubleshoot.snapshot() through Marionette in chrome scope, and the job says which route worked), the
#      effective prefs, the profile's prefs.js and user.js, the parent's environment, and the diff of the Graphics section (compositing,
#      WebRender hardware/software, D3D11/WARP, GPU process, the feature decisions and their reasons, the differing gfx.* / layers.* prefs).
#   3. the CPU by process type of hunt_cpu_per_browser.py, ours and stockheaded, 2 rounds each, alternating (the sanity check).
#   2. scripts/hunt_cpu_render_path.py profile: the same 4-browser, 10-scene loop with the Gecko profiler on from startup in every process
#      (MOZ_PROFILER_STARTUP, STARTUP_FEATURES, MOZ_PROFILER_SHUTDOWN=<dir>/profile-%p.json: one file per process). It runs AFTER the CPU
#      rounds because the profiler slows the browsers. scripts/hunt_profile_summary.py prints, for the busiest parent and GPU process of each
#      arm, the CPU by thread, by module and by function. Symbols: for ours, the Breakpad symbols of the artifact symbols-win-x86_64 of a
#      recent release.yml run of the engine's repository, if one still exists and its xul.pdb id matches the binary (scripts/
#      hunt_fetch_symbols.py; a candidate's are kept 2 days, a release's 14); for every module the zips do not have, Mozilla's symbol server.
#      Where a module cannot be symbolicated the summary says so and prints module+offset; the raw profiles are always in the artifact.
#   4. (second round of the hunt) the baseline of the parent: scripts/hunt_cpu_baseline.py, ONE browser for 20 s, three arms: `retail` (Mozilla's own
#      Firefox installer of the stable release, unpacked with 7-Zip and launched by hand with subprocess, -no-remote, a fresh profile, the scene
#      URL, no automation, no Playwright; if it cannot be had the step falls back to Playwright's firefox-1572 and says so), `ours`, and
#      `ours_reused` (ours twice on the same persistent profile, profile_dir=). CPU per process type (the sampler) and per thread name (psutil
#      threads + GetThreadDescription) in the whole window and in its last 10 s; the command line of every short-lived process.
#   5. `ours_swwr` = ours with gfx.webrender.software=true, passed ONLY by the hunt through extra_prefs: its compositing facts (support), its CPU
#      per process type next to ours and stockheaded (step 3 gains two rounds of it), and whether ANY byte a page reads differs from ours:
#      scripts/hunt_page_bytes.py (canvas 2D, WebGL 1/2, text, strings, in both arms, launched twice each, diffed) and the wrapper's own byte
#      suites (canvas_*, webgl_*, canvas text, fingerprint_*, system fonts, css calc) under both arms through scripts/hunt_extra_prefs_plugin.py.
#   6. A readable profile of OUR GPU process only (profile --gpu): the profiler's thread filter limited to the GPU process's threads, a small buffer,
#      3 rounds, and the run waits for every process to exit before reading the files (the first GPU profile came back truncated).
# Every step is continue-on-error: a hunt must give whatever it got.
# ─────────────────────────────────────────────────────────────────────────────
name: cpu render path hunt

# Dispatch only since the second round: its scripts are shared with cpu-render-path-hunt-vm.yml and encoding-stability-hunt.yml, which start on push
# to this branch, and a 2 h Windows run must not start again on every push that touches a shared script.
on:
  workflow_dispatch:
    inputs:
      symbols_run:
        description: "Run id of the engine's release.yml whose symbols-win-x86_64 artifact matches the binary (empty: look through the recent runs)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cpu-render-path-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as in e2e.yml).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, ours vs stock headed vs retail - about:support, CPU by process type, baseline, software WebRender, Gecko profiles)"
    runs-on: windows-2022
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build

      # ------------------------------------------------------------------------------------------------- 1. about:support
      - name: "1. about:support, prefs and environment, arm ours"
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py support --arm ours --binary "$FF" --out "$RUNNER_TEMP/render-hunt/support"
      - name: "1. about:support, prefs and environment, arm stockheaded"
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py support --arm stockheaded --out "$RUNNER_TEMP/render-hunt/support"
      - name: "1. Graphics diff, ours against stockheaded"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_cpu_render_path.py diff "$RUNNER_TEMP/render-hunt/support" | tee "$RUNNER_TEMP/render-hunt/support/diff.txt"

      - name: "5. Compositing facts of ours_swwr (does gfx.webrender.software=true from the hunt really take effect?)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py support --arm ours_swwr --binary "$FF" --out "$RUNNER_TEMP/render-hunt/support"

      # --------------------------------------------------------------------------------- 4. the baseline of the parent (one browser, 20 s)
      - name: "4. Baseline, arm retail (Mozilla's Firefox, launched by hand, no automation)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_baseline.py --arm retail --out "$RUNNER_TEMP/render-hunt/baseline"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "4. Baseline, arm ours (fresh temporary profile)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_baseline.py --arm ours --binary "$FF" --out "$RUNNER_TEMP/render-hunt/baseline"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "4. Baseline, arm ours_reused (the same persistent profile twice; the second launch is measured)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_baseline.py --arm ours_reused --binary "$FF" --out "$RUNNER_TEMP/render-hunt/baseline"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "4. Baseline comparison table"
        if: always()
        continue-on-error: true
        run: python scripts/hunt_cpu_baseline.py --compare "$RUNNER_TEMP/render-hunt/baseline" | tee "$RUNNER_TEMP/render-hunt/baseline/compare.txt"

      # ------------------------------------------------------------------------------------- 3. CPU by process type (sanity)
      - name: "3. CPU by process type, ours, round 1"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours --binary "$FF" --round 1 --out "$RUNNER_TEMP/render-hunt/cpu/ours-1.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. CPU by process type, stockheaded, round 1"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm stockheaded --round 1 --out "$RUNNER_TEMP/render-hunt/cpu/stockheaded-1.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. CPU by process type, ours_swwr, round 1"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours_swwr --binary "$FF" --round 1 --out "$RUNNER_TEMP/render-hunt/cpu/ours_swwr-1.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. CPU by process type, ours, round 2"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours --binary "$FF" --round 2 --out "$RUNNER_TEMP/render-hunt/cpu/ours-2.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. CPU by process type, stockheaded, round 2"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm stockheaded --round 2 --out "$RUNNER_TEMP/render-hunt/cpu/stockheaded-2.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. CPU by process type, ours_swwr, round 2"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours_swwr --binary "$FF" --round 2 --out "$RUNNER_TEMP/render-hunt/cpu/ours_swwr-2.json"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "3. Comparison table"
        if: always()
        continue-on-error: true
        run: python scripts/hunt_cpu_per_browser.py --compare "$RUNNER_TEMP/render-hunt/cpu" | tee "$RUNNER_TEMP/render-hunt/cpu/compare.txt"

      # ------------------------------------------------------------------------- 5. does any byte a page reads change with software WebRender?
      - name: "5. Page-readable bytes, arm ours (canvas 2D, WebGL 1/2, text, strings; 2 launches)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_page_bytes.py collect --arm ours --binary "$FF" --launches 2 --out "$RUNNER_TEMP/render-hunt/pagebytes"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "5. Page-readable bytes, arm ours_swwr (2 launches)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_page_bytes.py collect --arm ours_swwr --binary "$FF" --launches 2 --out "$RUNNER_TEMP/render-hunt/pagebytes"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "5. Page-readable bytes, ours against ours_swwr"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_page_bytes.py diff "$RUNNER_TEMP/render-hunt/pagebytes" | tee "$RUNNER_TEMP/render-hunt/pagebytes/diff.txt"

      # -------------------------------------------------------------------------------------------- 2. the Gecko profiles
      - name: "2. Gecko profiles of the 10-scene loop, arm ours"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py profile --arm ours --binary "$FF" --out "$RUNNER_TEMP/render-hunt/profiles"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Gecko profiles of the 10-scene loop, arm stockheaded"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py profile --arm stockheaded --out "$RUNNER_TEMP/render-hunt/profiles"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Symbols of our engine (artifact symbols-win-x86_64 of the engine's release.yml)"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="$RUNNER_TEMP/render-hunt/profiles"
          ID="$(python scripts/hunt_profile_summary.py "$P/ours" --ids | awk '$3=="xul.dll"{print $2}' | head -1)"
          echo "breakpad id of our xul.dll in the profile: '$ID'"
          if [ -z "$ID" ]; then echo "SYMBOLS: none (no id: no parent profile of ours)"; exit 0; fi
          python scripts/hunt_fetch_symbols.py --id "$ID" --run "${{ inputs.symbols_run }}" --out "$RUNNER_TEMP/render-hunt/symbols" | tee "$RUNNER_TEMP/render-hunt/symbols.log"
      - name: "2. Profile summary, ours"
        if: always()
        continue-on-error: true
        run: |
          P="$RUNNER_TEMP/render-hunt/profiles"
          SYM=$(ls "$RUNNER_TEMP"/render-hunt/symbols/symbols-*.zip 2>/dev/null | head -1 || true)
          python -u scripts/hunt_profile_summary.py "$P/ours" ${SYM:+--symbols "$SYM"} | tee "$P/summary-ours.txt"
      - name: "2. Profile summary, stockheaded"
        if: always()
        continue-on-error: true
        run: |
          P="$RUNNER_TEMP/render-hunt/profiles"
          python -u scripts/hunt_profile_summary.py "$P/stockheaded" | tee "$P/summary-stockheaded.txt"


      # ----------------------------------------------------------------------------------------- 6. a readable profile of OUR GPU process
      - name: "6. Gecko profile of our GPU process only (filtered threads, small buffer, 3 rounds)"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_render_path.py profile --arm ours --binary "$FF" --gpu --out "$RUNNER_TEMP/render-hunt/profiles-gpu"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "6. Summary of the GPU process: self time by module and the top functions"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          P="$RUNNER_TEMP/render-hunt/profiles-gpu/ours"
          SYM=$(ls "$RUNNER_TEMP"/render-hunt/symbols/symbols-*.zip 2>/dev/null | head -1 || true)
          if [ -z "$SYM" ]; then
            ID="$(python scripts/hunt_profile_summary.py "$P" --ids | awk '$3=="xul.dll"{print $2}' | head -1)"
            echo "no symbols from step 2; breakpad id of our xul.dll in the GPU run: '$ID'"
            if [ -n "$ID" ]; then python scripts/hunt_fetch_symbols.py --id "$ID" --run "${{ inputs.symbols_run }}" --out "$RUNNER_TEMP/render-hunt/symbols" | tee "$RUNNER_TEMP/render-hunt/symbols-gpu.log"; fi
            SYM=$(ls "$RUNNER_TEMP"/render-hunt/symbols/symbols-*.zip 2>/dev/null | head -1 || true)
          fi
          python -u scripts/hunt_profile_summary.py "$P" ${SYM:+--symbols "$SYM"} --only gpu --detail 2 --threads 6 --top 20 | tee "$P/summary-gpu.txt"

      # ----------------------------------------------------- 5b. the wrapper's own byte suites under both arms (the pref goes in through a plugin)
      - name: "5. The wrapper's byte suites, arm ours"
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts
          INVPW_BINARY_PATH: ${{ env.FF }}
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog-suites.log
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          D="$RUNNER_TEMP/render-hunt/suites"; mkdir -p "$D"
          FILES=$(ls tests/test_canvas_*.py tests/test_webgl_*.py tests/test_a_declared_webgl_extension_survives_its_use_e2e.py \
                     tests/test_fingerprint_surface.py tests/test_fingerprint_consistency.py tests/test_system_fonts_and_colors_are_windows_e2e.py \
                     tests/test_css_calc_is_windows_e2e.py tests/test_screenshot_of_text_returns_linux_e2e.py | sort -u)
          echo "$FILES" > "$D/files.txt"; echo "$FILES" | wc -l
          python -u -m pytest $FILES -o addopts= -p no:cacheprovider -p hunt_extra_prefs_plugin -q -rs --junitxml="$D/ours.xml" 2>&1 | tee "$D/ours.log" | tail -60
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "5. The wrapper's byte suites, arm ours_swwr (HUNT_EXTRA_PREFS gfx.webrender.software=true)"
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts
          INVPW_BINARY_PATH: ${{ env.FF }}
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog-suites.log
          HUNT_EXTRA_PREFS: '{"gfx.webrender.software": true}'
          HUNT_EXTRA_PREFS_LOG: ${{ runner.temp }}/render-hunt/suites/ours_swwr-prefs.log
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          D="$RUNNER_TEMP/render-hunt/suites"; mkdir -p "$D"
          FILES=$(cat "$D/files.txt" 2>/dev/null || true)
          [ -n "$FILES" ] || FILES=$(ls tests/test_canvas_*.py tests/test_webgl_*.py)
          python -u -m pytest $FILES -o addopts= -p no:cacheprovider -p hunt_extra_prefs_plugin -q -rs --junitxml="$D/ours_swwr.xml" 2>&1 | tee "$D/ours_swwr.log" | tail -60
          echo "browsers constructed with the pref: $(wc -l < "$D/ours_swwr-prefs.log" 2>/dev/null || echo 0)"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "5. The wrapper's byte suites, outcome per test in both arms"
        if: always()
        continue-on-error: true
        run: |
          D="$RUNNER_TEMP/render-hunt/suites"
          python scripts/hunt_page_bytes.py suites "$D/ours.xml" "$D/ours_swwr.xml" | tee "$D/suites-diff.txt"

      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results (about:support, prefs, CPU numbers, summaries, raw gzipped profiles)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-render-path-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/render-hunt/support
            ${{ runner.temp }}/render-hunt/cpu
            ${{ runner.temp }}/render-hunt/profiles
            ${{ runner.temp }}/render-hunt/profiles-gpu
            ${{ runner.temp }}/render-hunt/baseline
            ${{ runner.temp }}/render-hunt/pagebytes
            ${{ runner.temp }}/render-hunt/suites
            ${{ runner.temp }}/render-hunt/symbols.log
          if-no-files-found: warn
          retention-days: 14
