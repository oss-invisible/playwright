# ─────────────────────────────────────────────────────────────────────────────
# compositor-visible-hunt.yml - HUNT ONLY, never merged. Nothing of the product is changed. Starts on its own paths only (the hunts running on this branch are
# not restarted by it, and it is not restarted by them).
#
# Can a PAGE tell software compositing ("WebRender (Software)") from our hardware path? Earlier rAF data showed 60 fps in one arm and 50-53 in another: why?
# Four arms, one browser each, ~20 s each, windows-2022, two rounds (alternating, so a drift of the runner is seen): ours, ours_vmretail (the prefs of
# hunt_vmretail.py build: retail's VM decisions), stockheaded, and retail 159.0 launched by hand (Mozilla's installer, checked against SHA256SUMS; the page runs
# the probe and posts its result to the local server). In the page (scripts/hunt_compositor_probe.js): requestAnimationFrame alone (interval p5/p50/p95, fps,
# dropped frames), with a CSS animation, with a WebGL animation; a smooth scrollTo of a long page (scroll events per second, time to finish); canvas 2D getImageData
# on 1024x1024 after drawing and WebGL readPixels timings; matchMedia (update: fast), screen refresh hints, the resolution of performance.now().
# `facts` reads, per arm, what Troubleshoot exposes (graphics.monitors[].refreshRate, the layer manager, layout.frame_rate, gfx.vsync.*) and PowerShell's
# Win32_VideoController.CurrentRefreshRate. The table marks every difference between ours / ours_vmretail and retail as TIMING-ONLY or VALUE.
# The code that decides the rAF rate: gfx/thebes/gfxWindowsPlatform.cpp D3DVsyncSource (rate from DwmGetCompositionTimingInfo, loop on WaitForVBlank, software
# vsync when it returns in under 1 ms or fails) and gfx/thebes/gfxPlatform.cpp:3462-3516 (layout.frame_rate, 60 Hz default): see the docstring of
# scripts/hunt_compositor_visible.py.
# Every step is continue-on-error: a hunt must give whatever it got.
# ─────────────────────────────────────────────────────────────────────────────
name: compositor visible hunt

on:
  push:
    branches: [hunt/cpu-render-path]
    paths:
      - scripts/hunt_compositor_visible.py
      - scripts/hunt_compositor_probe.js
      - .github/workflows/compositor-visible-hunt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compositor-visible-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, what a page reads of the compositor: ours, ours_vmretail, stockheaded, retail)"
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Where the prefs of ours_vmretail are written
        run: echo "HUNT_VMRETAIL_PREFS=$RUNNER_TEMP/cv/vmretail/prefs.json" >> "$GITHUB_ENV"
      - name: "Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS, unpacked with 7-Zip)"
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/cv/retail"
      - name: "Build ours_vmretail (the declared table of ours, the decisions of stock, the prefs)"
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_vmretail.py build --binary "$FF" --out "$RUNNER_TEMP/cv/vmretail" | tee "$RUNNER_TEMP/cv/vmretail-build.txt"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true

      # ---------------------------------------------------------------------------------------- the facts (once per arm)
      - name: "Facts, arm ours (Troubleshoot, effective prefs)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py facts --arm ours --binary "$FF" --out "$RUNNER_TEMP/cv/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm ours_vmretail (Troubleshoot, effective prefs)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py facts --arm ours_vmretail --binary "$FF" --out "$RUNNER_TEMP/cv/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm stockheaded (Troubleshoot, effective prefs)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py facts --arm stockheaded --out "$RUNNER_TEMP/cv/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm retail (Troubleshoot, effective prefs)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py facts --arm retail --retail-from "$RUNNER_TEMP/cv/retail" --out "$RUNNER_TEMP/cv/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true

      # ---------------------------------------------------------------------------------------- the measurement, two rounds
      - name: "Round 1, arm ours (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/cv/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm retail (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm retail --retail-from "$RUNNER_TEMP/cv/retail" --out "$RUNNER_TEMP/cv/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm ours_vmretail (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm ours_vmretail --binary "$FF" --out "$RUNNER_TEMP/cv/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm stockheaded (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm stockheaded --out "$RUNNER_TEMP/cv/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1: table, what differs between ours / ours_vmretail and retail"
        if: always()
        continue-on-error: true
        run: |
          cp -r "$RUNNER_TEMP/cv/r0/"*-facts "$RUNNER_TEMP/cv/r1/" 2>/dev/null || true
          python -u scripts/hunt_compositor_visible.py table "$RUNNER_TEMP/cv/r1" | tee "$RUNNER_TEMP/cv/r1/table.txt"
      - name: "Round 2, arm stockheaded (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm stockheaded --out "$RUNNER_TEMP/cv/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours_vmretail (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm ours_vmretail --binary "$FF" --out "$RUNNER_TEMP/cv/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm retail (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm retail --retail-from "$RUNNER_TEMP/cv/retail" --out "$RUNNER_TEMP/cv/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours (one browser, ~20 s in the page)"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_compositor_visible.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/cv/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2: table, what differs between ours / ours_vmretail and retail"
        if: always()
        continue-on-error: true
        run: |
          cp -r "$RUNNER_TEMP/cv/r0/"*-facts "$RUNNER_TEMP/cv/r2/" 2>/dev/null || true
          python -u scripts/hunt_compositor_visible.py table "$RUNNER_TEMP/cv/r2" | tee "$RUNNER_TEMP/cv/r2/table.txt"

      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compositor-visible-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cv/r0
            ${{ runner.temp }}/cv/r1
            ${{ runner.temp }}/cv/r2
            ${{ runner.temp }}/cv/vmretail
            ${{ runner.temp }}/cv/vmretail-build.txt
          if-no-files-found: warn
          retention-days: 14
