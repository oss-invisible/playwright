# ─────────────────────────────────────────────────────────────────────────────
# encoding-stability-hunt.yml - HUNT ONLY, never merged: "same seed, same bytes" for the PNG of the canvas. Nothing of the product is changed.
#
# In scripts/hunt_page_bytes.py (seed 42, two launches of the same arm) 11 keys were not stable: the PNG (toDataURL, toBlob, convertToBlob) of the 2D
# scenes shapes, composite, image and text, of the OffscreenCanvas and of the WebGL 1 and 2 triangle. Their pixels (getImageData, readPixels), JPEG and
# WebP were stable. Questions, per key:
#   - do the PIXELS differ, or only the encoding? (the probe's ENCODING MODE puts the pixels of the draw, the raw bytes of three toDataURL and three toBlob
#     in one page, and the pixels the browser decodes from the first PNG; scripts/hunt_encoding.py reads the PNG chunks, inflates and unfilters the IDATs)
#   - is the difference between two launches on one runner, and also between two runners? (a 2-leg matrix, windows-2022, max-parallel 2; the job
#     `compare` reads both legs)
#   - does it happen with the published invisible-playwright 0.52.0 (its own venv, its own binary), and with stock Playwright's firefox (headed and
#     headless)?
#   - is the probe at fault? (anything time-, random- or order-dependent in what it draws: three calls on the same canvas in the same page say so)
# The arms: ours (this checkout's wrapper with the published binary of the job), ours_pypi052, stockheaded, stockheadless and, from the second run,
# `retail` (Mozilla's Firefox 159.0 installer, checked against its SHA256SUMS, launched by hand: subprocess, -no-remote, a fresh profile, no automation);
# two launches each.
#
# FINDING OF THE FIRST RUN (43652292507), read again with a parser that checks the PNG against the specification: the pixels, the filter and the deflate
# stream of every PNG are identical between two launches, between two runners, in every arm. The ONE difference is a 16-byte ancillary chunk `deBG` after the
# IDATs (16 hex characters, plus its CRC): upstream Mozilla's nsPNGEncoder::MaybeAddCustomMetadata (image/encoders/png/nsPNGEncoder.cpp, the four letters
# are set one by one, which is why `git grep deBG` finds nothing), keyed by the session's fingerprinting randomization key. The core turns
# privacy.baselineFingerprintingProtection on to match retail 151 (invisible_core/prefs.py). What this run adds: does retail 159 write it, and with a
# different value in every launch?
# ─────────────────────────────────────────────────────────────────────────────
name: encoding stability hunt

on:
  push:
    branches: [hunt/cpu-render-path]
    paths:
      - scripts/hunt_encoding.py
      - scripts/hunt_page_bytes_probe.js
      - .github/workflows/encoding-stability-hunt.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: encoding-stability-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, leg ${{ matrix.leg }} - PNG stability: ours, PyPI 0.52.0, stock headed and headless)"
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        leg: [A, B]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper of this checkout, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: The PNG parser against PNGs whose chunks are known
        run: python scripts/hunt_encoding.py selftest
      - name: "Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS, unpacked with 7-Zip)"
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/retail"
      - name: Install the PUBLISHED invisible-playwright 0.52.0 in its own venv, and fetch its own binary
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/pypi052"
          "$RUNNER_TEMP/pypi052/Scripts/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pypi052/Scripts/python" -m pip install "invisible-playwright==0.52.0"
          "$RUNNER_TEMP/pypi052/Scripts/python" -m pip list 2>/dev/null | grep -i -E "invisible|playwright"
          echo "FF052=$(cd "$RUNNER_TEMP" && "$RUNNER_TEMP/pypi052/Scripts/python" -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: "Arm ours (this checkout's wrapper, the job's binary), 2 launches"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_encoding.py collect --client ours --label ours --binary "$FF" --out "$RUNNER_TEMP/enc/${{ matrix.leg }}"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Arm ours_pypi052 (invisible-playwright 0.52.0 from PyPI, its own binary), 2 launches"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo "binary of 0.52.0: ${FF052:-<none>}"
          "$RUNNER_TEMP/pypi052/Scripts/python" -u scripts/hunt_encoding.py collect --client ours --label ours_pypi052 ${FF052:+--binary "$FF052"} --out "$RUNNER_TEMP/enc/${{ matrix.leg }}"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Arm stockheaded (stock Playwright firefox, headless=False), 2 launches"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_encoding.py collect --client stock --label stockheaded --out "$RUNNER_TEMP/enc/${{ matrix.leg }}"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Arm stockheadless (stock Playwright firefox, headless=True), 2 launches"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_encoding.py collect --client stock --label stockheadless --headless --out "$RUNNER_TEMP/enc/${{ matrix.leg }}"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Arm retail (Mozilla's Firefox 159.0 launched by hand, no automation), 2 launches"
        if: always()
        continue-on-error: true
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_encoding.py collect --client retail --label retail --retail-from "$RUNNER_TEMP/retail" --out "$RUNNER_TEMP/enc/${{ matrix.leg }}"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Per-key table of this runner (two launches, three calls in one page)"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_encoding.py table "$RUNNER_TEMP/enc/${{ matrix.leg }}" | tee "$RUNNER_TEMP/enc/${{ matrix.leg }}/table.txt"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the raw probe results of this runner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encoding-stability-${{ matrix.leg }}
          path: ${{ runner.temp }}/enc/${{ matrix.leg }}
          if-no-files-found: warn
          retention-days: 14

  compare:
    name: "hunt (compare the two runners)"
    needs: hunt
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: The PNG parser against PNGs whose chunks are known
        run: python scripts/hunt_encoding.py selftest
      - name: Download both legs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for leg in A B; do
            gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" -n "encoding-stability-$leg" -D "enc/$leg" || echo "leg $leg: no artifact"
          done
          ls -R enc | head -40
      - name: "Per-key table: same runner and across the two runners"
        continue-on-error: true
        run: python -u scripts/hunt_encoding.py table enc/A enc/B | tee enc/table-two-runners.txt
      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encoding-stability-table
          path: enc/table-two-runners.txt
          if-no-files-found: warn
          retention-days: 14
