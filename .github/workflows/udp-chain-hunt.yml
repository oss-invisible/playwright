# ─────────────────────────────────────────────────────────────────────────────
# udp-chain-hunt.yml - HUNT ONLY, never merged: why does
# tests/test_the_whole_udp_chain_by_name_e2e.py::test_a_turn_srflx_by_name_arrives_through_the_relay_when_the_exit_of_the_lab_is_loopback
# fail on Windows CI with page status TIMEOUT (srflx at ~1031 ms, but the tick of 2000 ms fires before the reply to the page's POST
# clears it)?
#
# It measures, and changes neither the tick nor what the test asserts (tests/_udp_chain_hunt.py):
#   1. the POST on both sides (the page: performance.now() and Date.now(); the page server: time.time() of the request line and of the
#      response written);
#   2. the gateway's view of the connection that carried it (new CONNECT or an older connection, every step, time.time());
#   3. the TLS handshakes the FakeDoh rejects (time, SNI, client port; no process lookup: it is costly and holds the GIL);
#   4. a sentinel thread of the pytest process (sleep 10 ms, every gap over 50 ms);
#   5. every gateway connection: accepted, first bytes of the greeting, greeted (histogram, and those over 500 ms).
#
# The load is the one of an e2e leg: scripts/run_e2e.py with its own settings (4 browsers, --dist loadfile), over the files of the Windows
# e2e part 2 (computed as e2e.yml does), and the target test repeated 12 times (INVPW_HUNT_REPS, the parameter `hunt_rep`). The target file
# is handed first, so its worker starts at once and the repetitions overlap the other three workers' files.
# ─────────────────────────────────────────────────────────────────────────────
name: udp chain hunt

on:
  push:
    branches: [hunt/udp-chain-post]
    # not for the other hunt's files (the CPU-per-browser hunt on the same branch), nor for this file alone
    paths-ignore:
      - scripts/hunt_cpu_per_browser.py
      - .github/workflows/cpu-per-browser-hunt.yml
      - .github/workflows/udp-chain-hunt.yml

permissions:
  contents: read

concurrency:
  group: udp-chain-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as in e2e.yml).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: hunt (windows-2022, load of e2e part 2, target x12)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool), as the Windows e2e job does
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: The files of part 2 of the Windows e2e, without the linux_only suites, and the target first
        run: |
          set -e
          python -m pytest --collect-only -q -m e2e -o addopts= -p no:cacheprovider 2>/dev/null | grep "::" | cut -d: -f1 | sort -u > "$RUNNER_TEMP/e2e_files.txt"
          python - "2" "$RUNNER_TEMP" <<'PY'
          import json, os, sys
          part, tmp = int(sys.argv[1]), sys.argv[2]
          target_file = "tests/test_the_whole_udp_chain_by_name_e2e.py"
          target = target_file + "::test_a_turn_srflx_by_name_arrives_through_the_relay_when_the_exit_of_the_lab_is_loopback"
          rows = json.load(open("ci/required-suites.json", encoding="utf-8"))
          left_out = [t for r in rows if r.get("linux_only") for t in r["tests"]]
          files = [l.strip() for l in open(os.path.join(tmp, "e2e_files.txt")) if l.strip()]
          files = [f for f in files if f not in left_out]
          mine = [f for i, f in enumerate(files) if i % 4 == part - 1]
          print("target file is among the files of part %d: %s" % (part, target_file in mine))
          # the target alone from its file (the other test of that file needs root and is linux_only), handed first
          load = [f for f in mine if f != target_file]
          nodes = [t for t in left_out if "::" in t and t.split("::")[0] in load]
          open(os.path.join(tmp, "e2e_args.txt"), "w").write("\n".join([target] + load + ["--deselect=" + n for n in nodes]) + "\n")
          print("%d e2e files in part %d (+ the target), %d node(s) deselected" % (len(load), part, len(nodes)))
          PY
          cat "$RUNNER_TEMP/e2e_args.txt"
      - name: Run the load of an e2e leg, the target repeated 12 times
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
          INVPW_HUNT_REPS: "12"
          INVPW_HUNT_FILE: ${{ runner.temp }}/hunt.log
        run: |
          mapfile -t ARGS < <(tr -d '\r' < "$RUNNER_TEMP/e2e_args.txt")
          python -u scripts/run_e2e.py "$FF" -n 4 "${ARGS[@]}"
      # Every HUNT line of every run, in the order written, and the explanation of every failure (the lines `| ...` after
      # "the explanation of this failure"). The same file is uploaded below.
      - name: Every HUNT line
        if: always()
        run: |
          f="$RUNNER_TEMP/hunt.log"
          if [ -s "$f" ]; then
            echo "$(grep -c ' 1. status=' "$f" || true) run(s) reported; $(grep -c 'the explanation of this failure' "$f" || true) failure explanation(s)"
            cat "$f"
          else
            echo "::warning::no HUNT line was written: the target test did not reach its report"
          fi
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the HUNT lines and the hang evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: udp-chain-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hunt.log
            ${{ runner.temp }}/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14
