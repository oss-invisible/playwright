# ─────────────────────────────────────────────────────────────────────────────
# msaa-hunt.yml - HUNT ONLY, never merged. Nothing of the product is changed: the prefs of the arm ours_nomsaa go through extra_prefs, from the hunt.
# Starts on its own paths only (the hunts running on this branch are not restarted by it, and it is not restarted by them).
#
# Measured: WebGL readPixels of 1024x1024 takes ~400 ms (p50) in ours and in ours_vmretail against ~89 ms in stock and in retail 159.
# Hypothesis: the multisample we force. GLContext.cpp:783-787 marks framebuffer_multisample unsupported on the Microsoft Basic Render Driver; the engine's hook at
# GLContext.cpp:799 (StealthDeclaredMultisample) turns it back on when webgl.msaa-samples > 0; the core sets webgl.msaa-samples=4 and webgl.msaa-force=true on Windows
# (invisible_core/prefs.py:1263-1264); so every readPixels of the default framebuffer resolves MSAA in software.
# Arms: ours, ours_nomsaa (webgl.msaa-samples=0, webgl.msaa-force=false from the hunt), stockheaded, retail 159.0 launched by hand (Mozilla's installer, checked against
# SHA256SUMS). Measured in each browser, in the page (scripts/hunt_msaa_probe.js): readPixels 1024x1024 (first, repeat p50, draw then 1 pixel) and toDataURL with
# antialias:true AND antialias:false in the same browser; a 256x256 scene with diagonal edges read back with readPixels and toDataURL, the edge pixels hashed apart from the
# interior ones, the antialiased pixels counted; getContextAttributes().antialias, SAMPLES, SAMPLE_BUFFERS, MAX_SAMPLES. Two rounds in reversed order. `facts` reads the
# multisample prefs back. Then the page-readable bytes of scripts/hunt_page_bytes.py (the 86-key diff), ours against ours_nomsaa.
# What retail does, from the sources, is in the docstring of scripts/hunt_msaa.py.
# Every step is continue-on-error: a hunt must give whatever it got.
# ─────────────────────────────────────────────────────────────────────────────
name: msaa hunt

on:
  push:
    branches: [hunt/cpu-render-path]
    paths:
      - scripts/hunt_msaa.py
      - scripts/hunt_msaa_probe.js
      - .github/workflows/msaa-hunt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msaa-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, MSAA and readPixels: ours, ours_nomsaa, stockheaded, retail)"
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: "Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS, unpacked with 7-Zip)"
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/ms/retail"

      # ------------------------------------------------------------------------------------------ the multisample prefs, read back (once per arm)
      - name: "Facts, arm ours (effective webgl.msaa-* prefs, Troubleshoot)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py facts --arm ours --binary "$FF" --out "$RUNNER_TEMP/ms/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm ours_nomsaa (effective webgl.msaa-* prefs, Troubleshoot)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py facts --arm ours_nomsaa --binary "$FF" --out "$RUNNER_TEMP/ms/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm stockheaded (effective webgl.msaa-* prefs, Troubleshoot)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py facts --arm stockheaded --out "$RUNNER_TEMP/ms/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Facts, arm retail (effective webgl.msaa-* prefs, Troubleshoot)"
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py facts --arm retail --retail-from "$RUNNER_TEMP/ms/retail" --out "$RUNNER_TEMP/ms/r0"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true

      # ------------------------------------------------------------------------------------------ readPixels timing and the edges, two rounds
      - name: "Round 1, arm ours"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/ms/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm retail"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm retail --retail-from "$RUNNER_TEMP/ms/retail" --out "$RUNNER_TEMP/ms/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm ours_nomsaa"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm ours_nomsaa --binary "$FF" --out "$RUNNER_TEMP/ms/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 1, arm stockheaded"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm stockheaded --out "$RUNNER_TEMP/ms/r1"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm stockheaded"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm stockheaded --out "$RUNNER_TEMP/ms/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours_nomsaa"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm ours_nomsaa --binary "$FF" --out "$RUNNER_TEMP/ms/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm retail"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm retail --retail-from "$RUNNER_TEMP/ms/retail" --out "$RUNNER_TEMP/ms/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Round 2, arm ours"
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_msaa.py run --arm ours --binary "$FF" --out "$RUNNER_TEMP/ms/r2"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Table: timing, values, the edges pixel by pixel, what differs"
        if: always()
        continue-on-error: true
        run: |
          cp -r "$RUNNER_TEMP/ms/r0/"*-facts "$RUNNER_TEMP/ms/r1/" 2>/dev/null || true
          python -u scripts/hunt_msaa.py table "$RUNNER_TEMP/ms/r1" "$RUNNER_TEMP/ms/r2" | tee "$RUNNER_TEMP/ms/table.txt"

      # ------------------------------------------------------------------------------------------ the page-readable bytes, ours against ours_nomsaa
      - name: "Page-readable bytes, arm ours (2 launches)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_page_bytes.py collect --arm ours --binary "$FF" --launches 2 --out "$RUNNER_TEMP/ms/pagebytes"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Page-readable bytes, arm ours_nomsaa (2 launches)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_page_bytes.py collect --arm ours_nomsaa --binary "$FF" --launches 2 --out "$RUNNER_TEMP/ms/pagebytes"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "Page-readable bytes, ours against ours_nomsaa"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_page_bytes.py diff "$RUNNER_TEMP/ms/pagebytes" --a ours --b ours_nomsaa | tee "$RUNNER_TEMP/ms/pagebytes/diff.txt"

      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: msaa-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ms/r0
            ${{ runner.temp }}/ms/r1
            ${{ runner.temp }}/ms/r2
            ${{ runner.temp }}/ms/table.txt
            ${{ runner.temp }}/ms/pagebytes
          if-no-files-found: warn
          retention-days: 14
