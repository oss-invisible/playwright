# ─────────────────────────────────────────────────────────────────────────────
# first-run-hunt.yml - HUNT ONLY, never merged. Nothing of the product is changed. Starts on its own paths only: the two other hunts running on this
# branch (cpu-render-path-hunt-vm.yml, encoding-stability-hunt.yml) are not restarted by it, and it is not restarted by them.
#
# In ours with a fresh profile the parent shows a ~15 s CPU burst between +8 and +50 s after the launch, with these downloads: remote settings 18.9 MB,
# CRLite 6 MB, safebrowsing 8.5 MB, Widevine 23 MB, the newtab xpi; after that it drops to zero.
#   Part 1 (scripts/hunt_first_run.py census): does retail Firefox 159.0 (Mozilla's installer, verified against its SHA256SUMS, launched by hand with
#     subprocess: -no-remote, a fresh profile, an idle local page, no automation, no Playwright) show the same burst, with the same duration and the
#     same downloads? 80 s, slices of 10 s: the parent's CPU, the parent's CPU per thread name, the files written in the profile (path and size; the
#     directories gmp-*, security_state, safebrowsing, settings, features listed), the bytes the network interfaces received and sent. Ours (fresh
#     profile) in the same table.
#   Part 2 (scripts/hunt_first_run.py probe): what can a PAGE read of that state? ours with a fresh profile, ours with a used one, retail fresh, retail
#     used (launched a second time on the profile of part 1), probed at +5, +20, +40 and +90 s: requestMediaKeySystemAccess for Widevine, ClearKey and
#     PlayReady (outcome, time to resolve, the configuration returned), MediaCapabilities for encrypted and WebRTC H.264 configurations, the WebRTC codec
#     lists (OpenH264 is a downloaded GMP), canPlayType, mediaDevices, plugins, permissions, storage, and whether three hosts are reachable/blocked.
#     Each arm runs twice: `seq` (the four moments in one launch) and `late` (only +90 s: asking early may start a download).
# Every step is continue-on-error: a hunt must give whatever it got.
# ─────────────────────────────────────────────────────────────────────────────
name: first run hunt

on:
  push:
    branches: [hunt/cpu-render-path]
    paths:
      - scripts/hunt_first_run.py
      - scripts/hunt_first_run_probe.js
      - .github/workflows/first-run-hunt.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-run-hunt-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: "hunt (windows-2022, first 80 s of a new profile: retail against ours; what a page reads of it)"
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper and psutil
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: "Retail Firefox 159.0 (Mozilla's installer, checked against SHA256SUMS, unpacked with 7-Zip), once"
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py fetch-retail --out "$RUNNER_TEMP/fr/retail"

      # ----------------------------------------------------------------------------------------------- part 1: the first 80 s of a new profile
      - name: "1. Census, retail (fresh profile, 80 s; the profile is kept for part 2)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py census --arm retail --retail-from "$RUNNER_TEMP/fr/retail" --keep-profile "$RUNNER_TEMP/fr/profile-retail" --out "$RUNNER_TEMP/fr/census"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "1. Census, ours (fresh profile, 80 s)"
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py census --arm ours --binary "$FF" --out "$RUNNER_TEMP/fr/census"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "1. Table: retail and ours, slice by slice"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py census-table "$RUNNER_TEMP/fr/census" | tee "$RUNNER_TEMP/fr/census/table.txt"

      # ----------------------------------------------------------------------------------------------- part 2: what a page reads
      - name: "2. Probe, ours_fresh, seq"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm ours_fresh --mode seq --binary "$FF" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, ours_fresh, late"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm ours_fresh --mode late --binary "$FF" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, ours_used, seq"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm ours_used --mode seq --binary "$FF" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, ours_used, late"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm ours_used --mode late --binary "$FF" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, retail_fresh, seq"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm retail_fresh --mode seq --retail-from "$RUNNER_TEMP/fr/retail" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, retail_fresh, late"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm retail_fresh --mode late --retail-from "$RUNNER_TEMP/fr/retail" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, retail_used, seq"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm retail_used --mode seq --retail-from "$RUNNER_TEMP/fr/retail" --profile "$RUNNER_TEMP/fr/profile-retail" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Probe, retail_used, late"
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_first_run.py probe --arm retail_used --mode late --retail-from "$RUNNER_TEMP/fr/retail" --profile "$RUNNER_TEMP/fr/profile-retail" --out "$RUNNER_TEMP/fr/probe"
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
      - name: "2. Tables: per probe and moment, fresh against used, ours and retail"
        if: always()
        continue-on-error: true
        run: python -u scripts/hunt_first_run.py probe-table "$RUNNER_TEMP/fr/probe" | tee "$RUNNER_TEMP/fr/probe/table.txt"

      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-run-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fr/census
            ${{ runner.temp }}/fr/probe
            ${{ runner.temp }}/fr/retail/retail.json
          if-no-files-found: warn
          retention-days: 14
