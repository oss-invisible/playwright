# HUNT ONLY, never merged. Criterion 1b, the final measure of the MOUSE, on the candidate 43843317541 (latitude/firefox-65, series
# 05522a48bdd8): what the page saw (mousemove, mousedown, mouseup, event.timeStamp and the handler's clock, with clientX/clientY) against the plan
# the client sent, in three configurations: Windows "one" (1 browser per process, 4 processes at once), Windows "inproc4" (4 browsers in one
# process), Linux "one". Core = 0e35e35 (oss-invisible/core, fix/stroke-on-own-clock: the path of the pointer is a stroke, `Actions.walk`),
# wrapper = release/0.53.0 (274fdc28).
# The plan: every Page.dispatchMouseEvent the core's client sends, with its `stroke` and `at`, recorded around the product by
# scripts/hunt_candidate.py (HUNT_CAND_MOUSE=1: Stroke.send, Actions._mouse_event outside a stroke, Actions.walk, the press settle). Nothing in
# a test, nothing changes what the product does. Joined to the page's events by the identity of the browser's core connection (exact), and
# each page move to the plan point it is by its coordinates. Reported per configuration, three lines: (a) pauses = page gaps over the plan's by
# more than 50 ms, (b) bursts = points the plan spaces by 8 ms or more that the page saw less than 2 ms apart, (c) the settle before the press.
name: candidate typing hunt
on:
  push:
    branches: [hunt/published-latency]
    paths: [.github/workflows/candidate-typing-hunt.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: candidate-typing-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { os: windows-2022, arms: "one inproc4" }
          - { os: ubuntu-24.04, arms: "one" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      ONLY_ARMS: ${{ matrix.arms }}
      ROUNDS: "6"
      HUNT_CAND_MOUSE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: A venv with the core 0e35e35 (the path of the pointer is a stroke) and the wrapper 274fdc28 (release/0.53.0), and stock Playwright
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=Scripts; else BIN=bin; fi
          P="$RUNNER_TEMP/after/$BIN/python"
          python -m venv "$RUNNER_TEMP/after"
          "$P" -m pip install -q --upgrade pip
          "$P" -m pip install -q "invisible-playwright==0.52.1" psutil websockets "playwright==$(cat scripts/playwright_pin.txt)"
          "$P" -m pip install -q --force-reinstall "git+https://github.com/oss-invisible/core@0e35e35f4a1017234c8cc51858c829de6f23ffc8"
          "$P" -m pip install -q --no-deps --force-reinstall "git+https://github.com/oss-invisible/playwright@274fdc2812e471f14039b2bef7e034efeae68a47"
          "$P" -c "
          import importlib.metadata as m, json
          for n in ('invisible-core', 'invisible-playwright'):
              d = m.distribution(n); u = json.loads(d.read_text('direct_url.json') or '{}')
              print(n, d.version, u.get('vcs_info', {}).get('commit_id'))
          import invisible_core.juggler._stroke as s, invisible_core.juggler.actions as a
          print('stroke client:', s.__name__, 'Actions.walk:', hasattr(a.Actions, 'walk'))
          "
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; "$P" -m playwright install --with-deps firefox; else "$P" -m playwright install firefox; fi
          echo "PY_AFTER=$P" >> "$GITHUB_ENV"
      - name: The engine of the candidate 43843317541, sealed for this run
        run: |
          RUN=43843317541
          # The run's own state is printed, and the series is checked: a push before the build is green fails here, with the artifacts it lacks.
          gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json status,conclusion,headSha,headBranch || true
          SHA=$(gh run view "$RUN" -R oss-invisible/firefox_antidetect_patch --json headSha --jq .headSha)
          case "$SHA" in 05522a48bdd8*) ;; *) echo "the run $RUN is not the series 05522a48bdd8 ($SHA)"; exit 1 ;; esac
          gh api "repos/oss-invisible/firefox_antidetect_patch/actions/runs/$RUN/artifacts" --jq '.artifacts[] | "artifact \(.name) \(.size_in_bytes) expired=\(.expired)"' | head -20 || true
          mkdir -p "$RUNNER_TEMP/eng" && cd "$RUNNER_TEMP/eng"
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh run download "$RUN" -R oss-invisible/firefox_antidetect_patch -n asset-win-x86_64 -D .
            unzip -q ./*.zip -d ff
            FF="$(cd ff && pwd -W)/firefox.exe"
          else
            gh run download "$RUN" -R oss-invisible/firefox_antidetect_patch -n asset-linux-x86_64 -D .
            mkdir ff && tar -xzf ./*.tar.gz -C ff
            FF="$(find "$PWD/ff" -maxdepth 2 -type f -name firefox | head -1)"
          fi
          ls -l "$FF"; sha256sum "$FF"
          echo "FF_AFTER=$FF" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          "$PY_AFTER" -m invisible_core seal --binary "$FF" --tag firefox-65-candidate -o "$RUNNER_TEMP/seal.json"
          echo "INVISIBLE_SEAL_FILE=$RUNNER_TEMP/seal.json" >> "$GITHUB_ENV"
      - name: Six rounds, the arms in rotating order
        continue-on-error: true
        timeout-minutes: 70
        run: |
          set +e
          S=scripts/hunt_candidate.py
          # What an arm prints: its HUNT lines, each tagged with the arm.
          keep() { grep --line-buffered -E '^HUNT(ROW|SLOW|PROBE|EVAL|SHUT|SURVIVOR|BGTASK)' | sed -u -E "s/^(HUNT[A-Z]+) /\1 [$1] /"; }
          # The retail arms: N browsers, round, seconds after the first load before the normal close (Linux headed under xvfb).
          retail() {
            if [ -z "$FF_RETAIL" ]; then echo "HUNTROW {\"arm\": \"retail\", \"crash\": \"no retail Firefox\"}"; return; fi
            if [ "$RUNNER_OS" = "Linux" ]; then
              # A window manager in the virtual display, so the retail browser can be closed as a person closes it (wmctrl ->
              # _NET_CLOSE_WINDOW -> WM_DELETE_WINDOW); without one only a signal is left, which is not a normal quit.
              xvfb-run -a -s "-screen 0 1280x1024x24" sh -c 'openbox > /dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$PY_AFTER" $S retail "$1" "$2" "$FF_RETAIL" "$3" 2>&1
            else
              "$PY_AFTER" $S retail "$1" "$2" "$FF_RETAIL" "$3" 2>&1
            fi
          }
          # A limit per arm, shorter than the step's: 4 times what the arm should take, at most 12 minutes. The arm's python writes its pid
          # (HUNT_PIDFILE, one line per process) and a watchdog kills that tree when the limit comes, printing the crash row; the next
          # arm then runs. The watchdog's output is kept off the arm's pipe (a sleep left behind must not hold the tee).
          limit_of() {
            local e
            case "$1" in
              solo|nclose20) e=30 ;; shut20) e=30 ;; inproc4|inproc4quiet|inproc4tz|inproc4px|stock|nclose20x4) e=35 ;;
              one|remote|retail1|retail4) e=45 ;; shut70|nclose75) e=85 ;; nclose75x4) e=95 ;; late|retail4late) e=100 ;;
              shut180|retail1long) e=200 ;; *) e=100 ;;
            esac
            echo $(( e * 4 > 720 ? 720 : e * 4 ))
          }
          kill_arm() {
            local pid
            for pid in $(cat "$HUNT_PIDFILE" 2>/dev/null); do
              if [ "$RUNNER_OS" = "Windows" ]; then taskkill //T //F //PID "$pid" > /dev/null 2>&1; else pkill -9 -P "$pid" > /dev/null 2>&1; kill -9 "$pid" > /dev/null 2>&1; fi
            done
          }
          run_arm() {
            local lim wd
            lim=$(limit_of "$1")
            export HUNT_PIDFILE="$RUNNER_TEMP/arm.pid" HUNT_ARM="$1" HUNT_LIMIT_S="$lim"
            : > "$HUNT_PIDFILE"
            rm -f "$RUNNER_TEMP/arm.done" "$HUNT_PIDFILE.fault"
            (
              exec > /dev/null
              sleep "$lim" > /dev/null 2>&1
              [ -e "$RUNNER_TEMP/arm.done" ] && exit 0
              echo "HUNTROW [$1] {\"arm\": \"$1\", \"round\": \"$2\", \"crash\": \"arm timed out after $lim s\"}" | tee -a "$RUNNER_TEMP/rows.log" >&2
              kill_arm
            ) &
            wd=$!
            case "$1" in
              inproc4) "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4 ;;
              inproc4quiet) HUNT_NO_SAMPLER=1 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4quiet ;;
              inproc4tz) HUNT_TIMEZONE=Europe/Rome "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4tz ;;
              inproc4px) HUNT_PROXY=1 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4px ;;
              late)    HUNT_TYPE_LATE_S=60 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep late ;;
              solo)    "$PY_AFTER" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep solo ;;
              remote)  "$PY_AFTER" $S remote 4 "$2" "$FF_AFTER" 2>&1 | keep remote ;;
              stock)   "$PY_AFTER" $S stock 4 "$2" 2>&1 | keep stock ;;
              one)     for k in 0 1 2 3; do "$PY_AFTER" $S inproc 1 "$2-$k" "$FF_AFTER" > "$RUNNER_TEMP/one-$k.log" 2>&1 & done; wait
                       cat "$RUNNER_TEMP"/one-*.log | keep one ;;
              shut20)  HUNT_SHUT=1 HUNT_SESSION_S=20 "$PY_AFTER" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep shut20 ;;
              shut70)  HUNT_SHUT=1 HUNT_SESSION_S=70 "$PY_AFTER" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep shut70 ;;
              shut180) HUNT_SHUT=1 HUNT_SESSION_S=180 "$PY_AFTER" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep shut180 ;;
              nclose20)    HUNT_NCLOSE=1 HUNT_SESSION_S=20 "$PY_NEXT" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep nclose20 ;;
              nclose75)    HUNT_NCLOSE=1 HUNT_SESSION_S=75 "$PY_NEXT" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep nclose75 ;;
              nclose20x4)  HUNT_NCLOSE=1 HUNT_SESSION_S=20 "$PY_NEXT" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep nclose20x4 ;;
              nclose75x4)  HUNT_NCLOSE=1 HUNT_SESSION_S=75 "$PY_NEXT" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep nclose75x4 ;;
              retail1) retail 1 "$2" 20 | keep retail1 ;;
              retail1long) retail 1 "$2" 180 | keep retail1long ;;
              retail4) retail 4 "$2" 20 | keep retail4 ;;
              retail4late) retail 4 "$2" 70 | keep retail4late ;;
            esac
            : > "$RUNNER_TEMP/arm.done"
            kill "$wd" > /dev/null 2>&1
            if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM firefox.exe //T > /dev/null 2>&1; else pkill -9 -f firefox > /dev/null 2>&1; fi
          }
          # The full list (the default when the focused one below is removed):
          #   inproc4 inproc4quiet inproc4tz inproc4px late solo one remote stock retail1 retail4 retail4late
          # The shutdown hunt: why our engine on Windows does not exit within the core's 5 s after a long session. shut20/70/180 are
          # ours (one browser per process, idle until the session is 20/70/180 s old, then closed, the engine's shutdown log timed),
          # the retail ones are the real Firefox closed by its window after 20 s / 70 s (4 together) / 180 s.
          #   shut20 shut70 shut180 retail1 retail4late retail1long   (the shutdown hunt of the run before)
          # The close of the core with a reaper (venv "next", git main of the core and the wrapper's fix branch), 1 browser and 4 in one
          # process, closed after 20 s / 75 s of session, against the real Firefox closed by its window, and ours as published (shut70).
          ARMS=(nclose20 nclose75 nclose20x4 nclose75x4 retail1 retail4late shut70)
          if [ -n "$ONLY_ARMS" ]; then read -ra ARMS <<< "$ONLY_ARMS"; fi
          N=${#ARMS[@]}
          for r in $(seq 0 $((${ROUNDS:-6}-1))); do
            for k in $(seq 0 $((N-1))); do
              if [ "$SECONDS" -gt 3780 ]; then echo "time guard: no new arm after $SECONDS s"; break 2; fi
              a=${ARMS[$(( (k + r) % N ))]}; run_arm "$a" "r$r" | tee -a "$RUNNER_TEMP/rows.log"
            done
          done
          true
      - name: The table
        if: always()
        run: |
          python - "$RUNNER_TEMP/rows.log" <<'PY'
          import json, re, sys, statistics
          rows = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTROW \[(\w+)\] (.*)", line.strip())
              if m:
                  rows.setdefault(m.group(1), []).append(json.loads(m.group(2)))
          def q(v, p):
              v = sorted(x for x in v if x is not None)
              return v[min(len(v) - 1, int(p * len(v)))] if v else None
          def cnt(v):
              c = {}
              for x in v:
                  c[str(x)] = c.get(str(x), 0) + 1
              return dict(sorted(c.items(), key=lambda kv: -kv[1])[:8])
          def trio(v):
              return "p50 %s p95 %s max %s" % (q(v, .5), q(v, .95), max((x for x in v if x is not None), default=None))
          for arm in ("inproc4", "inproc4quiet", "inproc4tz", "inproc4px", "late", "solo", "one", "remote", "stock", "shut20", "shut70", "shut180", "nclose20", "nclose75", "nclose20x4", "nclose75x4"):
              if not rows.get(arm):
                  continue
              r = [x for x in rows.get(arm, []) if "crash" not in x]
              crashes = len(rows.get(arm, [])) - len(r)
              ev =[e for x in r for e in x["eval_ms"]]
              gr = [g for x in r for g in x["goto_req_ms"]]
              print("HUNTLAUNCHSPLIT %-12s ms: launch() %s | new_context %s | new_page %s | first_load %s | to_first_load p50 %s p95 %s | Firefox parent CPU s p50: launch() %s new_context %s new_page %s first_load %s"
                    % (arm, trio([x.get("enter_ms") for x in r]), trio([x.get("ctx_ms") for x in r]), trio([x.get("new_page_ms") for x in r]), trio([x.get("first_load_ms") for x in r]),
                       q([x.get("to_first_load_ms") for x in r], .5), q([x.get("to_first_load_ms") for x in r], .95),
                       q([x.get("enter_cpu_s") for x in r], .5), q([x.get("ctx_cpu_s") for x in r], .5), q([x.get("new_page_cpu_s") for x in r], .5), q([x.get("first_load_cpu_s") for x in r], .5)))
              print("HUNTTABLE %-12s browsers %3d crashes %d | launch ms p50 %s p95 %s | close ms p50 %s p95 %s | eval ms p50 %s p95 %s max %s >300ms %d of %d | goto->request ms p50 %s p90 %s max %s | cpu s/browser p50 %s"
                    % (arm, len(r), crashes, q([x["launch_ms"] for x in r], .5), q([x["launch_ms"] for x in r], .95), q([x["close_ms"] for x in r], .5), q([x["close_ms"] for x in r], .95),
                       q(ev, .5), q(ev, .95), max(ev) if ev else None, sum(1 for e in ev if e > 300), len(ev), q(gr, .5), q(gr, .9), max((g for g in gr if g is not None), default=None),
                       q([x["cpu_s_per_browser"] for x in r], .5)))
              ty = [x.get("typing") or {} for x in r]
              ok = [t for t in ty if "slip_abs_max" in t]
              errs = [t.get("error") for t in ty if t.get("error")]
              print("HUNTTYPING %-12s typed %d of %d | key slip vs plan: p50 of browsers %s, max %s | keys over 100 ms %d of %d | compressions %d | mouse: longest gap %s ms, bursts <2 ms %d, clicks %d | errors %s"
                    % (arm, len(ok), len(ty), q([t["slip_abs_p50"] for t in ok], .5), max((t["slip_abs_max"] for t in ok), default=None),
                       sum(t["keys_over_100ms"] for t in ok), sum(t["keys_planned"] for t in ok), sum(t["compressions"] for t in ok),
                       max((t["mouse_gap_max"] or 0 for t in ty if "mousemoves" in t), default=None), sum(t.get("mouse_bursts_under_2ms", 0) for t in ty),
                       sum(t.get("clicks", 0) for t in ty), errs[:2]))
              # Where the slip is born, per key (detail = planned, sent, answered, timeStamp, handler; ms from the first send).
              det = [d for t in ok for d in t.get("detail") or []]
              late_c = [d[1] - d[0] for d in det]
              rt = [d[2] - d[1] for d in det]
              birth = [d[3] - d[1] for d in det]
              hts = [h for t in ok for h in t.get("handler_minus_ts") or []]
              print("HUNTKEYCLOCKS %-12s on event.timeStamp: keys over 100 ms %d, max %s, compressions %d | on the handler: keys over 100 ms %d, max %s | handler - timeStamp p50 %s p95 %s max %s | matched %d of %d | machine CPU busy %% during typing p50 %s max %s"
                    % (arm, sum(t["keys_over_100ms"] for t in ok), max((t["slip_abs_max"] for t in ok), default=None), sum(t["compressions"] for t in ok),
                       sum(t.get("h_keys_over_100ms", 0) for t in ok), max((t.get("h_slip_abs_max", 0) for t in ok), default=None),
                       q(hts, .5), q(hts, .95), max(hts, default=None), sum(1 for t in ok if t.get("detail")), len(ok),
                       q([t.get("machine_cpu_busy_pct") for t in ty], .5), max((t.get("machine_cpu_busy_pct") or 0 for t in ty), default=None)))
              if det:
                  print("HUNTKEYSPLIT %-12s client send vs plan: keys over 100 ms %d, p50 %s max %s | client send -> send_async returned p50 %s p95 %s max %s | client send -> event.timeStamp p50 %s p95 %s max %s"
                        % (arm, sum(1 for x in late_c if abs(x) > 100), q(late_c, .5), max(late_c), q(rt, .5), q(rt, .95), max(rt), q(birth, .5), q(birth, .95), max(birth)))
                  worst = sorted(((abs((t["detail"][i][3] - t["detail"][0][3]) - t["detail"][i][0]), t["detail"][max(0, i - 1):i + 1]) for t in ok if t.get("detail")
                                  for i in range(len(t["detail"]))), key=lambda w: -w[0])[:4]
                  for slip, pair in worst:
                      print("HUNTKEYWORST %-12s timeStamp slip %.0f ms | previous and this key [planned, sent, answered, timeStamp, handler]: %s" % (arm, slip, pair))
          # The mouse the page saw before and at the first click: the path (the gaps between consecutive mousemoves up to the press, on
          # event.timeStamp and, h_, on the handler), the click's dwell (mousedown -> mouseup) against the core's planned dwell (plan_click
          # of the persona of the seed, nonce 1 = the first click of page 0: exact). The path's own plan is the wrapper cursor's and is
          # judged by its gaps; the dwell on timeStamp differs from the plan by the difference of the two events' `latency` draws (<= 28 ms).
          for arm in ("inproc4", "one", "remote"):
              ty = [x.get("typing") or {} for x in rows.get(arm, []) if "crash" not in x]
              mt = [t for t in ty if "mv_n" in t]
              if not mt:
                  continue
              for pre, name in (("", "event.timeStamp"), ("h_", "handler")):
                  def g(k):
                      return [t.get(pre + k) for t in mt]
                  def mx(k):
                      return max((v for v in g(k) if v is not None), default=None)
                  slips = [abs(v) for v in g("click_dwell_slip") if v is not None]
                  print("HUNTMOUSE %-8s on %-15s browsers %d | path: moves p50 %s, median gap p50 %s ms, longest gap p50 %s max %s | gaps over 100 ms %d | compressions %d | click dwell p50 %s vs plan p50 %s: slip p50 %s, |slip| p50 %s max %s | press settle (last move -> press) p50 %s vs plan p50 %s"
                        % (arm, name, len(mt), q(g("mv_n"), .5), q(g("mv_gap_med"), .5), q(g("mv_gap_max"), .5), mx("mv_gap_max"),
                           sum(v or 0 for v in g("mv_gaps_over_100ms")), sum(v or 0 for v in g("mv_compressions")), q(g("click_dwell"), .5),
                           q([t.get("click_dwell_plan") for t in mt], .5), q(g("click_dwell_slip"), .5), q(slips, .5), max(slips, default=None),
                           q(g("press_settle"), .5), q([t.get("press_settle_plan") for t in mt], .5)))
          # The mouse against the plan of the stroke client (Page.dispatchMouseEvent through Stroke.send, paired with the browser by the identity of
          # its core connection: exact, else "unpaired"). Per page mousemove, the nearest plan point after shifting the page's clock onto the
          # plan's; the gap criterion (the page's gap over the planned gap, by more than 100 ms), bursts (page events within 2 ms where the plan
          # spaces them), the longest gap (in the plan or not), the compressions (frame coalescing or born close together), the settle.
          for arm in ("inproc4", "one", "remote"):
              ty = [x.get("typing") or {} for x in rows.get(arm, []) if "crash" not in x]
              if not any("mp_pairing" in t for t in ty):
                  continue
              print("HUNTMOUSEPAIR %-8s browsers %d | paired exactly %d, unpaired %d | client mouse events p50 %s"
                    % (arm, len(ty), sum(1 for t in ty if str(t.get("mp_pairing", "")).startswith("exact")), sum(1 for t in ty if t.get("mp_pairing") == "unpaired"),
                       q([t.get("mp_client_events") for t in ty], .5)))
              for pre, name in (("", "event.timeStamp"), ("h_", "handler")):
                  mp = [t for t in ty if pre + "mp_gap_excess_max" in t]
                  if not mp:
                      continue
                  comps = [c for t in mp for c in t.get(pre + "mp_compressions") or []]
                  print("HUNTMOUSEPLAN %-8s on %-15s browsers %d | offset to the nearest plan point |ms| p50 %s max %s | gap excess over 100 ms: %d gaps in %d browsers, max excess %s | bursts %d | page moves p50 %s of plan moves p50 %s"
                        % (arm, name, len(mp), q([t[pre + "mp_off_abs_p50"] for t in mp], .5), max(t[pre + "mp_off_abs_max"] for t in mp), sum(t[pre + "mp_gap_viol"] for t in mp),
                           sum(1 for t in mp if t[pre + "mp_gap_viol"]), max(t[pre + "mp_gap_excess_max"] for t in mp), sum(t[pre + "mp_bursts"] for t in mp),
                           q([t.get(pre + "mv_n") for t in mp], .5), q([t.get(pre + "mp_plan_moves") for t in mp], .5)))
                  print("HUNTMOUSELONG %-8s on %-15s longest page gap of each browser: p50 %s max %s ms | its planned gap p50 %s | in the plan (excess <= 100 ms) %d of %d | the plan's own longest gap p50 %s max %s"
                        % (arm, name, q([t[pre + "mp_longest_gap"] for t in mp], .5), max(t[pre + "mp_longest_gap"] for t in mp), q([t[pre + "mp_longest_gap_planned"] for t in mp], .5),
                           sum(1 for t in mp if t[pre + "mp_longest_gap_in_plan"]), len(mp), q([t[pre + "mp_plan_max_gap"] for t in mp], .5), max(t[pre + "mp_plan_max_gap"] for t in mp)))
                  print("HUNTMOUSECOMP %-8s on %-15s compressions %d: %s | examples %s"
