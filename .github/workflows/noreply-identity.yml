name: noreply-identity
# Pushes the gate does not see: branches other than main and tags. Pull requests and
# main go through the gate of tests.yml.
on:
  push:
    branches-ignore: [main]
    tags: ["**"]
permissions:
  contents: read
jobs:
  noreply-identity:
    uses: oss-invisible/core/.github/workflows/noreply-identity.yml@6d048ac02fc886a50791a4ae0423cbca2a547d72 # core main, the last change of noreply-identity.yml
