# ─────────────────────────────────────────────────────────────────────────────
# cpu-per-browser-hunt.yml - HUNT ONLY, never merged: why does OUR Firefox use more CPU than stock Firefox on Windows?
#
# scripts/hunt_cpu_per_browser.py (its docstring has the details). Six arms: ours (headed on a hidden desktop made by invisible_core),
# ourswin (headed on the interactive desktop), ourshl (our binary in true --headless), stock (--headless), stockwin (headed on the
# interactive desktop), stockhid (headed on a hidden desktop made the way invisible_core makes it). Per arm and round, three runs:
#   n1 loop    1 browser alone, 10 scenarios (an RTCPeerConnection with no ICE, 200 divs, a 2D canvas frame);
#   n1 scenes  1 browser: settle 8 s, idle on about:blank 30 s (in 3 slices), a still page 15 s, a requestAnimationFrame canvas 15 s, about:blank again 30 s ("late"), then about:support;
#   n4 loop    the same 10 scenarios with 4 browsers at once.
# Every window gives the kernel's CPU time per process (by type) and per thread (by name), the machine's CPU and every other process of the
# runner. The arms alternate and the order of the second round is the reverse of the first. Windows only; the last step prints the tables.
# ─────────────────────────────────────────────────────────────────────────────
name: cpu per browser hunt

on:
  push:
    branches: [hunt/udp-chain-post]
    paths:
      - scripts/hunt_cpu_per_browser.py
      - .github/workflows/cpu-per-browser-hunt.yml

permissions:
  contents: read

concurrency:
  group: cpu-per-browser-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as in e2e.yml).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: hunt (windows-2022, 6 arms, 1 and 4 browsers, scenes, 2 rounds)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Measure (6 arms x 3 runs x 2 rounds, alternating)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          OUT="$RUNNER_TEMP/cpu-hunt"; mkdir -p "$OUT"
          run() {   # arm browsers mode round
            taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
            echo "::group::$1 n$2 $3 round $4"
            python -u scripts/hunt_cpu_per_browser.py --arm "$1" --browsers "$2" --mode "$3" --round "$4" --binary "$FF"               --log "$OUT/$1-n$2-$3-r$4.log" --out "$OUT/$1-n$2-$3-r$4.json" || echo "FAILED: $*"
            echo "::endgroup::"
            taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
            echo "firefox left: $(tasklist //FI "IMAGENAME eq firefox.exe" 2>/dev/null | grep -c firefox.exe || true)"
          }
          ORDER1="ours stockwin stock ourswin stockhid ourshl"
          ORDER2="ourshl stockhid ourswin stock stockwin ours"
          for rnd in 1 2; do
            if [ "$rnd" = 1 ]; then ORDER=$ORDER1; else ORDER=$ORDER2; fi
            for arm in $ORDER; do
              run "$arm" 1 loop "$rnd"
              run "$arm" 1 scenes "$rnd"
              run "$arm" 4 loop "$rnd"
            done
          done
      - name: Comparison tables
        if: always()
        run: python scripts/hunt_cpu_per_browser.py --compare "$RUNNER_TEMP/cpu-hunt" | tee "$RUNNER_TEMP/cpu-hunt/compare.txt"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-per-browser-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpu-hunt/*.json
            ${{ runner.temp }}/cpu-hunt/compare.txt
            ${{ runner.temp }}/cpu-hunt/*.log
          if-no-files-found: warn
          retention-days: 14
