# ─────────────────────────────────────────────────────────────────────────────
# cpu-per-browser-hunt.yml - HUNT ONLY, never merged: under the same load, does OUR Firefox (invisible_playwright, in-process client) use more
# CPU per browser than stock Firefox 159 (stock Playwright's firefox-1572 with its own client)? Split by process type: parent, tab (content),
# gpu, socket, rdd, utility.
#
# scripts/hunt_cpu_per_browser.py runs an arm = 4 browsers at once in one client process, headless, 1 page each, every page looping 10 times
# over the same local scenario (an RTCPeerConnection with no ICE servers up to iceGatheringState complete, 200 DOM elements and a 2D canvas
# frame, then the next copy of the page). A separate process samples the CPU of every process every 250 ms; each firefox process is mapped to
# its browser by walking ppid and to its type by its -contentproc argument (the script's docstring has the details).
# The arms alternate: ours, stock, ours, stock. Windows only. The final step prints the comparison table.
# ─────────────────────────────────────────────────────────────────────────────
name: cpu per browser hunt

on:
  push:
    branches: [hunt/udp-chain-post]
    paths:
      - scripts/hunt_cpu_per_browser.py
      - .github/workflows/cpu-per-browser-hunt.yml

permissions:
  contents: read

concurrency:
  group: cpu-per-browser-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as in e2e.yml).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt:
    name: hunt (windows-2022, ours vs stock, 2 rounds each)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install the wrapper, psutil, and stock Playwright with its firefox
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" psutil
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
          python -m playwright install firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Arm ours, round 1
        id: ours1
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours --binary "$FF" --round 1 --out "$RUNNER_TEMP/cpu-hunt/ours-1.json" && rc=0 || rc=$?
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo "firefox left: $(tasklist //FI "IMAGENAME eq firefox.exe" 2>/dev/null | grep -c firefox.exe || true)"
          exit $rc
      - name: Arm stock, round 1
        id: stock1
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm stock --round 1 --out "$RUNNER_TEMP/cpu-hunt/stock-1.json" && rc=0 || rc=$?
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo "firefox left: $(tasklist //FI "IMAGENAME eq firefox.exe" 2>/dev/null | grep -c firefox.exe || true)"
          exit $rc
      - name: Arm ours, round 2
        id: ours2
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm ours --binary "$FF" --round 2 --out "$RUNNER_TEMP/cpu-hunt/ours-2.json" && rc=0 || rc=$?
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo "firefox left: $(tasklist //FI "IMAGENAME eq firefox.exe" 2>/dev/null | grep -c firefox.exe || true)"
          exit $rc
      - name: Arm stock, round 2
        id: stock2
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          python -u scripts/hunt_cpu_per_browser.py --arm stock --round 2 --out "$RUNNER_TEMP/cpu-hunt/stock-2.json" && rc=0 || rc=$?
          taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true
          echo "firefox left: $(tasklist //FI "IMAGENAME eq firefox.exe" 2>/dev/null | grep -c firefox.exe || true)"
          exit $rc
      - name: Comparison table
        if: always()
        run: python scripts/hunt_cpu_per_browser.py --compare "$RUNNER_TEMP/cpu-hunt"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-per-browser-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-hunt/*.json
          if-no-files-found: warn
          retention-days: 14
