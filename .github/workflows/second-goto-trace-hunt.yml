# ─────────────────────────────────────────────────────────────────────────────
# second-goto-trace-hunt.yml - a MEASUREMENT, not a gate: the protocol trace of
# the second goto that replaces the first, on OUR browser only. The scenario is
# the one of scripts/hunt_second_goto_vs_stock.py (a first goto to a page whose
# response is half there, a second goto to a third site as soon as the client
# has heard that response); with `--trace` every repetition also saves, with its
# time, every Juggler event the client receives for the page (navigationStarted,
# navigationCommitted, navigationAborted, frameAttached, frameDetached, the
# requests of the documents, executionContextsCleared and executionContextCreated)
# and the navigation id of each goto. It answers what the browser said, and in
# what order, in the repetitions where goto 2 stays pending and in the ones
# where it commits. It runs on a push to its own branch only.
# ─────────────────────────────────────────────────────────────────────────────
name: second-goto-trace-hunt

on:
  push:
    branches: [hunt/second-goto-trace]

permissions:
  contents: read

# A hunt has a group of its own, unique to the run: a newer push never cancels
# a measurement that is half done (tests/test_ci_runs_once_per_commit.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  # the core of main, not the pinned one: the pair is mismatched on purpose (as the core's wrapper-on-this-core job does)
  INVISIBLE_CORE_PIN: allow
  INVISIBLE_CORE_AUTOFIX: "off"

jobs:
  second-goto-trace-linux:
    name: second-goto-trace (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install --no-deps --force-reinstall "git+https://github.com/oss-invisible/core@65307f59f1245e214c8357593950d5ec929536ac"
          python -c "import invisible_core; from invisible_core.testing import e2e; c = e2e.command('4', [], junit='x.xml'); print('core', invisible_core.__version__, c); assert not any(a.startswith('--rerun') for a in c) and 'no:rerunfailures' in c, c"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Trace the second goto, ours, 20 repetitions
        env:
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -u scripts/hunt_second_goto_vs_stock.py --trace --browser invisible --binary "$FF" --repetitions 20 --out-dir "$RUNNER_TEMP/second-goto-trace"
      - name: Close every Firefox left
        if: always()
        run: |
          pkill -f firefox || true
          echo "left: $(pgrep -fc firefox || true)"
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-goto-trace-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-goto-trace/*.json
          if-no-files-found: warn
          retention-days: 14

  second-goto-trace-windows:
    name: second-goto-trace (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install --no-deps --force-reinstall "git+https://github.com/oss-invisible/core@65307f59f1245e214c8357593950d5ec929536ac"
          python -c "import invisible_core; from invisible_core.testing import e2e; c = e2e.command('4', [], junit='x.xml'); print('core', invisible_core.__version__, c); assert not any(a.startswith('--rerun') for a in c) and 'no:rerunfailures' in c, c"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Trace the second goto, ours, 20 repetitions
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/hunt_second_goto_vs_stock.py --trace --browser invisible --binary "$FF" --repetitions 20 --out-dir "$RUNNER_TEMP/second-goto-trace"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: second-goto-trace-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/second-goto-trace/*.json
          if-no-files-found: warn
          retention-days: 14
