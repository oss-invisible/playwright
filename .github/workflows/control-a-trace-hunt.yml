# ─────────────────────────────────────────────────────────────────────────────
# control-a-trace-hunt.yml - a MEASUREMENT, not a gate: the Control+A file of the
# e2e (tests/test_control_a_selects_all_in_a_field_e2e.py, 20 tests: 5 ways to press
# the shortcut x 2 fields x the in-process browser and the stock client), run again
# and again with the protocol trace of scripts/hunt_trace_plugin.py, to find the cause
# of a rare red: `Page.set_content: the caller's world never appeared for frame
# mainframe-N - did you call install()? Worlds seen: ['']`.
#
# What it records, per test run, in one JSON: the events the engine sends about
# navigations, frames and contexts (executionContextsCleared / Created / Destroyed with
# the world), the commands the server sends (Page.setInitScripts, which is what
# declares the caller's world; Runtime.evaluate with its context), and the marks of
# install(), caller_context() and set_content, all with their time. scripts/
# hunt_ctrla_summary.py then puts the red runs and the green ones side by side.
#
# ROUNDS OF FOUR COPIES, not `-n 4`: four pytest processes at once, each on the whole
# file (what a `--dist loadfile` worker of the gate does), so that every browser lives
# the same 10 tests per mode, in the same order, as in the gate and four browsers are
# up together (scripts/hunt_ctrla_rounds.py says why). Rounds follow until 300 test
# runs per system are recorded (4 rounds = 320). A red copy never stops the others,
# and the verdict of the job is only that the files are there.
#
# It runs on a push to its own branch only.
# ─────────────────────────────────────────────────────────────────────────────
name: control-a-trace-hunt

on:
  push:
    branches: [hunt/control-a-trace]

permissions:
  contents: read

# A hunt has a group of its own, unique to the run: a newer push never cancels
# a measurement that is half done (tests/test_ci_runs_once_per_commit.py).
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  # the core of main, not the pinned one: the pair is mismatched on purpose (as the core's wrapper-on-this-core job does)
  INVISIBLE_CORE_PIN: allow
  INVISIBLE_CORE_AUTOFIX: "off"

jobs:
  control-a-trace-linux:
    name: control-a-trace (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install --no-deps --force-reinstall "git+https://github.com/oss-invisible/core@65307f59f1245e214c8357593950d5ec929536ac"
          python -c "import invisible_core; from invisible_core.testing import e2e; c = e2e.command('4', [], junit='x.xml'); print('core', invisible_core.__version__, c); assert not any(a.startswith('--rerun') for a in c) and 'no:rerunfailures' in c, c"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: The Control+A file in rounds of four copies, with the protocol trace
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -u scripts/hunt_ctrla_rounds.py --binary "$FF" --out-dir "$RUNNER_TEMP/ctrla-hunt" --min-runs 300 --copies 4 --budget-min 18
      - name: Close every Firefox left
        if: always()
        run: |
          pkill -f firefox || true
          echo "left: $(pgrep -fc firefox || true)"
      - name: The summary of the red and the green runs
        if: always()
        run: python scripts/hunt_ctrla_summary.py "$RUNNER_TEMP/ctrla-hunt/trace" --max-reds 30 | tee "$RUNNER_TEMP/ctrla-hunt/summary.txt" || true
      - name: Upload the traces, the junit and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-a-trace-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctrla-hunt
          if-no-files-found: warn
          retention-days: 14
      # The verdict is only that the files are there: a red test is what the hunt is for.
      - name: Verdict (the files are there)
        if: always()
        run: |
          traces=$(ls "$RUNNER_TEMP/ctrla-hunt/trace"/*.json 2>/dev/null | wc -l)
          junits=$(ls "$RUNNER_TEMP/ctrla-hunt/junit"/*.xml 2>/dev/null | wc -l)
          echo "trace files: $traces, junit files: $junits"
          if [ "$traces" -lt 300 ]; then echo "::warning::only $traces test runs were recorded (300 were wanted)"; fi
          [ "$traces" -gt 0 ] && [ "$junits" -gt 0 ]

  control-a-trace-windows:
    name: control-a-trace (windows)
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install --no-deps --force-reinstall "git+https://github.com/oss-invisible/core@65307f59f1245e214c8357593950d5ec929536ac"
          python -c "import invisible_core; from invisible_core.testing import e2e; c = e2e.command('4', [], junit='x.xml'); print('core', invisible_core.__version__, c); assert not any(a.startswith('--rerun') for a in c) and 'no:rerunfailures' in c, c"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: The Control+A file in rounds of four copies, with the protocol trace
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/hunt_ctrla_rounds.py --binary "$FF" --out-dir "$RUNNER_TEMP/ctrla-hunt" --min-runs 300 --copies 4 --budget-min 18
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: The summary of the red and the green runs
        if: always()
        run: python scripts/hunt_ctrla_summary.py "$RUNNER_TEMP/ctrla-hunt/trace" --max-reds 30 | tee "$RUNNER_TEMP/ctrla-hunt/summary.txt" || true
      - name: Upload the traces, the junit and the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-a-trace-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ctrla-hunt
          if-no-files-found: warn
          retention-days: 14
      # The verdict is only that the files are there: a red test is what the hunt is for.
      - name: Verdict (the files are there)
        if: always()
        run: |
          traces=$(ls "$RUNNER_TEMP/ctrla-hunt/trace"/*.json 2>/dev/null | wc -l)
          junits=$(ls "$RUNNER_TEMP/ctrla-hunt/junit"/*.xml 2>/dev/null | wc -l)
          echo "trace files: $traces, junit files: $junits"
          if [ "$traces" -lt 300 ]; then echo "::warning::only $traces test runs were recorded (300 were wanted)"; fi
          [ "$traces" -gt 0 ] && [ "$junits" -gt 0 ]
