name: ocsp native hunt
on:
  push:
    branches: [hunt/ocsp-native-after-eof]
    paths: [tests/_lab_pki.py, .github/workflows/ocsp-native-hunt.yml]
env:
  GITHUB_TOKEN: ${{ github.token }}
concurrency:
  group: ocsp-native-hunt
  cancel-in-progress: true
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-2022, ubuntu-24.04]
        drop: [none, alternate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb iproute2
          sudo "$(which python)" -m playwright install-deps firefox
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database
        run: python scripts/ci_lab_geoip.py build
      - name: 30 runs of the OCSP case by name, the TLS server dropping ${{ matrix.drop }}
        env:
          HUNT_TLS_DROP: ${{ matrix.drop }}
          MOZ_CRASHREPORTER_DISABLE: "1"
        run: |
          set +e +o pipefail
          NODE='tests/test_nothing_of_a_context_leaves_but_through_its_proxy_e2e.py::test_the_ocsp_request_of_a_trusted_page_leaves_only_through_the_proxy[name]'
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo rm -rf /opt/ff && sudo cp -a "$(dirname "$FF")" /opt/ff && sudo chown -R root:root /opt/ff && sudo chmod -R go+rX /opt/ff
            RUN="sudo -H -E env -u PYTEST_ADDOPTS -u XDG_RUNTIME_DIR INVPW_REQUIRE_TRAP=1 PATH=$PATH INVPW_BINARY_PATH=/opt/ff/$(basename "$FF") HUNT_TLS_DROP=$HUNT_TLS_DROP"
          else
            RUN="env INVPW_BINARY_PATH=$FF"
          fi
          for i in $(seq 1 30); do
            out=$($RUN python -m pytest "$NODE" -m e2e -o addopts='' -q -p no:cacheprovider -p no:rerunfailures 2>&1 || true)
            if echo "$out" | grep -q " 1 passed"; then verdict=pass; else verdict=FAIL; fi
            hs=$(echo "$out" | grep -o "handshakes \[[^]]*\]" | head -1)
            why=$(echo "$out" | grep -oE "AssertionError: [^(]{0,160}" | head -1)
            echo "HUNTROW os=$RUNNER_OS drop=$HUNT_TLS_DROP rep=$i verdict=$verdict $hs $why"
          done
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo pkill -9 -f firefox || true; else taskkill //F //IM firefox.exe //T 2>/dev/null || true; fi
          echo done
