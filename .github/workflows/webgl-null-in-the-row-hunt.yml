# -----------------------------------------------------------------------------
# webgl-null-in-the-row-hunt.yml - TEMPORARY. Deleted, with its branch, when the question is answered. Never merged to main.
#
# The question. On Linux, in about 1 run of the e2e suite in 60 (wrapper main runs 45902724988 and 45637350633, candidate 45206303882), the page's WebGL context is null in
# tests/test_canvas_reads_as_drawn.py::test_a_non_premultiplied_webgl_canvas_reads_the_same_through_todataurl_and_toblob, on the ENGINE-OFF launch (`_non_premultiplied(.., 0)`,
# hw_seed 0), after the engine-on launch (hw_seed 12345) of the same test. Isolated hunts (0 nulls in 4071 launches, and a background load of the row beside a loop of
# launches) never saw one, so whatever triggers it lives in the real row: the tests running beside it, the shared display server, the memory. Since PR #607 the test
# records, when it fails, the statusMessage of webglcontextcreationerror, a second attempt 2 s later and the engine's gfx2d log of every process (FailureEvidence).
#
# What it runs. The PUBLISHED engine (`python -m invisible_playwright fetch`) and this branch of the wrapper (main with PR #607), in 4 identical jobs (ubuntu-24.04, a budget of
# 75 minutes each). In each, in a loop until the budget, the REAL row `wrapper.e2e.suite.linux.2` exactly as the Linux e2e job of e2e.yml runs it (scripts/run_e2e.py, 4 browsers,
# --dist loadfile, the same options and environment, under xvfb-run), PLUS four hunt files on the same pytest command line (tests/hunt_webgl_null_in_the_row_{1..4}_e2e.py, 15 cases
# each, 60 per iteration). Each case is the real test itself (tests/_hunt_webgl_null.py calls it as a function: engine on, then engine off, its own assertions and its own
# FailureEvidence, nothing copied). The four files are put in among the files of the row (scripts/hunt_webgl_null.py args), so that under `--dist loadfile` each worker gets
# one while the other workers are inside the row.
#
# What it records, at EVERY launch of that test (engine on and off, hunt cases and the row's own copy of the test), cheaply, in launches-<pid>.jsonl: the GL libraries the engine's
# parent maps (own = the engine's folder, host = elsewhere), its open descriptors and threads, the clients of its X display (xlsclients, and the descriptors of the Xvfb that
# serves it), how many Xvfb and engine processes the machine holds, the load and the free memory. And, by a plugin (tests/_hunt_timeline.py, passed with -p), when every test of
# every worker started and ended, so that a null lists the tests the other workers ran in that minute. A null adds what #607 records and what the page heard.
#
# How to read it: the summary of each job ($GITHUB_STEP_SUMMARY and summary.md in the artifact `webgl-null-row-<shard>-<run id>`): row iterations, hunt cases run, nulls (engine
# off / engine on), the engine-off passes' ranges of each recorded number, and for every null its statusMessage, the second attempt, the gfx2d lines, the GL libraries, the X
# clients, the descriptors and the overlapping tests. A job is red when any launch had a null context (or a hunt case failed for another reason).
#
# Triggered ONLY by a push to `hunt/webgl-null-in-the-row`: no schedule, no dispatch, no pull request. A newer push replaces the run it supersedes.
# -----------------------------------------------------------------------------
name: webgl null in the row hunt

on:
  push:
    branches: [hunt/webgl-null-in-the-row]

permissions:
  contents: read

concurrency:
  group: webgl-null-in-the-row-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token (as every workflow that runs tests).
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # THE UBUNTU PACKAGES, from Ubuntu's archive once per runner image and list (linux-deps.yml), never by a job: the list of the Linux jobs of e2e.yml (xvfb with xauth, strace, gdb and
  # elfutils, and what Playwright's install-deps names for Firefox) and x11-utils for xlsclients (the clients of the X display at each launch).
  linux-deps-webgl-null-row:
    name: linux-deps-webgl-null-row
    uses: ./.github/workflows/linux-deps.yml
    with:
      name: webgl-null-row
      packages: xvfb strace gdb elfutils x11-utils
      playwright_wrapper_ref: ${{ github.sha }}

  hunt:
    name: shard ${{ matrix.shard }}
    needs: linux-deps-webgl-null-row
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: The Linux packages (the run's linux-deps-webgl-null-row job, no mirror)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-webgl-null-row.outputs.artifact }}
          path: /tmp/linux-deps
      - name: System deps (xvfb, strace, gdb, elfutils, x11-utils + Firefox runtime libs; the repository of the linux-deps-webgl-null-row job)
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
          # a core file of any crash where kernel.core_pattern says (tests/conftest.py lifts the core limit of the pytest session), as the e2e job
          mkdir -p "$RUNNER_TEMP/invpw-cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/invpw-cores/core.%e.%p"
          echo "INVPW_CORE_DIR=$RUNNER_TEMP/invpw-cores" >> "$GITHUB_ENV"
      # The security state is a ready directory of the repository (ci/security-state/, a result with no data, the sha256 in ci/security-state.pin.json): with
      # STEALTHFOX_SECURITY_STATE set the core neither downloads nor generates one. BEFORE `fetch`, which makes the state present (it would download and generate it).
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      # The GeoIP database is made by the repository (scripts/ci_lab_geoip.py: the same bytes on every run, the sha256 in ci/geoip.json), never a site and never a licensed file.
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build
      # The files of the row, as the Linux e2e job reads them, with the four hunt files put in among them.
      - name: The files of the row wrapper.e2e.suite.linux.2, with the four hunt files among them
        run: |
          python scripts/ci_verdict.py args --required ci/required-suites.json --suite "wrapper.e2e.suite.linux.2" --os linux | tr -d '\r' > "$RUNNER_TEMP/row_args.txt"
          python scripts/hunt_webgl_null.py args < "$RUNNER_TEMP/row_args.txt" > "$RUNNER_TEMP/e2e_args.txt"
          echo "$(wc -l < "$RUNNER_TEMP/row_args.txt") files in the row, $(wc -l < "$RUNNER_TEMP/e2e_args.txt") with the hunt files"
          cat "$RUNNER_TEMP/e2e_args.txt"
      - name: The row with the hunt cases, in a loop until the budget, with the record of every launch and the timeline of every test
        env:
          PYTHONUNBUFFERED: "1"
          # The watchdog of tests/conftest.py, as in the e2e job.
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
          # No iteration of the row STARTS after this many seconds of the loop; one in progress is cut at this plus 300 s (setup comes before, the ceiling of the job is 100 minutes).
          HUNT_BUDGET_S: "4500"
          HUNT_SHARD: ${{ matrix.shard }}
        run: |
          # A step of a hunt that breaks must never end green: any error stops it, and the trap below turns a stop before its end into a red step.
          set -euo pipefail
          finished=0
          hunt="$RUNNER_TEMP/webgl-null-row"
          mkdir -p "$hunt"
          cleanup() {
            pkill -9 -f "$(dirname "$FF")/" > /dev/null 2>&1 || true
            pkill -9 -x firefox > /dev/null 2>&1 || true
            pkill -9 -x firefox-bin > /dev/null 2>&1 || true
            pkill -9 Xvfb > /dev/null 2>&1 || true
          }
          trap 'cleanup; if [ "$finished" != 1 ]; then echo "::error::the hunt step stopped before its end"; exit 1; fi' EXIT
          if [ -z "${FF:-}" ] || [ ! -e "$FF" ]; then echo "::error::no engine binary (FF='${FF:-}')"; exit 1; fi
          export HUNT_DIR="$hunt"
          # The plugin and the helper of the hunt are in tests/; -p reads them before pytest puts the folder on the path.
          export PYTHONPATH="$PWD/tests${PYTHONPATH:+:$PYTHONPATH}"
          mapfile -t ARGS < <(tr -d '\r' < "$RUNNER_TEMP/e2e_args.txt")
          start=$SECONDS
          n=0
          while [ $((SECONDS - start)) -lt "$HUNT_BUDGET_S" ]; do
            n=$((n + 1))
            t0=$SECONDS
            left=$((HUNT_BUDGET_S + 300 - (t0 - start)))
            export HUNT_ITERATION="$n" INVPW_E2E_JUNIT_DIR="$hunt/junit-$n"
            mkdir -p "$INVPW_E2E_JUNIT_DIR"
            echo "::group::iteration $n (at most ${left}s)"
            # THE JOB'S OWN COMMAND (scripts/run_e2e.py: -n 4, --dist loadfile, the deadline, no rerun, a junit per pass), with the files of the row and the hunt files, and the
            # timeline plugin as one more pytest argument (it goes to both passes). `timeout` ends the whole group if the iteration outlives its time.
            code=0
            timeout -k 30 "$left" xvfb-run -a python -u scripts/run_e2e.py "$FF" "${ARGS[@]}" -p _hunt_timeline || code=$?
            echo "::endgroup::"
            printf '%s\t%s\t%s\n' "$n" "$code" "$((SECONDS - t0))" >> "$hunt/iterations.tsv"
            echo "iteration $n: pytest exit $code in $((SECONDS - t0)) s"
            # What the iteration left (browsers of a cut run, virtual displays) never reaches the next one.
            cleanup
            sleep 3
          done
          cp "$RUNNER_TEMP/e2e_args.txt" "$hunt/e2e_args.txt" || true
          cp "$RUNNER_TEMP/e2e-watchdog.log" "$hunt/e2e-watchdog.log" 2>/dev/null || true
          finished=1
      # The verdict is the summary's: red when any launch had a null context (the exit of the row's own tests decides nothing here).
      - name: Summary of the job (iterations, cases, nulls with everything recorded), red when any null happened
        if: always()
        env:
          HUNT_SHARD: ${{ matrix.shard }}
        run: |
          export HUNT_DIR="$RUNNER_TEMP/webgl-null-row"
          mkdir -p "$HUNT_DIR"
          python scripts/hunt_webgl_null.py summary --dir "$HUNT_DIR" --shard "$HUNT_SHARD"
      - name: Close every Firefox left
        if: always()
        run: |
          pkill -9 -x firefox > /dev/null 2>&1 || true
          pkill -9 -x firefox-bin > /dev/null 2>&1 || true
          pkill -9 Xvfb > /dev/null 2>&1 || true
          echo "left: $(pgrep -c -x 'firefox|firefox-bin' || true)"
      # Everything: the launches, the timeline, the junit of every iteration, the summary, and what the tests kept when they failed (invpw-evidence: the page's statusMessage, the second
      # attempt and the engine's gfx2d logs of the real test).
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webgl-null-row-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/webgl-null-row
            ${{ runner.temp }}/invpw-evidence
          if-no-files-found: warn
          retention-days: 30
