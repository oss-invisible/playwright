# HUNT ONLY, never merged. The shutdown-ping sender (`firefox --backgroundtask pingsender ...`) and the machine's resolver, in the wrapper's OWN
# e2e lab, the WHOLE suite wrapper.e2e.context.egress as the candidate's gate runs it on Linux (job gate / wrapper.e2e.context.egress: one
# pytest process, the files and the marker the judge lists in ci/required-suites.json, root through `sudo -H -E env -u PYTEST_ADDOPTS -u
# XDG_RUNTIME_DIR INVPW_REQUIRE_TRAP=1`, the resolver trap and the gateway fixtures of tests/_leaks.py and tests/_doh_servers.py, the GeoIP
# database of scripts/ci_lab_geoip.py, the engine copied to /opt where root can run it, the seal of the binary), untouched, 5 runs per arm.
# Hypothesis: CROSS-TEST CONTAMINATION. A sender of a context_only test (no launch proxy: native telemetry lookups are allowed there) outlives
# its test and resolves incoming.telemetry.mozilla.org while the NEXT test (launch_and_context, the trap counting) runs: the next test is
# charged. Proved or refuted per native query: which sender (pid, birth, death), which kind of session (the stealth contexts of its prefs.js),
# which test its session belongs to (the test running when its profile was born) and which test was running when it asked.
# Arms (a job each): cand = wrapper release/0.53.0 (its tests), core 74018f83, the engine of the candidate 43785139398, sealed as the gate
# seals it; pub = the wrapper tag v0.52.1 (its tests), the published invisible-playwright 0.52.1 + invisible-core 64.73.0 on the engine they fetch.
# Probes around the tests, none of them in the tests: MOZ_LOG=sync,timestamp,nsHostResolver:5,TRR:5 and MOZ_LOG_FILE=<dir>/ff-%PID.log put
# explicitly after `sudo env` (the engine and the sender inherit them; the watcher checks the sender's environment and the files); a root
# watcher (scripts/hunt_pingsender_dns.py) that polls every 20 ms for a pingsender process and at first sight copies its profile's prefs.js,
# reads its route and environment and follows its end; the tests' own start and end instants from a pytest plugin (scripts/hunt_testtimes.py,
# `-p`, no test touched).
# Attribution of EVERY native DNS query from the network side (root): bpftrace on udp_sendmsg/udpv6_sendmsg (instant, pid, tid, thread name,
# local port of each datagram to port 53; fallback `ss -u -a -p` polling when it cannot attach), tcpdump (name asked, local port), joined on the
# local port and the time; the watcher snapshots every process of the engine (type, parents, profile, birth, end), every profile (prefs, birth,
# removal) and a wall-clock/monotonic anchor. "The table" prints one HUNTQ line per query (who, which session and test, with or without a launch
# proxy, when against the close of the session and the birth and end of its sender) and a HUNTQSUM per arm.
name: pingsender dns hunt
on:
  push:
    branches: [hunt/published-latency]
    paths: [.github/workflows/pingsender-dns-hunt.yml, scripts/hunt_pingsender_dns.py, scripts/hunt_testtimes.py]
permissions:
  contents: read
  actions: read
concurrency:
  group: pingsender-dns-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [cand, pub]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      RUNS: "5"
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - name: Checkout the wrapper of the candidate arm (release/0.53.0, its tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: release/0.53.0
          path: wcand
          fetch-depth: 1
      - name: Checkout the wrapper of the published arm (tag v0.52.1, its tests)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: oss-invisible/playwright
          ref: v0.52.1
          path: wpub
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      # The GeoIP database is made by the repository (the same bytes every run), as the gate does: without it the core asks GitHub on every call.
      - name: The GeoIP database (made by the repository)
        working-directory: wcand
        run: python scripts/ci_lab_geoip.py build --pin ci/geoip.json
      - name: Linux system deps (Firefox runtime libs, a virtual display), psutil for the watcher
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --quiet psutil "playwright==$(cat wcand/scripts/playwright_pin.txt)"
          sudo "$(which python)" -m playwright install-deps firefox
      - name: bpftrace and tcpdump (the network side of the attribution)
        continue-on-error: true
        run: sudo apt-get install -y bpftrace tcpdump
      - name: The venv of the arm (cand - core 74018f83 from git and the wrapper of release/0.53.0 with its dev extra; pub - the published packages)
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          python -m venv "$RUNNER_TEMP/venv"
          V="$RUNNER_TEMP/venv/bin/python"
          "$V" -m pip install --quiet --upgrade pip
          if [ "$ARM" = cand ]; then
            CORE_GIT="git+https://github.com/oss-invisible/core@74018f83c0b59fdaeff9e494426529331f8f7e60"
            "$V" -m pip install --quiet "$CORE_GIT"
            (cd wcand && "$V" -m pip install --quiet ".[dev]")
            "$V" -m pip install --quiet --force-reinstall "$CORE_GIT"
          else
            "$V" -m pip install --quiet "invisible-playwright[dev]==0.52.1"
          fi
          "$V" -c "
          import importlib.metadata as m, json
          for n in ('invisible-core', 'invisible-playwright'):
              d = m.distribution(n); u = json.loads(d.read_text('direct_url.json') or '{}')
              print(n, d.version, u.get('vcs_info', {}).get('commit_id') or 'the index')
          "
          echo "PY=$V" >> "$GITHUB_ENV"
      # The engine goes where root can run it (a path of root's that everyone can read), as the gate does for its root legs.
      - name: The engine of the arm (cand - the candidate 43785139398, sealed as the gate seals it; pub - the one the published packages fetch)
        run: |
          export INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow
          sudo rm -rf /opt/ff
          if [ "$ARM" = cand ]; then
            mkdir -p "$RUNNER_TEMP/eng" && cd "$RUNNER_TEMP/eng"
            gh run download 43785139398 -R oss-invisible/firefox_antidetect_patch -n asset-linux-x86_64 -D .
            mkdir ff && tar -xzf ./*.tar.gz -C ff
            FF="$(find "$PWD/ff" -maxdepth 2 -type f -name firefox | head -1)"
            sudo cp -a "$(dirname "$FF")" /opt/ff
            BIN=/opt/ff/firefox
          else
            SRC="$(cd "$RUNNER_TEMP" && "$PY" -m invisible_playwright fetch | tail -1)"
            sudo cp -a "$(dirname "$SRC")" /opt/ff
            BIN="/opt/ff/$(basename "$SRC")"
          fi
          sudo chown -R root:root /opt/ff
          sudo chmod -R go+rX /opt/ff
          ls -l "$BIN"; sha256sum "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          if [ "$ARM" = cand ]; then "$PY" -m invisible_core seal --binary "$BIN" --tag firefox-65-candidate -o "$RUNNER_TEMP/gate.seal.json"; fi
      - name: The watcher (root, the whole job) and the runs of the whole suite
        continue-on-error: true
        timeout-minutes: 100
        run: |
          set +e
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT/junit" "$OUT/moz" "$OUT/pytest" "$OUT/times"; chmod -R 777 "$OUT"
          : > "$OUT/watch.jsonl"; : > "$OUT/runs.jsonl"
          # The network side (root): which process owns the socket that sends each DNS query. bpftrace on udp_sendmsg / udpv6_sendmsg gives, for every
          # datagram to port 53, the instant (CLOCK_MONOTONIC ns; the watcher writes anchors that turn it into wall clock), pid (thread group), tid, thread
          # name and the local port; tcpdump gives the name asked and the local port. The join is in "The table".
          DNS="$OUT/dns"; mkdir -p "$DNS"; chmod 777 "$DNS"
          cat > "$DNS/q.bt" <<'BT'
          BEGIN { printf("B %llu start\n", nsecs); }
          kprobe:udp_sendmsg, kprobe:udpv6_sendmsg
          {
            @sk[tid] = arg0;
            @mh[tid] = arg1;
            @t0[tid] = nsecs;
          }
          kretprobe:udp_sendmsg, kretprobe:udpv6_sendmsg
          /@sk[tid] != 0/
          {
            $sk = (struct sock *)@sk[tid];
            $m = (struct msghdr *)@mh[tid];
            $dp = $sk->__sk_common.skc_dport;
            $nm = (struct sockaddr_in *)$m->msg_name;
            if ($nm != 0) { $dp = $nm->sin_port; }
            if ($dp == 0x3500) {
              printf("Q %llu %d %d %s %d 53\n", @t0[tid], pid, tid, comm, $sk->__sk_common.skc_num);
            }
            delete(@sk[tid]); delete(@mh[tid]); delete(@t0[tid]);
          }
          END { clear(@sk); clear(@mh); clear(@t0); }
          BT
          cat > "$DNS/q-simple.bt" <<'BT'
          BEGIN { printf("B %llu start\n", nsecs); }
          kprobe:udp_sendmsg, kprobe:udpv6_sendmsg
          {
            $sk = (struct sock *)arg0;
            $m = (struct msghdr *)arg1;
            $dp = $sk->__sk_common.skc_dport;
            $nm = (struct sockaddr_in *)$m->msg_name;
            if ($nm != 0) { $dp = $nm->sin_port; }
            if ($dp == 0x3500) {
              printf("Q %llu %d %d %s %d 53\n", nsecs, pid, tid, comm, $sk->__sk_common.skc_num);
            }
          }
          BT
          cat > "$DNS/x.bt" <<'BT'
          BEGIN { printf("B %llu start\n", nsecs); }
          tracepoint:syscalls:sys_enter_execve
          {
            printf("X %llu %d %d ", nsecs, pid, ((struct task_struct *)curtask)->real_parent->tgid);
            join(args->argv);
          }
          BT
          { uname -r; ls -l /sys/kernel/btf/vmlinux; sudo bpftrace --version; tcpdump --version 2>&1 | head -1; } > "$DNS/info.txt" 2>&1; cat "$DNS/info.txt"
          BPF_OK=0; : > "$DNS/status.txt"
          for variant in "q.bt:-B line" "q.bt:" "q-simple.bt:-B line" "q-simple.bt:"; do
            f="${variant%%:*}"; opt="${variant#*:}"
            if [ -n "$opt" ]; then
              sudo bpftrace $opt "$DNS/$f" > "$DNS/bpf-q.log" 2> "$DNS/bpf-q.err" &
            else
              sudo stdbuf -oL bpftrace "$DNS/$f" > "$DNS/bpf-q.log" 2> "$DNS/bpf-q.err" &
            fi
            BPFPID=$!
            for _ in $(seq 1 75); do
              grep -q '^B ' "$DNS/bpf-q.log" 2>/dev/null && break
              sudo kill -0 "$BPFPID" 2>/dev/null || break
              sleep 0.2
            done
            if grep -q '^B ' "$DNS/bpf-q.log" 2>/dev/null; then BPF_OK=1; echo "bpf=attached script=$f opt='$opt'" >> "$DNS/status.txt"; break; fi
            echo "bpf=not attached script=$f opt='$opt': $(head -c 300 "$DNS/bpf-q.err" | tr '\n' ' ')" >> "$DNS/status.txt"
            sudo pkill -INT -x bpftrace; sleep 1
          done
          sudo bpftrace -B line "$DNS/x.bt" > "$DNS/bpf-x.log" 2> "$DNS/bpf-x.err" &
          sleep 1
          if grep -q '^B ' "$DNS/bpf-x.log" 2>/dev/null; then echo "exec trace=attached" >> "$DNS/status.txt"; else echo "exec trace=not attached: $(head -c 200 "$DNS/bpf-x.err" | tr '\n' ' ')" >> "$DNS/status.txt"; fi
          sudo tcpdump -Z root -i any -n -tt -l -s 200 'udp port 53' > "$DNS/tcpdump.txt" 2> "$DNS/tcpdump.err" &
          sudo tcpdump -Z root -i any -n -s 200 -U -w "$DNS/dns.pcap" 'port 53' 2> "$DNS/tcpdump-pcap.err" &
          for _ in $(seq 1 25); do grep -q listening "$DNS/tcpdump.err" 2>/dev/null && break; sleep 0.2; done
          if grep -q listening "$DNS/tcpdump.err" 2>/dev/null; then echo "tcpdump=listening" >> "$DNS/status.txt"; else echo "tcpdump=not listening: $(head -c 200 "$DNS/tcpdump.err" | tr '\n' ' ')" >> "$DNS/status.txt"; fi
          if [ "$BPF_OK" != 1 ]; then
            echo "FALLBACK: bpftrace did not attach; the owner of each socket comes from ss -u -a -p polling" >> "$DNS/status.txt"
            sudo "$(which python)" scripts/hunt_pingsender_dns.py sockpoll "$DNS/ss.jsonl" > "$DNS/ss.out" 2>&1 &
          fi
          cat "$DNS/status.txt"
          sudo "$(which python)" scripts/hunt_pingsender_dns.py watch "$OUT/watch.jsonl" "$OUT/prefs" > "$OUT/watch.out" 2>&1 &
          sleep 2; cat "$OUT/watch.out"
          (ss -lntup 2>/dev/null || netstat -lntup 2>/dev/null) || echo "no ss or netstat on this runner"
          if [ "$ARM" = cand ]; then WDIR=wcand; else WDIR=wpub; fi
          # The files and the marker of the suite, from the judge of the checkout, as the gate asks it (--with-marker).
          ( cd "$WDIR" && python scripts/ci_verdict.py args --required ci/required-suites.json --suite wrapper.e2e.context.egress --os linux --with-marker ) | tr -d '\r' > "$OUT/args.txt"
          cat "$OUT/args.txt"; mapfile -t SELECT < "$OUT/args.txt"
          # One pytest process, the gate's command for this suite: the same options, root through sudo -H -E, the environment of the gate; the
          # hunt adds MOZ_LOG and MOZ_LOG_FILE (explicit after `sudo env`, so sudo cannot drop them), a plugin that times the tests, and a timeout.
          one_run() {
            local i="$1" py bin logd junit times rc t0 t1 nlog
            logd="$OUT/moz/$ARM-$i"; mkdir -p "$logd"; chmod 777 "$logd"
            junit="$OUT/junit/$ARM-$i.xml"; times="$OUT/times/$ARM-$i.jsonl"; : > "$times"; chmod 666 "$times"
            ENVV=(INVPW_REQUIRE_TRAP=1 "PATH=$PATH" PYTHONUNBUFFERED=1 "PYTHONPATH=$GITHUB_WORKSPACE/scripts" "HUNT_TESTTIMES=$times"
                  "INVPW_BINARY_PATH=$BIN" "STEALTHFOX_E2E_BINARY=$BIN"
                  "MOZ_LOG=sync,timestamp,nsHostResolver:5,TRR:5" "MOZ_LOG_FILE=$logd/ff-%PID.log")
            if [ "$ARM" = cand ]; then ENVV+=(INVISIBLE_CORE_AUTOFIX=off INVISIBLE_CORE_PIN=allow "INVISIBLE_SEAL_FILE=$RUNNER_TEMP/gate.seal.json"); fi
            t0=$(date +%s%3N)
            ( cd "$WDIR" && sudo -H -E env -u PYTEST_ADDOPTS -u XDG_RUNTIME_DIR "${ENVV[@]}" timeout 1500 "$PY" -m pytest "${SELECT[@]}" \
                -o addopts='' -o junit_family=xunit2 -q -p no:cacheprovider -p no:rerunfailures -p hunt_testtimes -rs --junitxml="$junit" ) > "$OUT/pytest/$ARM-$i.txt" 2>&1
            rc=$?
            t1=$(date +%s%3N)
            nlog=$(ls "$logd" | wc -l)
            printf '{"arm":"%s","i":%d,"t0":%s,"t1":%s,"rc":%d,"junit":"%s","logd":"%s","times":"%s","moz_files":%d}\n' "$ARM" "$i" "$t0" "$t1" "$rc" "$junit" "$logd" "$times" "$nlog" >> "$OUT/runs.jsonl"
            echo "== $ARM run $i rc=$rc ($(( (t1 - t0) / 1000 )) s), MOZ_LOG files $nlog"; tail -n 8 "$OUT/pytest/$ARM-$i.txt" | cut -c1-300
            sudo pkill -9 -f "/opt/ff" > /dev/null 2>&1
          }
          for i in $(seq 0 $((RUNS-1))); do
            if [ "$SECONDS" -gt 5400 ]; then echo "time guard: no new run after $SECONDS s"; break; fi
            one_run "$i"
          done
          sudo pkill -INT -x bpftrace > /dev/null 2>&1
          sudo pkill -INT -x tcpdump > /dev/null 2>&1
          sudo pkill -f "hunt_pingsender_dns.py sockpoll" > /dev/null 2>&1
          sleep 2
          sudo pkill -TERM -f "hunt_pingsender_dns.py watch" > /dev/null 2>&1
          sleep 1
          true
      - name: Safety (resolv.conf, firefox left)
        if: always()
        run: |
          ls -l /etc/resolv.conf; head -5 /etc/resolv.conf
          sudo pkill -9 -f "/opt/ff" > /dev/null 2>&1 || true
          echo done
      - name: The table
        if: always()
        run: |
          python - "$RUNNER_TEMP/out" <<'PY'
          import calendar, collections, glob, json, os, re, sys, xml.etree.ElementTree as ET
          out = sys.argv[1]
          TEL = "incoming.telemetry.mozilla.org"
          def jl(p):
              return [json.loads(l) for l in open(p, encoding="utf-8") if l.strip()] if os.path.exists(p) else []
          runs, watch = jl(out + "/runs.jsonl"), jl(out + "/watch.jsonl")
          seen = [w for w in watch if w["event"] == "seen"]
          ends = {w["pid"]: w for w in watch if w["event"] == "end"}
          def q(v, p):
              v = sorted(x for x in v if x is not None)
              return v[min(len(v) - 1, int(p * len(v)))] if v else None
          def cnt(v):
              return dict(collections.Counter(str(x) for x in v).most_common(8))
          QRE = re.compile(r"([A-Za-z0-9_.\-]+)/(\d+) \((\w+)\)")
          TSRE = re.compile(r"^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\.(\d+)")
          def log_time(line):
              m = TSRE.match(line)
              return calendar.timegm(__import__("time").strptime(m.group(1), "%Y-%m-%d %H:%M:%S")) * 1000 + int(m.group(2)[:3].ljust(3, "0")) if m else None
          def short(n):
              return n.split("::", 1)[-1][:70]
          def kind_of(s):
              v = (s.get("prefs") or {}).get("network.trr.stealth.contexts")
              if not s.get("prefs"):
                  return "no prefs copy"
              return "context_only (no launch proxy)" if v in (None, '""', "") else "launch proxy (%s)" % v
          arm_tot = collections.Counter()
          shown = 0
          arm = runs[0]["arm"] if runs else "?"
          senders_all, cross_total, own_total = [], 0, 0
          os.makedirs(out + "/sender-logs", exist_ok=True)
          for run in runs:
              # The tests of this run, with their instants (the plugin) and their outcome.
              T = collections.OrderedDict()
              for e in jl(run["times"]):
                  t = T.setdefault(e["nodeid"], {"start": None, "finish": None, "bad": False})
                  if e["event"] == "start":
                      t["start"] = e["t"]
                  elif e["event"] == "finish":
                      t["finish"] = e["t"]
                  elif e["event"] == "phase" and e["outcome"] == "failed":
                      t["bad"] = True
              order = list(T)
              for k, n in enumerate(order):
                  if T[n]["finish"] is None:
                      T[n]["finish"] = T[order[k + 1]]["start"] if k + 1 < len(order) else run["t1"]
              def test_at(t):
                  for n in order:
                      if T[n]["start"] is not None and T[n]["start"] <= t <= (T[n]["finish"] or 0) + 2:
                          return n
                  return None
              # What the junit says of each failing test, and the native queries the trap counted for it.
              msgs = {}
              try:
                  for tc in ET.parse(run["junit"]).getroot().iter("testcase"):
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          msgs[tc.get("name")] = (f.get("message") or "") + "\n" + (f.text or "")
              except (OSError, ET.ParseError):
                  pass
              def msg_of(nodeid):
                  nm = nodeid.split("::", 1)[-1]
                  return next((m for k, m in msgs.items() if k == nm or nm.endswith(k)), None)
              snd = [s for s in seen if run["t0"] <= s["seen"] <= run["t1"] + 3000]
              rows_here = []
              for s in snd:
                  born_test = test_at(s["born"])
                  owner = test_at(s["profile_oldest_mtime_ms"]) if s.get("profile_oldest_mtime_ms") else None
                  files = glob.glob("%s/ff--*.%d.log*" % (run["logd"], s["pid"]))
                  times, lines = [], []
                  for fn in files:
                      for ln in open(fn, encoding="utf-8", errors="replace"):
                          if TEL in ln:
                              lines.append(ln.rstrip()[:240])
                              tt = log_time(ln)
                              if tt:
                                  times.append(tt)
                  first = min(times) if times else None
                  info = {"pid": s["pid"], "kind": kind_of(s), "born_test": born_test, "owner": owner or born_test, "lookup_t": first, "lookup_test": test_at(first) if first else None,
                          "lookup_lines": len(lines), "sample": lines[:2], "born": s["born"], "end": (ends.get(s["pid"]) or {}).get("lifetime_ms"),
                          "moz_files": len(files), "env_moz_log": bool(s.get("env_moz_log")), "route": (s.get("route") or {}).get("proxy_present"),
                          "crossed": (test_at(s["born"] + (ends.get(s["pid"]) or {}).get("lifetime_ms", 0)) != born_test) if born_test else None}
                  rows_here.append(info)
                  senders_all.append(info)
                  for fn in files:
                      os.system("gzip -c '%s' > '%s/%s-%d-%s.gz'" % (fn, out + "/sender-logs", run["arm"], run["i"], os.path.basename(fn)))
              for n in order:
                  failed = T[n]["bad"]
                  asked = []
                  if failed and msg_of(n):
                      tail = msg_of(n).split("asked the resolver of the machine", 1)[-1]
                      asked = [a for a in QRE.findall(tail)]
                  tel = [a for a in asked if a[0].rstrip(".") == TEL]
                  mine = [r for r in rows_here if r["lookup_test"] == n and r["lookup_lines"]]
                  own = [r for r in mine if r["owner"] == n]
                  other = [r for r in mine if r["owner"] != n]
                  cross_total += len(other)
                  own_total += len(own)
                  if failed or other:
                      shown += 1
                      print("HUNTCROSS %-4s run %d %-70s %s | trap counted native queries %d (telemetry host %d: %s) | MOZ_LOG lookups of the telemetry host while it ran: from its OWN session %d, from a DIFFERENT test's session %d | %s"
                            % (run["arm"], run["i"], short(n), "FAILED" if failed else "passed", len(asked), len(tel), [a[2] for a in tel][:3], len(own), len(other),
                               [(r["pid"], r["kind"], "owner " + short(r["owner"] or "?"), "born in " + short(r["born_test"] or "?"), "sender lived %s ms" % r["end"]) for r in other][:3]))
              arm_tot["runs"] += 1
              arm_tot["tests"] += len(order)
              arm_tot["failed"] += sum(1 for n in order if T[n]["bad"])
              arm_tot["trap_native_tel"] += sum(1 for n in order if T[n]["bad"] and msg_of(n) and TEL in msg_of(n).split("asked the resolver of the machine", 1)[-1])
          ss = senders_all
          print("HUNTCROSSSUM %-4s runs %d, tests %d, failed %d (failures naming the telemetry host in the trap's list: %d) | senders seen %d, by kind %s | senders whose own log names the telemetry host %d | those asked while a test of ANOTHER session ran: %d, while their own session's test ran: %d | senders that outlived their test (died in another test) %d"
                % (arm, arm_tot["runs"], arm_tot["tests"], arm_tot["failed"], arm_tot["trap_native_tel"], len(ss), cnt(r["kind"] for r in ss), sum(1 for r in ss if r["lookup_lines"]),
                   cross_total, own_total, sum(1 for r in ss if r["crossed"])))
          print("HUNTCROSSLOG %-4s MOZ_LOG reached the sender in %d of %d | log files p50 %s | sender lifetime ms p50 %s max %s | route present %d | prefs copy mtime vs birth p50 %s"
                % (arm, sum(1 for r in ss if r["env_moz_log"]), len(ss), q([r["moz_files"] for r in ss], .5), q([r["end"] for r in ss], .5), max((r["end"] or 0 for r in ss), default=None),
                   sum(1 for r in ss if r["route"]), q([s.get("prefs_copy_mtime_vs_birth_ms") for s in seen], .5)))
          for r in [r for r in ss if r["lookup_lines"]][:8]:
              print("HUNTCROSSSENDER %-4s pid %s %s | owner %s | born in %s | asked in %s | log %s" % (arm, r["pid"], r["kind"], short(r["owner"] or "?"), short(r["born_test"] or "?"), short(r["lookup_test"] or "?"), r["sample"]))
          # Every log file of every process, not only the senders': which pids wrote one, and which name the telemetry host, when, in which test.
          sender_pids = {s["pid"] for s in seen}
          for run in runs:
              files = sorted(glob.glob(run["logd"] + "/*"))
              names = [os.path.basename(f) for f in files]
              pid_of = lambda b: int((re.search(r"ff--(?:main|child)\.(\d+)", b) or re.search(r"ff-(\d+)", b)).group(1)) if re.search(r"ff-", b) else None
              print("HUNTALLLOGS %-4s run %d | files %d | names %s | of a seen sender pid %d | sizes p50 %s" % (run["arm"], run["i"], len(files), names[:6], sum(1 for b in names if pid_of(b) in sender_pids),
                    q([os.path.getsize(f) for f in files], .5)))
              for fn in files:
                  hits = []
                  for ln in open(fn, encoding="utf-8", errors="replace"):
                      if TEL in ln:
                          hits.append(ln.rstrip()[:200])
                  if hits:
                      first = log_time(hits[0])
                      print("HUNTALLTEL %-4s run %d %s | %d lines | sender %s | first at %s ms (run t0 %s) | %s" % (run["arm"], run["i"], os.path.basename(fn), len(hits), pid_of(os.path.basename(fn)) in sender_pids,
                            first, run["t0"], hits[:2]))
          # ===== Every native DNS query, attributed from the network side: who sent it, which session, when ============================================
          # The kernel's view: bpftrace on udp_sendmsg/udpv6_sendmsg gives (instant, pid, tid, thread name, local port) of every datagram to port 53,
          # tcpdump gives (instant, local port, name asked); they are joined on the local port and the time. The watcher's records give the process
          # (type, parents, profile), the profile's session (prefs, birth, end), the sender of the session (birth, end). The tests' instants give the test.
          import bisect
          import time as _time
          dns = out + "/dns"
          def text_of(p):
              try:
                  return open(p, encoding="utf-8", errors="replace").read()
              except OSError:
                  return ""
          status = text_of(dns + "/status.txt").strip().replace("\n", "; ") or "no status file"
          anch = sorted((w["mono"], w["wall"]) for w in watch if w["event"] == "anchor")
          anch_m = [a[0] for a in anch]
          def wall_of(mono):
              if not anch:
                  return None
              k = bisect.bisect_left(anch_m, mono)
              k = min(range(max(0, k - 1), min(len(anch), k + 1)), key=lambda j: abs(anch[j][0] - mono))
              return anch[k][1] + (mono - anch[k][0]) / 1e6
          BQ = re.compile(r"^Q (\d+) (\d+) (\d+) (.*) (\d+) (\d+)\s*$")
          BX = re.compile(r"^X (\d+) (\d+) (\d+) (.*)$")
          owners, execs = [], collections.defaultdict(list)
          for ln in text_of(dns + "/bpf-q.log").splitlines():
              m = BQ.match(ln)
              if m and wall_of(int(m.group(1))) is not None:
                  owners.append({"t": wall_of(int(m.group(1))), "pid": int(m.group(2)), "tid": int(m.group(3)), "comm": m.group(4), "sport": int(m.group(5)), "src": "bpf"})
          for ln in text_of(dns + "/bpf-x.log").splitlines():
              m = BX.match(ln)
              if m and wall_of(int(m.group(1))) is not None:
                  execs[int(m.group(2))].append({"t": wall_of(int(m.group(1))), "ppid": int(m.group(3)), "argv": m.group(4)[:200]})
          n_bpf = len(owners)
          for w in jl(dns + "/ss.jsonl"):
              if w.get("event") == "ssq":
                  owners.append({"t": w["t"], "pid": w["pid"], "tid": None, "comm": w["comm"], "sport": w["sport"], "src": "ss"})
          owners.sort(key=lambda o: o["t"])
          by_sport = collections.defaultdict(list)
          for o in owners:
              by_sport[o["sport"]].append(o)
          TD = re.compile(r"^(\d+\.\d+) (\S+)\s+(In|Out)\s+IP6? (\S+)\.(\d+) > (\S+)\.(\d+): (\d+)\S* (?:\[[^\]]*\] )?(\w+)\? (\S+) \((\d+)\)")
          tq, unparsed, tcp_lines = [], [], 0
          for ln in text_of(dns + "/tcpdump.txt").splitlines():
              tcp_lines += 1
              m = TD.match(ln)
              if not m:
                  if "?" in ln:
                      unparsed.append(ln[:160])
                  continue
              if m.group(7) != "53":
                  continue
              tq.append({"t": float(m.group(1)) * 1000, "dir": m.group(3), "sport": int(m.group(5)), "dst": m.group(6), "txid": m.group(8), "qtype": m.group(9), "qname": m.group(10).rstrip(".")})
          # The same datagram appears twice on lo with -i any (Out and In): one query.
          tq.sort(key=lambda x: x["t"])
          uniq = []
          for x in tq:
              if any(y["sport"] == x["sport"] and y["txid"] == x["txid"] and y["qname"] == x["qname"] and y["qtype"] == x["qtype"] and y["dst"] == x["dst"] and abs(y["t"] - x["t"]) < 20 for y in uniq[-12:]):
                  continue
              uniq.append(x)
          used = set()
          rows_q = []
          for x in uniq:
              best = None
              for o in by_sport.get(x["sport"], []):
                  if id(o) in used:
                      continue
                  d = abs(o["t"] - x["t"])
                  if d <= 1500 and (best is None or d < best[0]):
                      best = (d, o)
              if best:
                  used.add(id(best[1]))
              rows_q.append((x, best[1] if best else None, best[0] if best else None))
          for o in owners:
              if id(o) not in used and o["src"] == "bpf":
                  rows_q.append(({"t": o["t"], "sport": o["sport"], "dst": "?", "qtype": "?", "qname": "?(no tcpdump line)", "txid": "?"}, o, None))
          rows_q.sort(key=lambda r: r[0]["t"])
          # The watcher's records: processes (with their updates and ends), profiles (prefs, end), by pid and by profile.
          PR = collections.defaultdict(list)
          cur = {}
          for w in watch:
              ev = w["event"]
              if ev == "proc":
                  r = dict(w, end=None)
                  PR[w["pid"]].append(r)
                  cur[(w["pid"], w["born"])] = r
              elif ev == "pupd" and (w["pid"], w["born"]) in cur:
                  cur[(w["pid"], w["born"])].update(comm=w["comm"], ptype=w["ptype"], head=w["head"], tail=w["tail"])
              elif ev == "pend" and (w["pid"], w["born"]) in cur:
                  cur[(w["pid"], w["born"])]["end"] = w["ended"]
          PF = {}
          for w in watch:
              if w["event"] == "prof":
                  PF.setdefault(w["profile"], {"born": w["born"], "first": w["first"], "prefs": None, "gone": None})["prefs"] = w["prefs"]
              elif w["event"] == "pgone" and w["profile"] in PF:
                  PF[w["profile"]]["gone"] = w["t"]
                  PF[w["profile"]]["gone_seen"] = True
          by_prof = collections.defaultdict(list)
          for pl in PR.values():
              for r in pl:
                  if r.get("profile"):
                      by_prof[r["profile"]].append(r)
          def find_proc(pid, t):
              for r in PR.get(pid, []):
                  if r["seen"] - 150 <= t and (r["end"] is None or t <= r["end"] + 150):
                      return r
              return None
          def run_of(t):
              return next((r for r in runs if r["t0"] <= t <= r["t1"] + 3000), None)
          TT = {}
          def tests_of(run):
              if run["i"] in TT:
                  return TT[run["i"]]
              T = collections.OrderedDict()
              for e in jl(run["times"]):
                  t = T.setdefault(e["nodeid"], {"start": None, "finish": None})
                  if e["event"] == "start":
                      t["start"] = e["t"]
                  elif e["event"] == "finish":
                      t["finish"] = e["t"]
              order = list(T)
              for k, n in enumerate(order):
                  if T[n]["finish"] is None:
                      T[n]["finish"] = T[order[k + 1]]["start"] if k + 1 < len(order) else run["t1"]
              TT[run["i"]] = (T, order)
              return TT[run["i"]]
          def test_of(t):
              run = run_of(t)
              if not run:
                  return None
              T, order = tests_of(run)
              for n in order:
                  if T[n]["start"] is not None and T[n]["start"] <= t <= (T[n]["finish"] or 0) + 2:
                      return n
              return None
          def proxy_of(prof, procs):
              pf = (PF.get(prof) or {}).get("prefs")
              routes = [r.get("route_proxy") for r in procs if r.get("route_present")]
              if pf is None and not routes:
                  return "?", "no prefs, no route"
              ctx = (pf or {}).get("network.trr.stealth.contexts")
              ptp = (pf or {}).get("network.proxy.type")
              yes = "*" in str(ctx) or any(routes) or ptp == "1"   # "*,6" = launch proxy; "6" = context-only (no launch proxy); empty = none
              return ("yes" if yes else "no"), "ctx=%s proxytype=%s route=%s" % (ctx, ptp, routes[:1] or "-")
          def sess_of(prof):
              """The session of a profile: its test (the one running when it was born), its close (the main browser's end, else the directory's), its senders."""
              pl = by_prof.get(prof, [])
              mains = sorted((r for r in pl if r["ptype"] == "main"), key=lambda r: r["seen"])
              close = mains[0]["end"] if mains else None
              close_src = "main browser exit" if close is not None else None
              if close is None and (PF.get(prof) or {}).get("gone"):
                  close, close_src = PF[prof]["gone"], "profile dir removed"
              born = (PF.get(prof) or {}).get("born") or (mains[0]["seen"] if mains else None)
              proxy, why = proxy_of(prof, pl)
              return {"test": test_of(born) if born else None, "born": born, "close": close, "close_src": close_src, "proxy": proxy, "why": why,
                      "senders": sorted((r for r in pl if r["ptype"] == "pingsender"), key=lambda r: r["seen"]), "main": mains[0] if mains else None}
          SESS = {}
          def sess(prof):
              if prof not in SESS:
                  SESS[prof] = sess_of(prof)
              return SESS[prof]
          def rel(v):
              return "none" if v is None else "%+d" % round(v)
          hq_rows = []
          for x, o, dj in rows_q:
              t = x["t"]
              run = run_of(t)
              row = {"arm": arm, "run": run["i"] if run else None, "t": round(t, 1), "hhmmss": _time.strftime("%H:%M:%S", _time.gmtime(t / 1000)) + ".%03d" % (t % 1000),
                     "qname": x["qname"], "qtype": x["qtype"], "dst": x["dst"], "sport": x["sport"], "pid": o["pid"] if o else None, "tid": o["tid"] if o else None,
                     "comm": o["comm"] if o else None, "owner_src": o["src"] if o else None, "join_dt_ms": round(dj) if dj is not None else None}
              pr = find_proc(o["pid"], t) if o else None
              row["proc_found"] = bool(pr)
              if pr:
                  row["ptype"], row["pcomm"], row["ppid"] = pr["ptype"], pr["comm"], pr["ppid"]
                  row["chain"] = [(c["pid"], c["ptype"]) for c in pr.get("chain", [])[:4]]
                  row["head"] = pr.get("head")
                  row["tail"] = pr.get("tail")
                  row["alive_ms"] = round(t - pr["seen"])
                  row["profile"] = pr.get("profile")
              elif o and execs.get(o["pid"]):
                  ex = execs[o["pid"]][-1]
                  row["ptype"] = "unseen-by-watcher:" + os.path.basename(ex["argv"].split(" ")[0])
                  row["argv"] = ex["argv"][:120]
                  row["profile"] = None
              elif o:
                  row["ptype"] = "other:" + (o["comm"] or "?")
                  row["profile"] = None
              else:
                  row["ptype"] = "unattributed"
                  row["profile"] = None
              S = sess(row["profile"]) if row["profile"] else None
              row["session_test"] = S["test"] if S else None
              row["launch_proxy"] = S["proxy"] if S else "n/a"
              row["proxy_signals"] = S["why"] if S else None
              row["test_at"] = test_of(t)
              row["since_close_ms"] = round(t - S["close"]) if S and S["close"] is not None else None
              row["close_src"] = S["close_src"] if S else None
              snd = []
              if S:
                  for s in S["senders"][:3]:
                      snd.append({"pid": s["pid"], "born": round(t - s["seen"]), "end": round(t - s["end"]) if s["end"] is not None else None, "self": bool(pr and s is pr)})
              row["senders"] = snd
              row["phase"] = "nosession" if not S else ("session-open-at-end" if S["close"] is None else ("before_close" if t < S["close"] else "after_close"))
              hq_rows.append(row)
          with open(out + "/huntq.jsonl", "w", encoding="utf-8") as f:
              for r in hq_rows:
                  f.write(json.dumps(r, default=str) + "\n")
          print("HUNTQDIAG %-4s status [%s] | bpf datagrams to :53 %d, ss records %d, exec records %d | tcpdump lines %d, queries %d (unparsed %d) | rows %d, with a pid %d, process known to the watcher %d, no pid %d, bpf datagram without a tcpdump line %d | anchors %d | sample unparsed %s"
                % (arm, status, n_bpf, len(owners) - n_bpf, sum(len(v) for v in execs.values()), tcp_lines, len(uniq), len(unparsed), len(hq_rows), sum(1 for r in hq_rows if r["pid"]),
                   sum(1 for r in hq_rows if r["proc_found"]), sum(1 for r in hq_rows if not r["pid"]), sum(1 for r in hq_rows if r["qname"].startswith("?")), len(anch), unparsed[:2]))
          def fmt(r):
              sn = ",".join("%d%s:b%s/e%s" % (s["pid"], "[self]" if s["self"] else "", "%+d" % s["born"], rel(s["end"])) for s in r["senders"]) or "none"
              return ("HUNTQ arm=%s run=%s t=%.0f at=%s qname=%s qtype=%s sport=%s pid=%s tid=%s thread=\"%s\" type=%s comm=\"%s\" chain=%s profile=%s session_test=%s launch_proxy=%s [%s] test_running=%s since_close_ms=%s (%s) phase=%s senders(pid:ms_from_birth/ms_from_end)=%s src=%s"
                      % (r["arm"], r["run"], r["t"], r["hhmmss"], r["qname"], r["qtype"], r["sport"], r["pid"], r["tid"], r["comm"], r["ptype"], r.get("pcomm"), r.get("chain"),
                         os.path.basename(r["profile"]) if r["profile"] else None, short(r["session_test"] or "?") if r["session_test"] or r["profile"] else None, r["launch_proxy"], r["proxy_signals"],
                         short(r["test_at"] or "?"), rel(r["since_close_ms"]), r["close_src"], r["phase"], sn, r["owner_src"]))
          tel_rows = [r for r in hq_rows if r["qname"].rstrip(".") == TEL]
          other_rows = [r for r in hq_rows if r["qname"].rstrip(".") != TEL]
          for r in tel_rows:
              print(fmt(r))
          for r in other_rows[:150]:
              print(fmt(r))
          if len(other_rows) > 150:
              print("HUNTQMORE %-4s %d more queries of other names in huntq.jsonl (uploaded)" % (arm, len(other_rows) - 150))
          cnt_sum = collections.Counter((r["qname"], r["ptype"], r["launch_proxy"], r["phase"]) for r in hq_rows)
          print("HUNTQSUM %-4s total %d (telemetry host %d) | by (qname, process type, session launch proxy, before/after close): %s"
                % (arm, len(hq_rows), len(tel_rows), "; ".join("(%s, %s, proxy=%s, %s)=%d" % (k[0], k[1], k[2], k[3], v) for k, v in cnt_sum.most_common(80))))
          cnt_run = collections.Counter((r["run"], r["ptype"]) for r in tel_rows)
          print("HUNTQTEL %-4s telemetry-host queries by (run, type): %s | sessions of those with a launch proxy %d, without %d, unknown %d"
                % (arm, dict(cnt_run), sum(1 for r in tel_rows if r["launch_proxy"] == "yes"), sum(1 for r in tel_rows if r["launch_proxy"] == "no"), sum(1 for r in tel_rows if r["launch_proxy"] not in ("yes", "no"))))
          # ===== The MOZ_LOG side: every lookup of the telemetry host in every process's own log, native or TRR, attributed by pid ======================
          # Files: ff--main.<pid>.log.moz_log (a parent or background-task process), ff--child.<pid>.log.child-N.moz_log (a child process). The line
          # names its own process kind and thread: `[Parent 10037: Socket Thread]: D/nsHostResolver Resolving host [...]`.
          LOGPROC = re.compile(r"\[(\w+) (\d+): ([^\]]*)\]: (.*)$")
          MOZ_PID = (re.compile(r"ff--(?:main|child)\.(\d+)"), re.compile(r"ff-(\d+)"))
          DEC = re.compile(r"skip|bypass|exclu|not us|disabl|fallback|mode|confirm|blocklist|proxy|allow", re.I)
          def moz_pid_of(base):
              for rx in MOZ_PID:
                  m = rx.search(base)
                  if m:
                      return int(m.group(1))
              return None
          def templ_of(msg):
              s = re.sub(r"0x[0-9a-fA-F]+", "P", msg)
              s = re.sub(r"\[[^\]]*\]", "[..]", s)
              s = re.sub(r"\d+", "N", s)
              return s[:95]
          def ctx_of(prof):
              pf = (PF.get(prof) or {}).get("prefs")
              return str((pf or {}).get("network.trr.stealth.contexts", "?")) if pf is not None else "?"
          mozl = []          # one per native lookup (a "Calling getaddrinfo" line for the telemetry host)
          per_pid = {}       # (arm, run, pid) -> counters
          templ = collections.Counter()
          for run in runs:
              for fn in sorted(glob.glob(run["logd"] + "/*")):
                  base = os.path.basename(fn)
                  fpid = moz_pid_of(base)
                  recs = []
                  for ln in open(fn, encoding="utf-8", errors="replace"):
                      hit = TEL in ln
                      if not hit and not ("TRR" in ln and DEC.search(ln)):
                          continue
                      if not hit and len(recs) > 3000:
                          continue
                      tm = log_time(ln)
                      mm = LOGPROC.search(ln)
                      if tm is None or not mm:
                          continue
                      msg = mm.group(4)
                      mod = re.match(r"[A-Z]/(\w+)", msg)
                      mod = mod.group(1) if mod else "?"
                      if hit and "Calling getaddrinfo" in msg:
                          kind = "native"
                      elif hit and "lookup completed" in msg:
                          kind = "native-done"
                      elif hit and mod == "TRR":
                          kind = "trr"
                      elif hit:
                          kind = "resolver"
                      else:
                          kind = "context"
                      recs.append({"t": tm, "kind": kind, "proc": mm.group(1), "pid": int(mm.group(2)), "thread": mm.group(3), "msg": msg[:230], "mod": mod})
                  hits = [r for r in recs if r["kind"] != "context"]
                  if not hits:
                      continue
                  pid = fpid or hits[0]["pid"]
                  pr = find_proc(pid, hits[0]["t"])
                  c = per_pid.setdefault((run["arm"], run["i"], pid), {"native": 0, "trr": 0, "resolver": 0, "done": 0, "pr": pr, "proc": hits[0]["proc"], "file": base})
                  for r in hits:
                      templ[(pr["ptype"] if pr else "log:" + r["proc"], r["mod"], templ_of(r["msg"]))] += 1
                      k = {"native": "native", "trr": "trr", "resolver": "resolver"}.get(r["kind"], "done")
                      c[k] += 1
                  for r in hits:
                      if r["kind"] != "native":
                          continue
                      near = [x for x in recs if x is not r and abs(x["t"] - r["t"]) <= 250 and x["kind"] in ("context", "trr", "resolver")][:6]
                      prof = pr.get("profile") if pr else None
                      S = sess(prof) if prof else None
                      mozl.append({"arm": run["arm"], "run": run["i"], "t": r["t"], "pid": pid, "ptype": pr["ptype"] if pr else "unseen", "logproc": r["proc"], "thread": r["thread"],
                                   "profile": prof, "session_test": S["test"] if S else None, "proxy": S["proxy"] if S else "n/a", "ctx": ctx_of(prof) if prof else "?",
                                   "test_at": test_of(r["t"]), "since_close": round(r["t"] - S["close"]) if S and S["close"] is not None else None, "line": r["msg"],
                                   "near": [(round(x["t"] - r["t"]), x["kind"], x["msg"][:150]) for x in near], "file": base})
          mozl.sort(key=lambda r: r["t"])
          with open(out + "/huntl.jsonl", "w", encoding="utf-8") as f:
              for r in mozl:
                  f.write(json.dumps(r, default=str) + "\n")
          for r in mozl:
              print("HUNTL arm=%s run=%s t=%.0f at=%s pid=%s type=%s log_process=%s thread=\"%s\" session_test=%s launch_proxy=%s ctx=%s test_running=%s since_close_ms=%s | %s | near(ms,kind,line)=%s"
                    % (r["arm"], r["run"], r["t"], _time.strftime("%H:%M:%S", _time.gmtime(r["t"] / 1000)) + ".%03d" % (r["t"] % 1000), r["pid"], r["ptype"], r["logproc"], r["thread"],
                       short(r["session_test"] or "?"), r["proxy"], r["ctx"], short(r["test_at"] or "?"), rel(r["since_close"]), r["line"][:200], r["near"][:4]))
          agg = collections.defaultdict(collections.Counter)
          for (a, ri, pid), c in per_pid.items():
              pr = c["pr"]
              prof = pr.get("profile") if pr else None
              key = (pr["ptype"] if pr else "log:" + c["proc"], "proxy=" + (sess(prof)["proxy"] if prof else "n/a"), "ctx=" + (ctx_of(prof) if prof else "?"))
              agg[key]["processes"] += 1
              agg[key]["with a native lookup"] += 1 if c["native"] else 0
              agg[key]["native lookups"] += c["native"]
              agg[key]["TRR lines"] += c["trr"]
              agg[key]["other resolver lines"] += c["resolver"]
          for k, v in sorted(agg.items(), key=lambda kv: -kv[1]["processes"]):
              print("HUNTLSUM %-4s %s | %s" % (arm, k, dict(v)))
          for (pt, mod, tp), n in templ.most_common(30):
              print("HUNTLTEMPL %-4s %-12s %-14s x%-4d %s" % (arm, pt, mod, n, tp))
          # Failing tests by EXACT node id (the junit's classname and name are rebuilt from the node id: no truncated name mixes the variants).
          def junit_of(run):
              d = {}
              try:
                  for tc in ET.parse(run["junit"]).getroot().iter("testcase"):
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          d[(tc.get("classname"), tc.get("name"))] = (f.get("message") or "") + "\n" + (f.text or "")
              except (OSError, ET.ParseError):
                  pass
              return d
          for run in runs:
              T, order = tests_of(run)
              jd = junit_of(run)
              for n in order:
                  parts = n.split("::")
                  want = (parts[0][:-3].replace("/", ".") + "".join("." + c for c in parts[1:-1]), parts[-1])
                  msg = jd.get(want)
                  if msg is None:
                      continue
                  a, b = T[n]["start"], (T[n]["finish"] or 0) + 2
                  asked = QRE.findall(msg.split("asked the resolver of the machine", 1)[-1]) if "asked the resolver of the machine" in msg else []
                  nat = [r for r in mozl if r["run"] == run["i"] and a <= r["t"] <= b]
                  ker = [r for r in hq_rows if r["run"] == run["i"] and r["qname"].rstrip(".") == TEL and a <= r["t"] <= b]
                  print("HUNTFAIL %-4s run %d %s | trap counted (name, port, proto) %s | MOZ_LOG native lookups of the telemetry host in its window %d: %s | kernel-side queries of the telemetry host in its window %d: %s"
                        % (run["arm"], run["i"], n, [(x[0], x[1], x[2]) for x in asked][:8], len(nat),
                           [(r["pid"], r["ptype"], r["logproc"], "session " + short(r["session_test"] or "?"), "proxy " + r["proxy"], "ctx " + str(r["ctx"]), "+%d ms into the test" % round(r["t"] - a)) for r in nat][:6],
                           len(ker), [(r["pid"], r["ptype"], "session " + short(r["session_test"] or "?"), "proxy " + r["launch_proxy"], "sport %s" % r["sport"], "+%d ms into the test" % round(r["t"] - a)) for r in ker][:6]))
          PY
      - name: Readable outputs (written as root under sudo)
        if: always()
        run: |
          sudo tar -czf "$RUNNER_TEMP/out/moz-logs.tgz" -C "$RUNNER_TEMP/out" moz || true
          sudo chmod -R a+rX "$RUNNER_TEMP/out" || true
