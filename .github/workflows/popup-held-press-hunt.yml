# ─────────────────────────────────────────────────────────────────────────────
# popup-held-press-hunt.yml - the proof of a mechanism, once, on a `hunt/` branch (never main).
#
# A popup opened from the click of a press held more than 5 s is refused (the transient activation of a mouse is born at pointerdown and lasts 5000 ms);
# held 0.1 s it is made. tests/test_a_popup_after_a_held_press_hunt_e2e.py holds the press on purpose, on the published engine, on Windows and on Linux.
# It starts on a push to the hunt branch only, and it is not a gate.
# ─────────────────────────────────────────────────────────────────────────────
name: popup held press hunt

on:
  push:
    branches: [hunt/popup-held-press]

permissions:
  contents: read

concurrency:
  group: popup-held-press-hunt-${{ github.ref }}
  cancel-in-progress: true

# Engine and GeoIP downloads go through the release API with this token.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  hunt-windows:
    name: hunt (windows)
    runs-on: windows-2022
    timeout-minutes: 30
    # TEMP and TMP on D:\a\_temp, as the e2e job of Windows: the profiles of the browser land in TEMP.
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: The security state (a fixed directory of the repository)
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: The press held 5.5 s and 0.1 s
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/hunt"
          env -u INVISIBLE_CORE_PIN INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" \
            python -u -m pytest tests/test_a_popup_after_a_held_press_hunt_e2e.py -m e2e -n 0 -o addopts='' -p no:cacheprovider -p no:rerunfailures -s \
            -o junit_family=xunit2 --junitxml="$RUNNER_TEMP/hunt/junit.xml" 2>&1 | tee "$RUNNER_TEMP/hunt/stdout.txt"
          exit "${PIPESTATUS[0]}"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the junit and the output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: popup-held-press-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hunt
          if-no-files-found: warn
          retention-days: 14

  hunt-linux:
    name: hunt (linux, xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: System deps (xvfb + Firefox runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo "$(which python)" -m playwright install-deps firefox
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build
      - name: The press held 5.5 s and 0.1 s
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/hunt"
          xvfb-run -a env -u INVISIBLE_CORE_PIN INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" \
            python -u -m pytest tests/test_a_popup_after_a_held_press_hunt_e2e.py -m e2e -n 0 -o addopts='' -p no:cacheprovider -p no:rerunfailures -s \
            -o junit_family=xunit2 --junitxml="$RUNNER_TEMP/hunt/junit.xml" 2>&1 | tee "$RUNNER_TEMP/hunt/stdout.txt"
          exit "${PIPESTATUS[0]}"
      - name: Upload the junit and the output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: popup-held-press-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hunt
          if-no-files-found: warn
          retention-days: 14
