# HUNT ONLY, never merged. The PUBLISHED packages against stock Playwright and against the real Firefox, same job, alternated rounds,
# Windows and Linux (Linux under xvfb for the headed retail arms): invisible-playwright 0.52.1 + invisible-core 64.73.0 on the engine
# firefox-64. Measurement only.
# Arms: inproc4 (4 browsers in one process, no timezone, no proxy), inproc4quiet (the same with the hunt's own samplers off),
# inproc4tz (timezone given), inproc4px (through a local proxy), late (typing 60 s after the last launch), solo (one browser alone on
# the machine), one (1 browser per process, 4 processes at once), remote (launch_server), stock (Playwright's Firefox),
# retail1 / retail4 / retail4late (the official Firefox 159, headed, no Playwright: 1 browser, 4 together closed 20 s after their
# first load, 4 together closed 70 s after it).
# Time: about 8 minutes a round on Windows (late about 90 s, retail4late about 100 s, the other arms 15-45 s), six rounds, about 50
# minutes against the 70 of the step; the loop starts no arm after 63 minutes.
name: published latency hunt
on:
  push:
    branches: [hunt/published-latency]
    paths: [scripts/hunt_published_latency.py, .github/workflows/published-latency-hunt.yml]
permissions:
  contents: read
concurrency:
  group: published-latency-hunt
  cancel-in-progress: true
env:
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  hunt:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: A venv from PyPI (0.52.1) and stock Playwright
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=Scripts; else BIN=bin; fi
          python -m venv "$RUNNER_TEMP/after"
          "$RUNNER_TEMP/after/$BIN/python" -m pip install -q --upgrade pip
          "$RUNNER_TEMP/after/$BIN/python" -m pip install -q "invisible-playwright==0.52.1" psutil websockets "playwright==$(cat scripts/playwright_pin.txt)"
          "$RUNNER_TEMP/after/$BIN/python" -c "import importlib.metadata as m; print('after', m.version('invisible-playwright'), m.version('invisible-core'))"
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb xdotool wmctrl openbox; "$RUNNER_TEMP/after/$BIN/python" -m playwright install --with-deps firefox; else "$RUNNER_TEMP/after/$BIN/python" -m playwright install firefox; fi
          echo "PY_AFTER=$RUNNER_TEMP/after/$BIN/python" >> "$GITHUB_ENV"
      - name: The engine the venv fetches
        run: |
          echo "FF_AFTER=$(cd "$RUNNER_TEMP" && "$PY_AFTER" -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The retail Firefox 159.0 en-US (official, for the reference arms)
        continue-on-error: true
        run: |
          B=https://archive.mozilla.org/pub/firefox/releases/159.0
          R="$RUNNER_TEMP/retail"
          mkdir -p "$R"
          if [ "$RUNNER_OS" = "Windows" ]; then
            D="$B/win64/en-US/"; F="Firefox%20Setup%20159.0.exe"
          else
            D="$B/linux-x86_64/en-US/"; F="firefox-159.0.tar.xz"
          fi
          echo "the files of $D:"
          curl -fsSL --retry 3 "$D" | grep -o 'href="[^"]*"' | grep -iE 'firefox' | head -20
          curl -fsSL --retry 3 -o "$R/package.bin" "$D$F"
          ls -l "$R/package.bin"
          sha256sum "$R/package.bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            if command -v 7z > /dev/null 2>&1; then SZ=7z; else SZ="/c/Program Files/7-Zip/7z.exe"; fi
            cp "$R/package.bin" "$R/package.exe"
            "$SZ" x "$R/package.exe" -o"$R/win" -y > /dev/null
            FF="$R/win/core/firefox.exe"
          else
            tar -xJf "$R/package.bin" -C "$R"
            FF="$R/firefox/firefox"
          fi
          ls -l "$FF"
          sha256sum "$FF"
          echo "FF_RETAIL=$FF" >> "$GITHUB_ENV"
      - name: Six rounds, the arms in rotating order
        continue-on-error: true
        env:
          HUNT_PROBES: "1"
        timeout-minutes: 70
        run: |
          set +e
          S=scripts/hunt_published_latency.py
          # What an arm prints: its HUNT lines, each tagged with the arm.
          keep() { grep -E '^HUNT(ROW|SLOW|PROBE|EVAL|SHUT)' | sed -E "s/^(HUNT[A-Z]+) /\1 [$1] /"; }
          # The retail arms: N browsers, round, seconds after the first load before the normal close (Linux headed under xvfb).
          retail() {
            if [ -z "$FF_RETAIL" ]; then echo "HUNTROW {\"arm\": \"retail\", \"crash\": \"no retail Firefox\"}"; return; fi
            if [ "$RUNNER_OS" = "Linux" ]; then
              # A window manager in the virtual display, so the retail browser can be closed as a person closes it (wmctrl ->
              # _NET_CLOSE_WINDOW -> WM_DELETE_WINDOW); without one only a signal is left, which is not a normal quit.
              xvfb-run -a -s "-screen 0 1280x1024x24" sh -c 'openbox > /dev/null 2>&1 & sleep 1; exec "$0" "$@"' "$PY_AFTER" $S retail "$1" "$2" "$FF_RETAIL" "$3" 2>&1
            else
              "$PY_AFTER" $S retail "$1" "$2" "$FF_RETAIL" "$3" 2>&1
            fi
          }
          run_arm() {
            case "$1" in
              inproc4) "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4 ;;
              inproc4quiet) HUNT_NO_SAMPLER=1 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4quiet ;;
              inproc4tz) HUNT_TIMEZONE=Europe/Rome "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4tz ;;
              inproc4px) HUNT_PROXY=1 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep inproc4px ;;
              late)    HUNT_TYPE_LATE_S=60 "$PY_AFTER" $S inproc 4 "$2" "$FF_AFTER" 2>&1 | keep late ;;
              solo)    "$PY_AFTER" $S inproc 1 "$2" "$FF_AFTER" 2>&1 | keep solo ;;
              remote)  "$PY_AFTER" $S remote 4 "$2" "$FF_AFTER" 2>&1 | keep remote ;;
              stock)   "$PY_AFTER" $S stock 4 "$2" 2>&1 | keep stock ;;
              one)     for k in 0 1 2 3; do "$PY_AFTER" $S inproc 1 "$2-$k" "$FF_AFTER" > "$RUNNER_TEMP/one-$k.log" 2>&1 & done; wait
                       cat "$RUNNER_TEMP"/one-*.log | keep one ;;
              retail1) retail 1 "$2" 20 | keep retail1 ;;
              retail4) retail 4 "$2" 20 | keep retail4 ;;
              retail4late) retail 4 "$2" 70 | keep retail4late ;;
            esac
            if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM firefox.exe //T > /dev/null 2>&1; else pkill -9 -f firefox > /dev/null 2>&1; fi
          }
          ARMS=(inproc4 inproc4quiet inproc4tz inproc4px late solo one remote stock retail1 retail4 retail4late)
          if [ -n "$ONLY_ARMS" ]; then read -ra ARMS <<< "$ONLY_ARMS"; fi
          N=${#ARMS[@]}
          for r in 0 1 2 3 4 5; do
            for k in $(seq 0 $((N-1))); do
              if [ "$SECONDS" -gt 3780 ]; then echo "time guard: no new arm after $SECONDS s"; break 2; fi
              a=${ARMS[$(( (k + r) % N ))]}; run_arm "$a" "r$r" | tee -a "$RUNNER_TEMP/rows.log"
            done
          done
          true
      - name: The table
        if: always()
        run: |
          python - "$RUNNER_TEMP/rows.log" <<'PY'
          import json, re, sys, statistics
          rows = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTROW \[(\w+)\] (.*)", line.strip())
              if m:
                  rows.setdefault(m.group(1), []).append(json.loads(m.group(2)))
          def q(v, p):
              v = sorted(x for x in v if x is not None)
              return v[min(len(v) - 1, int(p * len(v)))] if v else None
          def trio(v):
              return "p50 %s p95 %s max %s" % (q(v, .5), q(v, .95), max((x for x in v if x is not None), default=None))
          for arm in ("inproc4", "inproc4quiet", "inproc4tz", "inproc4px", "late", "solo", "one", "remote", "stock"):
              if not rows.get(arm):
                  continue
              r = [x for x in rows.get(arm, []) if "crash" not in x]
              crashes = len(rows.get(arm, [])) - len(r)
              ev =[e for x in r for e in x["eval_ms"]]
              gr = [g for x in r for g in x["goto_req_ms"]]
              print("HUNTLAUNCHSPLIT %-12s ms: launch() %s | new_context %s | new_page %s | first_load %s | to_first_load p50 %s p95 %s | Firefox parent CPU s p50: launch() %s new_context %s new_page %s first_load %s"
                    % (arm, trio([x.get("enter_ms") for x in r]), trio([x.get("ctx_ms") for x in r]), trio([x.get("new_page_ms") for x in r]), trio([x.get("first_load_ms") for x in r]),
                       q([x.get("to_first_load_ms") for x in r], .5), q([x.get("to_first_load_ms") for x in r], .95),
                       q([x.get("enter_cpu_s") for x in r], .5), q([x.get("ctx_cpu_s") for x in r], .5), q([x.get("new_page_cpu_s") for x in r], .5), q([x.get("first_load_cpu_s") for x in r], .5)))
              print("HUNTTABLE %-12s browsers %3d crashes %d | launch ms p50 %s p95 %s | close ms p50 %s p95 %s | eval ms p50 %s p95 %s max %s >300ms %d of %d | goto->request ms p50 %s p90 %s max %s | cpu s/browser p50 %s"
                    % (arm, len(r), crashes, q([x["launch_ms"] for x in r], .5), q([x["launch_ms"] for x in r], .95), q([x["close_ms"] for x in r], .5), q([x["close_ms"] for x in r], .95),
                       q(ev, .5), q(ev, .95), max(ev) if ev else None, sum(1 for e in ev if e > 300), len(ev), q(gr, .5), q(gr, .9), max((g for g in gr if g is not None), default=None),
                       q([x["cpu_s_per_browser"] for x in r], .5)))
              ty = [x.get("typing") or {} for x in r]
              ok = [t for t in ty if "slip_abs_max" in t]
              errs = [t.get("error") for t in ty if t.get("error")]
              print("HUNTTYPING %-12s typed %d of %d | key slip vs plan: p50 of browsers %s, max %s | keys over 100 ms %d of %d | compressions %d | mouse: longest gap %s ms, bursts <2 ms %d, clicks %d | errors %s"
                    % (arm, len(ok), len(ty), q([t["slip_abs_p50"] for t in ok], .5), max((t["slip_abs_max"] for t in ok), default=None),
                       sum(t["keys_over_100ms"] for t in ok), sum(t["keys_planned"] for t in ok), sum(t["compressions"] for t in ok),
                       max((t["mouse_gap_max"] or 0 for t in ty if "mousemoves" in t), default=None), sum(t.get("mouse_bursts_under_2ms", 0) for t in ty),
                       sum(t.get("clicks", 0) for t in ty), errs[:2]))
              # Where the slip is born, per key (detail = planned, sent, answered, timeStamp, handler; ms from the first send).
              det = [d for t in ok for d in t.get("detail") or []]
              late_c = [d[1] - d[0] for d in det]
              rt = [d[2] - d[1] for d in det]
              birth = [d[3] - d[1] for d in det]
              hts = [h for t in ok for h in t.get("handler_minus_ts") or []]
              print("HUNTKEYCLOCKS %-12s on event.timeStamp: keys over 100 ms %d, max %s, compressions %d | on the handler: keys over 100 ms %d, max %s | handler - timeStamp p50 %s p95 %s max %s | matched %d of %d | machine CPU busy %% during typing p50 %s max %s"
                    % (arm, sum(t["keys_over_100ms"] for t in ok), max((t["slip_abs_max"] for t in ok), default=None), sum(t["compressions"] for t in ok),
                       sum(t.get("h_keys_over_100ms", 0) for t in ok), max((t.get("h_slip_abs_max", 0) for t in ok), default=None),
                       q(hts, .5), q(hts, .95), max(hts, default=None), sum(1 for t in ok if t.get("detail")), len(ok),
                       q([t.get("machine_cpu_busy_pct") for t in ty], .5), max((t.get("machine_cpu_busy_pct") or 0 for t in ty), default=None)))
              if det:
                  print("HUNTKEYSPLIT %-12s client send vs plan: keys over 100 ms %d, p50 %s max %s | client send -> engine answer p50 %s p95 %s max %s | client send -> event.timeStamp p50 %s p95 %s max %s"
                        % (arm, sum(1 for x in late_c if abs(x) > 100), q(late_c, .5), max(late_c), q(rt, .5), q(rt, .95), max(rt), q(birth, .5), q(birth, .95), max(birth)))
                  worst = sorted(((abs((t["detail"][i][3] - t["detail"][0][3]) - t["detail"][i][0]), t["detail"][max(0, i - 1):i + 1]) for t in ok if t.get("detail")
                                  for i in range(len(t["detail"]))), key=lambda w: -w[0])[:4]
                  for slip, pair in worst:
                      print("HUNTKEYWORST %-12s timeStamp slip %.0f ms | previous and this key [planned, sent, answered, timeStamp, handler]: %s" % (arm, slip, pair))
          # The retail Firefox 159: from the process start to the first page loaded (the onload beacon at the server), to the first
          # visible top-level window, the normal close to every process of the tree gone, the session and the parent's CPU.
          for arm in ("retail1", "retail4", "retail4late"):
              all_r = rows.get(arm, [])
              r = [x for x in all_r if "crash" not in x]
              if not all_r:
                  continue
              print("HUNTRETAIL %-12s browsers %d crashes %d %s | start->load ms %s | start->window ms %s (no window: %d) | close->tree gone ms %s (timeouts %d) | close->main process gone ms p50 %s p95 %s | session s p50 %s | parent CPU s p50 %s p95 %s, at load p50 %s | tree CPU s at close p50 %s | exited before close %d | close cmd rc %s | last to exit %s"
                    % (arm, len(r), len(all_r) - len(r), [x.get("crash") for x in all_r if "crash" in x][:1], trio([x.get("start_to_load_ms") for x in r]),
                       trio([x.get("start_to_window_ms") for x in r]), sum(1 for x in r if x.get("start_to_window_ms") is None),
                       trio([x.get("close_ms") for x in r]), sum(1 for x in r if x.get("close_timeout")),
                       q([x.get("close_main_ms") for x in r], .5), q([x.get("close_main_ms") for x in r], .95), q([x.get("session_s") for x in r], .5),
                       q([x.get("parent_cpu_s") for x in r], .5), q([x.get("parent_cpu_s") for x in r], .95), q([x.get("cpu_at_load_s") for x in r], .5),
                       q([x.get("tree_cpu_at_close_s") for x in r], .5), sum(1 for x in r if x.get("exited_before_close")),
                       sorted({str((x.get("close_cmd") or [None])[0]) for x in r}), sorted({(x.get("last_exits") or [["?"]])[0][0] for x in r})))
          # The path of one evaluate, segment by segment (p50/p95 ms, over the traced browser of every round).
          segs, missing, trace_n = {}, {}, {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTEVAL \[(\w+)\] (.*)", line.strip())
              if m:
                  d = json.loads(m.group(2))
                  trace_n[m.group(1)] = trace_n.get(m.group(1), 0) + 1
                  for name, vals in d["segs"].items():
                      if isinstance(vals, list):
                          segs.setdefault(m.group(1), {}).setdefault(name, []).extend(vals)
                      elif name == "missing":
                          missing[m.group(1)] = missing.get(m.group(1), 0) + vals
          names = ("call_to_send", "send_to_pickup", "pickup_to_pipe", "pipe_to_reply_read", "read_to_ready", "ready_to_reply", "reply_to_loop", "dispatch", "resolve_to_return", "total")
          for arm, s in sorted(segs.items()):
              print("HUNTEVALSPLIT %-12s traced browsers %d, evaluates %d, incomplete %d, engine commands per evaluate p50 %s | p50/p95 ms: %s"
                    % (arm, trace_n[arm], len(s.get("total", [])), missing.get(arm, 0), q(s.get("cmds", []), .5),
                       " | ".join("%s %s/%s" % (n, q(s.get(n, []), .5), q(s.get(n, []), .95)) for n in names)))
          # The lines of the shutdown log (retail), grouped: how many browsers printed it, when against the close (ms, p50).
          groups = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTSHUT \[(\w+)\] (.*)", line.strip())
              if m:
                  d = json.loads(m.group(2))
                  groups.setdefault((m.group(1), re.sub(r"\d+", "#", d["line"])[:110]), []).append(d["t_ms"])
          for (arm, text), ts in sorted(groups.items(), key=lambda kv: (kv[0][0], q(kv[1], .5) if q(kv[1], .5) is not None else 1e12))[:80]:
              print("HUNTSHUTSUM %-12s n %3d | ms against the close p50 %s p95 %s | %s" % (arm, len(ts), q(ts, .5), q(ts, .95), text))
          PY
          python - "$RUNNER_TEMP/rows.log" <<'PY2'
          import json, re, sys
          probes = {}
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"HUNTPROBE \[(\w+)\] (.*)", line.strip())
              if m:
                  d = json.loads(m.group(2)); probes.setdefault((m.group(1), d["name"]), []).append(d)
          def q(v, p):
              v = sorted(v); return v[min(len(v) - 1, int(p * len(v)))] if v else None
          for (arm, name), ds in sorted(probes.items()):
              ms = [d["ms"] for d in ds]
              line = "HUNTPROBESUM %-12s %-34s n %3d | ms p50 %s p95 %s max %s" % (arm, name, len(ds), q(ms, .5), q(ms, .95), max(ms))
              if name == "geo._family_lock":
                  w = [d["extra"]["waited_ms"] for d in ds]
                  line += " | held by: %s | waited p50 %s p95 %s max %s" % (sorted({d["thread"] for d in ds})[:4], q(w, .5), q(w, .95), max(w))
              print(line)
          PY2
          grep -h "HUNTSLOW" "$RUNNER_TEMP/rows.log" | cut -c1-900 || true
          # The geo helpers of the first launch of the first round (the first arm, inproc4, all four browsers): what prepare_session_geo
          # spent its time on (t = seconds from the start of that process, ms = how long, thread).
          grep -hE "HUNTPROBE \[inproc4\] .*\"round\": \"r0\".*\"name\": \"(geo\.|download\.|geoip_db\.|_geoip_db\.|udp_exit\.|requests\.)" "$RUNNER_TEMP/rows.log" | cut -c1-260 | head -150 || true
      - name: Close every Firefox left
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM firefox.exe //T > /dev/null 2>&1 || true; else pkill -9 -f firefox > /dev/null 2>&1 || true; fi
          echo done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "published-latency-${{ matrix.os }}-${{ github.run_id }}", path: "${{ runner.temp }}/rows.log" }
