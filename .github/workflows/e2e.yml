        with:
          name: invpw-evidence-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/invpw-evidence
            ${{ runner.temp }}/host-e2e.xml
            ${{ runner.temp }}/host-crash-e2e.xml
          if-no-files-found: ignore
          retention-days: 14


  e2e-host-windows:
    name: e2e (host, windows)
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      # The runner's screen (1024x768 by default) is smaller than the browser window the e2e open (1936x1048 for a 1920x1080 identity), so the
      # OS cursor cannot be parked outside it (tests/_os_cursor.py) and a native move for it reaches the page. 1920x1080 is the largest mode the
      # runner's video device accepts (run 45730213378 of oss-invisible/playwright): it leaves the strip below the window free. Declared here, read back.
      - name: The runner's screen is 1920x1080, larger than the browser window is tall (read back)
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "the runner's screen: $($b.Width)x$($b.Height) at $($b.X),$($b.Y)"
          if ($b.Width -lt 1920 -or $b.Height -lt 1080) { Write-Error "the runner's screen is $($b.Width)x$($b.Height), not 1920x1080: the OS cursor could not be parked outside the browser window"; exit 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: How many seeds the A/A of each oracle visits (all of them when the pull request touches the oracle)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ab_pr_seeds.py "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      # The geolocation control of the host oracle runs on Playwright's own Firefox (`run_stock`, `ci_ab_host.py stock`) on every run: the binary is not in the image (run
      # 45121964904: `Executable doesn't exist at ms-playwright/firefox-1532/firefox/firefox.exe`, and the oracle blamed the platform provider). The same python as the tests.
      - name: Playwright's own Firefox (the control of the geolocation step)
        run: python -m playwright install firefox
      # The laboratory, before any launch (the published engine, the candidate and the stock control then run on the same machine in the same state): the runner image has
      # the Windows location service off and denied for the machine (run 45153612447: `lfsvc` Disabled and Stopped, `HKLM\...\ConsentStore\location` = Deny), so stock
      # Firefox cannot reach the platform provider and its request waits on the system. A runner that is thrown away after the job: the service is made startable and started,
      # and the consent is Allow for the machine and for the user's non-packaged apps. A setting that does not hold is red here with its reason, never a silent go-on.
      - name: Turn on the Windows location service of the runner (the laboratory of the geolocation step)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows' own answer for the user of the job: the question stock Firefox asks before it starts the Windows provider (AppCapability "location"
          # CheckAccess, dom/geolocation/GeolocationSystemWin.cpp). Read, not presumed: printed before and after, and red unless it is Allowed after
          # (run 45206303882: on windows-2025 the keys said Allow and stock Firefox did not start the provider). WinRT is read through Windows PowerShell.
          $access = {
            $answer = & powershell.exe -NoProfile -Command "`$null = [Windows.Security.Authorization.AppCapabilityAccess.AppCapability,Windows.Security.Authorization.AppCapabilityAccess,ContentType=WindowsRuntime]; [string][Windows.Security.Authorization.AppCapabilityAccess.AppCapability]::Create('location').CheckAccess()" 2>&1
            ($answer | Out-String).Trim()
          }
          "CheckAccess(location) before: $(& $access)"
          $machine = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location'
          $user = 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location'
          foreach ($key in @($machine, $user, "$user\NonPackaged")) {
            if (-not (Test-Path $key)) { New-Item -Path $key | Out-Null }
            Set-ItemProperty -Path $key -Name Value -Value 'Allow'
          }
          Set-Service -Name lfsvc -StartupType Manual
          Start-Service -Name lfsvc
          $service = Get-Service -Name lfsvc
          $bad = @()
          if ($service.Status -ne 'Running') { $bad += "lfsvc is $($service.Status), not Running" }
          if ($service.StartType -eq 'Disabled') { $bad += 'lfsvc is still Disabled' }
          foreach ($key in @($machine, $user, "$user\NonPackaged")) {
            $value = (Get-ItemProperty -Path $key -Name Value).Value
            if ($value -ne 'Allow') { $bad += "$key is $value, not Allow" }
            "$key = $value"
          }
          "lfsvc: $($service.Status), $($service.StartType)"
          $after = & $access
          "CheckAccess(location) after: $after"
          if ($after -ne 'Allowed') { $bad += "Windows answers CheckAccess(location) = $after, not Allowed" }
          if ($bad) { throw ("the location service of the runner is not on: " + ($bad -join '; ')) }
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      - name: Run the host oracle's A/A
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" python -u -m pytest tests/test_ab_host_e2e.py -m e2e -o addopts= -o junit_family=xunit2 -p no:cacheprovider -p no:rerunfailures -rs -v --junitxml="$RUNNER_TEMP/host-e2e.xml"
          python - "$RUNNER_TEMP/host-e2e.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(counts)
          sys.exit(0 if counts == {"tests": 1, "failures": 0, "errors": 0, "skipped": 0} else 1)
          PY
      # What the Windows location provider needs, read only and printed when the control says the step does not reach it (the service, the consent of the location
      # capability for the machine and for the user, its configuration): the runner's state, to be read next to the stock evidence of the oracle.
      - name: The state of the Windows location service and of its consent (read only)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          "--- Get-Service lfsvc"
          try { Get-Service lfsvc -ErrorAction Stop | Format-List * } catch { "lfsvc: not readable: $($_.Exception.Message)" }
          foreach ($key in @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location',
              'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location',
              'HKLM:\SYSTEM\CurrentControlSet\Services\lfsvc\Service\Configuration')) {
            "--- $key"
            if (-not (Test-Path -LiteralPath $key)) { "key absent: $key"; continue }
            try { Get-ItemProperty -LiteralPath $key -ErrorAction Stop | Format-List * } catch { "not readable: $($_.Exception.Message)" }
            foreach ($sub in @('NonPackaged')) {
              $path = Join-Path $key $sub
              if (Test-Path -LiteralPath $path) {
                "--- $path"
                try { Get-ItemProperty -LiteralPath $path -ErrorAction Stop | Format-List * } catch { "not readable: $($_.Exception.Message)" }
              }
            }
          }
      - name: The leg ran with the pinned GeoIP database
        if: always()
        run: |
          python scripts/ci_lab_geoip.py evidence --out "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" > /dev/null
          python scripts/ci_lab_geoip.py verify --evidence "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" --used "$GEOIP_USED_OUT"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload what the test saved
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invpw-evidence-host-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/invpw-evidence
            ${{ runner.temp }}/host-e2e.xml
          if-no-files-found: ignore
          retention-days: 14

