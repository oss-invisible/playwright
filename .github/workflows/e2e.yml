# ─────────────────────────────────────────────────────────────────────────────
# e2e.yml - run the FULL browser-driving e2e suite (the 127 @pytest.mark.e2e)
# on GitHub, on every push/PR to main.
#
# Why this can run on CI when the drive-gate had to stay light: the drive-gate
# launched Firefox in true HEADLESS mode, which is content-process unstable on
# the hosted runners (eval-CSP / context-destroyed). The stealth wrapper instead
# launches Firefox HEADED on a real display; under `xvfb-run` (a virtual X
# server) that's exactly what we get on a headless CI box - stable.
#
# Secret-free, so it's safe in public CI: the binary is the PUBLIC firefox-9
# release (no token), and the webrtc e2e fake a local TCP-only SOCKS. The proxy
# realness gate (fppro through a real proxy) is NOT here: it needs secrets and stays a
# local pre-release gate.
# ─────────────────────────────────────────────────────────────────────────────
name: e2e

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # The same filter as `push` above, which had it and this one did not. A
    # docs-only PR (#54, deleting the Pages site) therefore spun up the full
    # browser bench, hung, and burned the whole 40-minute timeout on a change no
    # test can observe. The filter belongs on BOTH triggers or it is not a filter.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      only:
        description: "Which job. `windows-control-a` runs only the Windows job of the keyboard shortcut (after the core of a release is on the index and its engine is published); `all` runs the whole workflow."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows-control-a

permissions:
  contents: read

# A newer push to a pull request cancels the older in-flight run of THIS
# workflow on that pull request as a whole, cleanly, instead of leaving its
# queued jobs to be cancelled one by one - which left the run marked failed even
# though nothing had actually failed. Keyed by workflow + pull request number,
# so tests and e2e never cancel each other.
#
# NEVER on main. The release gate (scripts/e2e_is_green.py) asks for the e2e
# check-run of the commit being tagged, and a cancelled one refuses the release:
# with the group keyed by ref, the next push to main cancelled the run of the
# commit before it. Outside a pull request the group is unique to the run
# (`github.run_id`), so every commit of main keeps its own finished run, and a
# pending run is not replaced by a newer one either (a group with a fixed name
# drops the older pending run, cancel or not).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Engine and GeoIP downloads go through the release API with this token.
# Anonymous requests share a 60-an-hour limit per runner address and are the
# ones GitHub drops first when it is degraded (2026-11-08: timeouts for
# unauthenticated users failed the gates three times). user-install.yml stays
# anonymous on purpose: it is the user's path.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  # The install below resolves `invisible-core==N.M.0` from the package index,
  # and the core is published BEFORE this package. This gate answers whether it
  # is on the index yet; during that window the e2e job is SKIPPED with the
  # reason in the run summary rather than faked green, and once the core is up
  # it runs unchanged. See .github/workflows/core-on-index.yml.
  core-on-index:
    uses: ./.github/workflows/core-on-index.yml

  # THE UBUNTU PACKAGES OF THE LINUX JOBS, from Ubuntu's archive once per runner image and list (linux-deps.yml), never by a job: a run lost a green leg to its time
  # limit because a mirror served `playwright install-deps firefox` at 102 kB/s. One list for every Linux job of this file: xvfb (with xauth, its recommend, for
  # xvfb-run), strace (the fontconfig suite, the host oracle and its recorder), gdb and elfutils (the cores of a browser that did not end with 0), and what
  # Playwright's install-deps names for Firefox. The jobs install its roots by name from that repository, with --no-download.
  linux-deps-e2e:
    name: linux-deps-e2e
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    uses: ./.github/workflows/linux-deps.yml
    with:
      name: e2e
      packages: xvfb strace gdb elfutils
      playwright_wrapper_ref: ${{ github.sha }}

  # THE e2e ON LINUX, IN THREE PARTS. One job ran the whole Linux e2e in 24.6 minutes on a normal runner and 35.7 on a slow one (the same tests, every
  # one slower by the same 1.44x), close to the 40-minute ceiling. The files of each part are the rows `wrapper.e2e.suite.linux.1` to `.3` of
  # ci/required-suites.json, the same partition the gate of the candidate runs on the engine under test (tests/test_the_e2e_suite_is_accounted_for.py
  # holds it whole), read the way the Windows parts read theirs. The rows leave out by name the tests of `wrapper.e2e.udp.exit` (root) and
  # `wrapper.e2e.udp.sandbox` (user namespaces): part 1, the lightest by the test time of the junit of run 45064266867, runs them in their own steps
  # after its run, and no other part does. The job `e2e (linux, xvfb)` below waits for the three parts and is the one check the release and the
  # branch protection read.
  e2e-linux:
    name: e2e (linux, part ${{ matrix.part }})
    needs: [core-on-index, linux-deps-e2e]
    if: needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # The A/A of the three A/B oracles (page, network, host) runs on the first seeds of the candidate set on a pull request, and on ALL of them when the pull request
      # changes a file of that oracle (scripts/ci_ab_pr_seeds.py holds the lists). The checkout is shallow, so the script fetches the base commit and lists the files that
      # differ from it (`git diff --name-only <base> HEAD`: HEAD is the merge commit, so this is the pull request's own change); the tests read the variables it prints.
      - name: How many seeds the A/A of each oracle visits (all of them when the pull request touches the oracle)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ab_pr_seeds.py "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          # ⛔ The playwright package is NO LONGER a product dependency: the
          # client lives in invisible_playwright._pw and the driver in _driver. It
          # is installed here as a system tool, not as a product dependency (the
          # SYSTEM libraries Firefox needs on a bare runner come from the run's
          # linux-deps-e2e job, which reads the roots `install-deps firefox` installs from the
          # table of the same pin, once per runner image and list).
          #
          # That the product does not IMPORT it is verified by tests/test_fork.py,
          # not from here: if someone one day reintroduced
          # `from playwright...` in src/, this line would mask it, and that is
          # exactly why that test exists.
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: The Linux packages (the run's linux-deps-e2e job, no mirror)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-e2e.outputs.artifact }}
          path: /tmp/linux-deps
      - name: System deps (xvfb, strace, gdb, elfutils + Firefox runtime libs; the repository of the linux-deps-e2e job)
        shell: bash
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
          # the fontconfig e2e trace the opens of the browser: strace is not in the runner image (setsid is, util-linux)
          # TEMPORARY (the -11 at the exit of the security state's generate): a core file of any crash where kernel.core_pattern says, and gdb to read it. tests/conftest.py
          # lifts the core limit of the pytest session (the runner's default soft limit is 0) and, after a test that fails, tests/_crash_cores.py saves gdb's text of every
          # core in INVPW_CORE_DIR under invpw-evidence/cores/<test>/ and deletes the core.
          mkdir -p "$RUNNER_TEMP/invpw-cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/invpw-cores/core.%e.%p"
          echo "INVPW_CORE_DIR=$RUNNER_TEMP/invpw-cores" >> "$GITHUB_ENV"
      # The security state is a ready directory of the repository (ci/security-state/, a result with no data, the sha256 in ci/security-state.pin.json): with
      # STEALTHFOX_SECURITY_STATE set the core neither downloads nor generates one. BEFORE `fetch`, which makes the state present (it would download and generate it).
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The protocol mirror agrees with the engine it is pinned to
        # `invisible_core.juggler.protocol` is generated from the Protocol.js INSIDE the
        # shipped binary, and nothing used to tie the two together after a pin
        # bump: the mirror sat at 71 commands while the pinned engine declared
        # 75, with the unit test that fixes the count green the whole time,
        # because a count checks the mirror against itself. This is the only
        # job that has the binary, so this is where the comparison belongs.
        # The generator moved into the core with the module it writes (0.30.0),
        # so the check runs against the core this package installs.
        run: python -m invisible_core.juggler._gen_protocol --check --binary "$(dirname "$FF")"
      # The GeoIP database is made by the repository (scripts/ci_lab_geoip.py: the same bytes on every run, the sha256 in ci/geoip.json), never a
      # site and never a licensed file: without STEALTHFOX_GEOIP_MMDB the core asks GitHub which database is the latest on every call
      # (run 43211837926). The variable reaches every later step of the job.
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build

      # test_release_e2e.py and test_upgrade_e2e.py (pip, uv, PyPI, the GitHub release) are NOT in this run or in the Windows legs below: tests/conftest.py leaves
      # them out of every run that does not name their file, and user-install.yml (the round after the publication) names it. tests/_post_publication.py.
      # The files of the part are the row `wrapper.e2e.suite.linux.N` of ci/required-suites.json (files, and node ids where a file has tests that skip on
      # Linux or run in another suite). The rows hold no test of `wrapper.e2e.udp.exit` or `wrapper.e2e.udp.sandbox`: those run in the root and sandbox
      # steps of part 1 below, and tests/test_the_root_e2e_run_in_the_root_step_and_nowhere_else.py and tests/test_the_sandbox_e2e_runs_where_user_namespaces_are_on.py
      # hold both the exclusion and the steps.
      - name: The files of this part (the row of the suite, in ci/required-suites.json)
        run: python scripts/ci_verdict.py args --required ci/required-suites.json --suite "wrapper.e2e.suite.linux.${{ matrix.part }}" --os linux > "$RUNNER_TEMP/e2e_args.txt"
      - name: Run this part of the e2e under a virtual display, without the root ones
        # PYTHONUNBUFFERED, and it is not a nicety. Without it Python block-buffers
        # stdout when it is a pipe, and this step printed NOTHING for 39 minutes
        # before the 40-minute timeout killed it on 2026-08-04: a run with no
        # verdict and no way to tell where it went. The variable is inherited by
        # the pytest subprocess run_e2e.py spawns, which is where the output
        # actually comes from.
        env:
          PYTHONUNBUFFERED: "1"
          # The watchdog in tests/conftest.py: at 150s inside ONE test it writes
          # HERE the stack of every thread, and repeats it. Two identical stacks say
          # stuck, two different ones say slow - opposite diagnoses that no other
          # tool distinguishes. To a FILE and not to stderr because pytest redirects
          # the descriptors at the system level: whatever is captured is lost
          # when the process is killed, which is exactly the case it exists for.
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
        # The root ones are in no row and run in the step below, as root: here, as the runner user, they errored. The sandbox ones are in no row either
        # and run in their own step after them: the first is red on a runner whose AppArmor refuses user namespaces to a normal user.
        run: |
          mapfile -t ARGS < <(tr -d '\r' < "$RUNNER_TEMP/e2e_args.txt")
          xvfb-run -a python -u scripts/run_e2e.py "$FF" "${ARGS[@]}"

      # THE ROOT SUITE, AS THE GATE RUNS IT (wrapper.e2e.udp.exit in ci/required-suites.json). Seven e2e need root: the exit of the lab is a documentation
      # address (198.51.100.9) added to `lo` with `ip addr add`. Collected here as the runner user they ERRORED (run 43262636367: "cannot hold 198.51.100.9
      # on lo (needs root and iproute2 on Linux)"), so no row of the parts holds them (ROOT_FILES / ROOT_NODES are the suite's list) and this step of part 1
      # runs them, and only them, in that part only, the way the gate does: the engine copied to /opt/ff (the socket process execs inside a new user namespace, where the runner's 750 home is not
      # readable), `sudo -H -E env -u XDG_RUNTIME_DIR` (Firefox refuses to run as root in a regular user's session), no rerun plugin. Nothing is skipped
      # silently: the step reads its own junit and refuses anything but exactly that many tests, all passed.
      # AFTER the run of the runner user, never before it (run 43271443150 of PR 483: with this step first, every launch of the run that followed
      # waited for the browser's readiness line until its timeout, and the job was cancelled at 40 minutes; the same head without the step had 748
      # green). Whatever root leaves behind (files under the runner's home or /tmp, /etc/resolv.conf, an address on lo) cannot reach a launch of the
      # runner user any more; the step after this one prints what it left, and decides nothing.
      # tests/test_the_root_e2e_run_in_the_root_step_and_nowhere_else.py holds this step to the suite's list, the rows of the parts without it, the part and the order.
      - name: The root e2e (wrapper.e2e.udp.exit), as root, as the gate runs them
        if: matrix.part == 1 && (success() || failure())
        env:
          PYTHONUNBUFFERED: "1"
          ROOT_FILES: tests/test_a_proxy_that_cannot_carry_udp_leaks_nothing_direct_e2e.py
          ROOT_NODES: tests/test_the_whole_udp_chain_by_name_e2e.py::test_a_turn_srflx_by_name_arrives_through_the_relay_before_the_tick
          ROOT_TESTS: "7"
        run: |
          sudo rm -rf /opt/ff
          sudo cp -a "$(dirname "$FF")" /opt/ff
          sudo chown -R root:root /opt/ff
          sudo chmod -R go+rX /opt/ff
          ROOT_FF="/opt/ff/$(basename "$FF")"
          JUNIT="${RUNNER_TEMP}/root-e2e.xml"
          sudo -H -E env -u PYTEST_ADDOPTS -u XDG_RUNTIME_DIR INVPW_REQUIRE_TRAP=1 "PATH=$PATH" INVPW_BINARY_PATH="$ROOT_FF" STEALTHFOX_E2E_BINARY="$ROOT_FF"             python -m pytest $ROOT_FILES $ROOT_NODES -m e2e -o addopts='' -o junit_family=xunit2 -q -p no:cacheprovider -p no:rerunfailures -rs --junitxml="$JUNIT" || true
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "root-e2e.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print("root e2e:", counts)
          if counts["tests"] != int(os.environ["ROOT_TESTS"]) or counts["failures"] or counts["errors"] or counts["skipped"]:
              sys.exit("the root e2e must be exactly %s tests, all passed: %s" % (os.environ["ROOT_TESTS"], counts))
          PY
      # THE SANDBOX E2E (wrapper.e2e.udp.sandbox), as the gate runs it: the browser WITH its sandbox, run by the runner user. On this runner AppArmor
      # refuses user namespaces to a normal user (kernel.apparmor_restrict_unprivileged_userns=1), so the browser of every other step starts WITHOUT the sandbox
      # of its socket and content processes, and tests/test_the_socket_process_is_sandboxed_e2e.py (which fails unless both have a seccomp filter) can only
      # be green after the restriction is turned off. No row of the parts holds the tests of the suite (SANDBOX_FILES / SANDBOX_NODES are its list: the file
      # and the three situations of the UDP line, which the rows leave to this suite), so the first cannot fail on a runner without the sysctl, and they run
      # here, in part 1 only, after the run and the root step (whatever the sysctl changes cannot reach a launch of the run), as the runner user. Nothing
      # is skipped silently: the step reads its own junit and refuses anything but exactly that many tests, all passed.
      # tests/test_the_sandbox_e2e_runs_where_user_namespaces_are_on.py holds this step to the suite's list, the rows of the parts without it, the part and the order.
      - name: The sandbox e2e (wrapper.e2e.udp.sandbox), with unprivileged user namespaces on
        if: matrix.part == 1 && (success() || failure())
        env:
          PYTHONUNBUFFERED: "1"
          SANDBOX_FILES: tests/test_the_socket_process_is_sandboxed_e2e.py
          SANDBOX_NODES: tests/test_webrtc_realness.py::test_the_gather_is_real_without_a_proxy tests/test_webrtc_realness.py::test_a_gateway_with_coherent_udp_gives_the_page_a_srflx_born_through_its_relay tests/test_ice_names_by_the_context_proxy_e2e.py::test_a_gateway_without_udp_resolves_the_ice_name_then_ends_in_701
          SANDBOX_TESTS: "13"
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          JUNIT="${RUNNER_TEMP}/sandbox-e2e.xml"
          xvfb-run -a env -u PYTEST_ADDOPTS INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" python -m pytest $SANDBOX_FILES $SANDBOX_NODES -m e2e -o addopts='' -o junit_family=xunit2 -q -p no:cacheprovider -p no:rerunfailures -rs --junitxml="$JUNIT" || true
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "sandbox-e2e.xml")).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print("sandbox e2e:", counts)
          if counts["tests"] != int(os.environ["SANDBOX_TESTS"]) or counts["failures"] or counts["errors"] or counts["skipped"]:
              sys.exit("the sandbox e2e must be exactly %s tests, all passed: %s" % (os.environ["SANDBOX_TESTS"], counts))
          PY
      - name: What the root step left behind (diagnostic, decides nothing)
        if: always() && matrix.part == 1
        run: |
          echo "-- files owned by root under the runner's home and /tmp"; sudo find /home/runner /tmp -maxdepth 3 -user root 2>/dev/null | head -40 || true
          echo "-- /etc/resolv.conf"; cat /etc/resolv.conf || true
          echo "-- lo"; ip -4 addr show lo || true

      # The leg ran with the pinned database, and the core never went past it to GitHub (tests/geoip_used.py wrote what it did).
      - name: The leg ran with the pinned GeoIP database
        if: always()
        shell: bash
        run: |
          python scripts/ci_lab_geoip.py evidence --out "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" > /dev/null
          python scripts/ci_lab_geoip.py verify --evidence "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" --used "$GEOIP_USED_OUT"


      # Runs ONLY if the full run above fails, and before 2026-08-13 it could not
      # exist: the hang was killed by the 40-minute ceiling, so the job came out
      # `cancelled` and the following steps did not start at all. With
      # `--timeout 420 --timeout-method thread` the process dies at 7 minutes and the
      # step fails NORMALLY, so the evidence comes out from here.
      # A tool that cannot be seen is indistinguishable from one that does not exist.
      # The announcement the watchdog prints when it opens the file ends up
      # inside `pytest_runtest_setup`, which pytest CAPTURES: it does not show
      # up in the job log, so from there one could not tell "armed" from "inert".
      # This step asks the file instead, which is the only proof that exists.
      - name: Was the watchdog armed?
        if: always()
        run: |
          f="${RUNNER_TEMP}/e2e-watchdog.log"
          if [ -s "$f" ]; then
            # `|| true` is not cosmetic: `grep -c` that counts ZERO exits 1, and
            # GitHub runs `run:` blocks with `bash -e`. Without it, this step
            # died exactly on the HEALTHY runs - the ones with zero stacks - i.e.
            # it would have failed every green e2e. Found by executing the block
            # extracted from the YAML in all four states, not by rereading it.
            watched=$(grep -ac '^---' "$f" || true)
            stack=$(grep -ac 'Timeout' "$f" || true)
            echo "armed: ${watched} tests watched, ${stack} stacks written"
          else
            echo "::warning::the watchdog file is missing or empty: the tool was NOT armed, and a hang would leave nothing"
          fi

      # `always()` and not `failure()`: the file is needed even when the run is
      # green, because it is the only proof that the tool works.
      - name: Upload the hang evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-watchdog-linux-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14

      # The junit of every pass of the run (scripts/run_e2e.py writes one per pass, e2e-junit-*.xml, in the directory of the watchdog file) and of the two
      # steps above that run alone (root, sandbox; part 1 only, absent from the others): what a red is read from, kept whether the run is green or red.
      - name: Upload the junit of the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-junit-linux-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e-junit-*.xml
            ${{ runner.temp }}/root-e2e.xml
            ${{ runner.temp }}/sandbox-e2e.xml
          if-no-files-found: warn
          retention-days: 14

      # What the tests that measure save for a reader (the boxes of tests/test_a_screenshot_draws_the_text_of_the_bundled_fonts_as_the_content_does_e2e.py:
      # the two PNG files, the screenshot and a result.json per case), under RUNNER_TEMP/invpw-evidence, whether the run is green or red. Nothing there
      # when no such test ran (an engine older than firefox-66 skips it), which is not a warning.
      - name: Upload what the tests saved
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invpw-evidence-linux-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invpw-evidence
          if-no-files-found: ignore
          retention-days: 14

  # THE CHECK OF THE LINUX e2e. `e2e (linux, xvfb)` is the name scripts/e2e_is_green.py, the branch protection and every reader before the split know:
  # it is green only when every part is green. `needs.e2e-linux.result` is the result of the matrix as a whole (`success` only when every part succeeded;
  # one failed, cancelled or skipped part makes it something else), and anything but `success` is red here: a cancelled part measured nothing, a skipped
  # one ran nothing. `always()` so that a red or cancelled part still reaches this job and turns it red instead of skipping it, which reads as not red.
  # The gate of the core on the index stays the same as for the parts: while the pinned core is not on the index the parts are skipped with the reason in
  # the summary (core-on-index.yml), and so is this job, as the Linux job was before the split.
  # tests/test_ci_runs_once_per_commit.py (5.) holds this job.
  e2e:
    name: e2e (linux, xvfb)
    needs: [core-on-index, e2e-linux]
    if: always() && needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the Linux e2e is green
        env:
          PARTS: ${{ needs.e2e-linux.result }}
        run: |
          echo "the parts of the Linux e2e: $PARTS"
          if [ "$PARTS" != "success" ]; then
            echo "::error::the Linux e2e is not green: its parts ended in '$PARTS' (success is the only green)"
            exit 1
          fi

  # ``Control+A`` selects all in a field, on the PUBLISHED engine and the core this package pins, on Windows, where the keyboard of a real
  # user is: the shortcut letter used to reach the browser as Control+Shift+A (invisible-core 63.66.0 fixes it). The e2e is red on the
  # keyboard that held Shift for the capital A (tests/test_control_a_selects_all_in_a_field_e2e.py: 5 ways to press it x an <input> and a
  # <textarea>, in-process and served to the stock Playwright client). Same gate as the Linux job: it is SKIPPED, with the reason in the
  # summary, until the core is on the index, and it runs unchanged after; `workflow_dispatch` with `only: windows-control-a` runs it alone.
  e2e-windows-control-a:
    name: e2e (windows, Control+A)
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    # TEMP and TMP on D:\a\_temp (the runner's temp folder): the Firefox profiles land in TEMP and on C: they saturate the disk (queue up to 144,
    # latencies up to 4 s, parent main thread still 40-60 s). On the job, not in a step: `runner.temp` is not readable in a job's `env`.
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    # `run:` blocks are PowerShell on Windows unless said otherwise (e2e-hunt.yml had a ParserError on its first launch there).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      # The runner's screen (1024x768 by default) is smaller than the browser window the e2e open (1936x1048 for a 1920x1080 identity), so the
      # OS cursor cannot be parked outside it (tests/_os_cursor.py) and a native move for it reaches the page. 1920x1080 is the largest mode the
      # runner's video device accepts (run 45730213378 of oss-invisible/playwright): it leaves the strip below the window free. Declared here, read back.
      - name: The runner's screen is 1920x1080, larger than the browser window is tall (read back)
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "the runner's screen: $($b.Width)x$($b.Height) at $($b.X),$($b.Y)"
          if ($b.Width -lt 1920 -or $b.Height -lt 1080) { Write-Error "the runner's screen is $($b.Width)x$($b.Height), not 1920x1080: the OS cursor could not be parked outside the browser window"; exit 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: Install wrapper + test deps (the stock client is in the dev extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      # The security state is a ready directory of the repository (ci/security-state/, a result with no data, the sha256 in ci/security-state.pin.json): with
      # STEALTHFOX_SECURITY_STATE set the core neither downloads nor generates one. BEFORE `fetch`, which makes the state present (it would download and generate it).
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The keyboard shortcut selects all (the browser opens on the runner's desktop, as in e2e-hunt.yml)
        env:
          PYTHONUNBUFFERED: "1"
        run: INVPW_BINARY_PATH="$FF" python -u -m pytest -m e2e -p no:cacheprovider -v tests/test_control_a_selects_all_in_a_field_e2e.py

  # THE SAME e2e ON WINDOWS (Federico, 12/11: every test of the product runs on Linux AND Windows; where Windows behaves
  # differently the test adapts to the system). Before this, 562 of the 808 e2e had never run on Windows in any round. The census
  # of 12/11 (run 43307193708) took ~50 minutes in one job, so the files are split in four parts: the rows `wrapper.e2e.suite.windows.1`
  # to `.4` of ci/required-suites.json, balanced on the test times measured on Windows (a split that does not move when a file is added
  # elsewhere: a new file is added by hand to a row). Left out of the rows, by name, are the suites ci/required-suites.json declares
  # `linux_only` (the reason is on the row) and the tests that skip on Windows; tests/test_the_e2e_suite_is_accounted_for.py holds the
  # partition whole and tests/test_every_suite_runs_on_linux_and_windows.py holds both systems together.
  e2e-windows:
    name: e2e (windows, part ${{ matrix.part }})
    needs: core-on-index
    if: needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    runs-on: windows-2022
    timeout-minutes: 40
    # TEMP and TMP on D:\a\_temp (the runner's temp folder): the Firefox profiles land in TEMP and on C: they saturate the disk (queue up to 144,
    # latencies up to 4 s, parent main thread still 40-60 s). On the job, not in a step: `runner.temp` is not readable in a job's `env`.
    env:
      TEMP: 'D:\a\_temp'
      TMP: 'D:\a\_temp'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      # The runner's screen (1024x768 by default) is smaller than the browser window the e2e open (1936x1048 for a 1920x1080 identity), so the
      # OS cursor cannot be parked outside it (tests/_os_cursor.py) and a native move for it reaches the page. 1920x1080 is the largest mode the
      # runner's video device accepts (run 45730213378 of oss-invisible/playwright): it leaves the strip below the window free. Declared here, read back.
      - name: The runner's screen is 1920x1080, larger than the browser window is tall (read back)
        shell: pwsh
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "the runner's screen: $($b.Width)x$($b.Height) at $($b.X),$($b.Y)"
          if ($b.Width -lt 1920 -or $b.Height -lt 1080) { Write-Error "the runner's screen is $($b.Width)x$($b.Height), not 1920x1080: the OS cursor could not be parked outside the browser window"; exit 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      # The A/A of the three A/B oracles (page, network, host) runs on the first seeds of the candidate set on a pull request, and on ALL of them when the pull request
      # changes a file of that oracle (scripts/ci_ab_pr_seeds.py holds the lists). The checkout is shallow, so the script fetches the base commit and lists the files that
      # differ from it (`git diff --name-only <base> HEAD`: HEAD is the merge commit, so this is the pull request's own change); the tests read the variables it prints.
      - name: How many seeds the A/A of each oracle visits (all of them when the pull request touches the oracle)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ab_pr_seeds.py "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      # The security state is a ready directory of the repository (ci/security-state/, a result with no data, the sha256 in ci/security-state.pin.json): with
      # STEALTHFOX_SECURITY_STATE set the core neither downloads nor generates one. BEFORE `fetch`, which makes the state present (it would download and generate it).
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(cd "$RUNNER_TEMP" && python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      # The GeoIP database made by the repository, as on the Linux run (no download, the same bytes every run).
      - name: The GeoIP database (made by the repository, same bytes every run)
        run: python scripts/ci_lab_geoip.py build
      # The files of the part are the rows `wrapper.e2e.suite.windows.N` of ci/required-suites.json (files, and node ids where a file has tests that skip on
      # Windows or run in another suite): the same list the gate of the candidate runs on the engine under test, so what is measured here and there is one
      # partition. tests/test_the_e2e_suite_is_accounted_for.py holds it whole, and the suites declared `linux_only` are left out of it by name.
      - name: The files of this part (the row of the suite, in ci/required-suites.json)
        run: python scripts/ci_verdict.py args --required ci/required-suites.json --suite "wrapper.e2e.suite.windows.${{ matrix.part }}" --os windows > "$RUNNER_TEMP/e2e_args.txt"
      - name: Run this part of the e2e
        env:
          PYTHONUNBUFFERED: "1"
          INVPW_TEST_WATCHDOG_FILE: ${{ runner.temp }}/e2e-watchdog.log
        run: |
          mapfile -t ARGS < <(tr -d '\r' < "$RUNNER_TEMP/e2e_args.txt")
          python -u scripts/run_e2e.py "$FF" "${ARGS[@]}"
      - name: The leg ran with the pinned GeoIP database
        if: always()
        run: |
          python scripts/ci_lab_geoip.py evidence --out "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" > /dev/null
          python scripts/ci_lab_geoip.py verify --evidence "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" --used "$GEOIP_USED_OUT"
      - name: Close every Firefox left
        if: always()
        shell: pwsh
        run: |
          Get-Process firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "left: " + @(Get-Process firefox -ErrorAction SilentlyContinue).Count
      - name: Upload the hang evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-watchdog-windows-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-watchdog.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the junit of the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-junit-windows-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-junit-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload what the tests saved
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invpw-evidence-windows-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/invpw-evidence
          if-no-files-found: ignore
          retention-days: 14

  # ``The network oracle``: the A/A of tests/test_ab_network_e2e.py (the P4 journey and the lab, the published engine against itself) on its own job, Linux and Windows,
  # as its gate leg runs it. On a pull request that changes the oracle it visits all five seeds of the candidate set (scripts/ci_ab_pr_seeds.py), 37 minutes at most
  # for the run (the test's own guard, from the measured runs plus 25%; about 20 minutes on Linux and 22 on Windows measured in run 45153612447), which would not fit in
  # the shared job's 40 minutes next to everything else. The shared jobs leave this file out (OWN_JOB_FILES
  # above, `own_job` in the Windows parts). The same setup as the shared jobs: the security state, the engine, the GeoIP database made by the repository.
  e2e-network:
    name: e2e (network, linux)
    needs: [core-on-index, linux-deps-e2e]
    if: needs.core-on-index.outputs.available == 'true' && inputs.only != 'windows-control-a'
    runs-on: ubuntu-24.04
    # the network oracle's own guard (2197 s, two engine runs: the measured runs 45121964904 and 45153612447 plus 25%) and the job's own steps, with room for a slow runner
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - name: How many seeds the A/A of each oracle visits (all of them when the pull request touches the oracle)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_ab_pr_seeds.py "$BASE_SHA" >> "$GITHUB_ENV"
      - name: Install wrapper + test deps (+ Playwright ONLY as a system tool)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install "playwright==$(cat scripts/playwright_pin.txt)"
      - name: The Linux packages (the run's linux-deps-e2e job, no mirror)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.linux-deps-e2e.outputs.artifact }}
          path: /tmp/linux-deps
      - name: System deps (xvfb, strace, gdb, elfutils + Firefox runtime libs; the repository of the linux-deps-e2e job)
        shell: bash
        run: |
          set -euo pipefail
          # The run's linux-deps repository and nothing else: apt reads only its sources list and lists folder, the files are already in apt's archives,
          # and the roots are installed by name with --no-download: a package the repository does not hold is named here and red, never fetched.
          read -r OS VER < /tmp/linux-deps/image.txt
          echo "the repository was read on $OS $VER; this runner is $ImageOS $ImageVersion"
          sudo mkdir -p /tmp/linux-deps-apt/lists/partial /tmp/linux-deps-apt/parts
          echo "deb [trusted=yes] file:/tmp/linux-deps ./" | sudo tee /tmp/linux-deps-apt/sources.list >/dev/null
          APT="-o Dir::Etc::SourceList=/tmp/linux-deps-apt/sources.list -o Dir::Etc::SourceParts=/tmp/linux-deps-apt/parts -o Dir::State::Lists=/tmp/linux-deps-apt/lists -o Acquire::Languages=none"
          sudo apt-get $APT update
          sudo cp /tmp/linux-deps/*.deb /var/cache/apt/archives/
          sudo apt-get $APT install -y --no-download --no-install-recommends $(cat /tmp/linux-deps/roots.txt)
      # What a browser that did not end with 0 leaves is kept by the oracle (scripts/ci_crash_evidence.py): the core goes through gdb (every thread's backtrace, the MOZ_CRASH reason, the
      # libraries, with the build ids from elfutils). The kernel writes the core where its pattern says, so the pattern points at a folder of the job (INVPW_CORE_DIR); the launches
      # allow cores themselves (`ulimit -c unlimited` in the host oracle's stand-in, the soft limit raised to the hard one in the page and network oracles). Nothing here reaches a
      # launch that does not crash: no environment variable of the browser, no pref, no crash reporter option.
      - name: Cores of a browser that did not end with 0 (gdb, elfutils, where the kernel writes them)
        run: |
          mkdir -p "$RUNNER_TEMP/cores"
          chmod 1777 "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%e.%p.%t"
          echo "INVPW_CORE_DIR=$RUNNER_TEMP/cores" >> "$GITHUB_ENV"
          cat /proc/sys/kernel/core_pattern
      - name: The security state (a fixed directory of the repository)
        shell: bash
        run: python scripts/ci_lab_security_state.py set --pin ci/security-state.pin.json
      - name: Fetch the published firefox binary
        run: echo "FF=$(python -m invisible_playwright fetch | tail -1)" >> "$GITHUB_ENV"
      - name: The GeoIP database (made by the repository, same bytes every run)
        shell: bash
        run: python scripts/ci_lab_geoip.py build
      - name: Run the network oracle's A/A
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a env -u PYTEST_ADDOPTS INVPW_BINARY_PATH="$FF" STEALTHFOX_E2E_BINARY="$FF" python -u -m pytest tests/test_ab_network_e2e.py -m e2e -o addopts= -o junit_family=xunit2 -p no:cacheprovider -p no:rerunfailures -rs -v --junitxml="$RUNNER_TEMP/network-e2e.xml"
          python - "$RUNNER_TEMP/network-e2e.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          counts = {k: int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped")}
          print(counts)
          sys.exit(0 if counts == {"tests": 1, "failures": 0, "errors": 0, "skipped": 0} else 1)
          PY
      - name: The leg ran with the pinned GeoIP database
        if: always()
        shell: bash
        run: |
          python scripts/ci_lab_geoip.py evidence --out "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" > /dev/null
          python scripts/ci_lab_geoip.py verify --evidence "$(dirname "$GEOIP_USED_OUT")/geoip-evidence.json" --used "$GEOIP_USED_OUT"
      - name: Upload what the test saved
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: invpw-evidence-network-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/invpw-evidence
            ${{ runner.temp }}/network-e2e.xml
          if-no-files-found: ignore
          retention-days: 14

  e2e-network-windows:
